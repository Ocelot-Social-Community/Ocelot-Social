# CodeRabbit Configuration
# https://docs.coderabbit.ai/guides/configure-coderabbit

# Reviews, summaries and walkthroughs are written in English, which every contributor reads.
# Chat replies follow the language of whoever writes (see tone_instructions).
language: en-US

reviews:
  pre_merge_checks:
    docstrings:
      mode: "off"

  # Review every PR automatically
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - master
      - main

  auto_approve:
    enabled: true

  # Review settings
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  changed_files_summary: true

  # Path filters (files to ignore)
  path_filters:
    - "!**/*.lock"
    - "!**/package-lock.json"
    - "!**/*.snap"
    - "!**/*.png"
    - "!**/coverage/**"
    - "!**/dist/**"
    - "!**/node_modules/**"
    - "!**/*.min.js"
    - "!**/*.min.css"
    - "!**/.git/**"
    - "!**/storybook-static/**"

  # Instructions for specific paths
  path_instructions:
    - path: "webapp/**/*.vue"
      instructions: |
        Check Vue.js best practices:
        - Composition API usage
        - Props validation
        - Event handling
        - Reactivity

    - path: "webapp/**/*.spec.js"
      instructions: |
        Check test quality:
        - Meaningful test names
        - Edge cases covered
        - Mocking used correctly

    - path: "backend/**/*.js"
      instructions: |
        Check backend best practices:
        - Error handling
        - Input validation
        - SQL injection prevention
        - Performance (N+1 queries)

    - path: "packages/ui/**/*.ts"
      instructions: |
        Check UI library standards:
        - TypeScript typing
        - Vue 2/3 compatibility (vue-demi)
        - Accessibility (WCAG 2.1)
        - CVA variant pattern

    - path: "packages/ui/**/*.vue"
      instructions: |
        Check UI components:
        - Render function pattern for vue-demi
        - Props with correct types
        - Slots documented
        - No template syntax (only h() for Vue 2/3 compatibility)

# Chat commands
chat:
  auto_reply: true

# Tone and style
tone_instructions: |
  Be constructive and friendly. Explain the "why" behind suggestions.
  Prioritize security > correctness > performance > readability.
  Suggest concrete code changes where possible.
  In chat, reply in the language the user writes in.

# Knowledge base (repository-specific knowledge)
knowledge_base:
  learnings:
    scope: auto
  issues:
    scope: auto
  pull_requests:
    scope: auto
