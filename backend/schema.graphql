  setGroupMembershipVisibility(groupId: ID!, showOnProfile: Boolean!): MEMBER_OF

  """
  Set a single policy key to a value. Requires the `policy.manage` permission.
  """
  setPolicy(key: PolicyKey!, value: String!): PolicyChangeEvent!

  """
  Choose which trophy badge to display in a given slot (null clears the slot). Requires authentication.
  """
  setTrophyBadgeSelected(badgeId: ID, slot: Int!): User

  """
  Set a user's single role (replaces their current role). Requires the `role.manage` permission.
  """
  setUserRole(roleName: String!, userId: ID!): User!

  """
  Assign a verification badge to a user. Requires the `badge.manage` permission.
  """
  setVerificationBadge(badgeId: ID!, userId: ID!): User

  """Shout (endorse) the given post or comment. Requires authentication."""
  shout(id: ID!, type: ShoutTypeEnum!): Boolean!

  """
  Start or stop observing a post (to receive notifications about its comments). Requires authentication.
  """
  toggleObservePost(id: ID!, value: Boolean!): Post!

  """Unblock a previously blocked user. Requires authentication."""
  unblockUser(id: ID!): User

  """Unfollow a user. Requires authentication."""
  unfollowUser(id: ID!): User

  """Unmute a previously muted group. Requires membership."""
  unmuteGroup(groupId: ID!): Group

  """Unmute a previously muted user. Requires authentication."""
  unmuteUser(id: ID!): User

  """Remove a group pin. Restricted to those allowed to pin in that group."""
  unpinGroupPost(id: ID!): Post

  """Remove an instance-wide pin. Requires the `post.pin` permission."""
  unpinPost(id: ID!): Post

  """Remove a post's push/boost. Requires the `post.push` permission."""
  unpushPost(id: ID!): Post!

  """
  Withdraw a shout from the given post or comment. Requires authentication.
  """
  unshout(id: ID!, type: ShoutTypeEnum!): Boolean!

  """Rename one of your own API keys. Requires authentication."""
  updateApiKey(id: ID!, name: String!): ApiKey!

  """Update the current user's online/away status. Requires authentication."""
  updateOnlineStatus(status: OnlineStatus!): Boolean!

  """
  Replace an existing role's permission bundle. Requires the `role.manage` permission.
  """
  updateRole(name: String!, permissions: [String!]!): Role!
}

"""
Relationship representing a notification delivered to a user about some source activity.
"""
type NOTIFIED {
  createdAt: String!

  """The post, comment or group the notification is about."""
  from: NotificationSource
  id: ID!

  """Whether the recipient has read the notification."""
  read: Boolean
  reason: NotificationReason

  """The user who triggered the notification, when applicable."""
  relatedUser: User

  """The recipient of the notification."""
  to: User
  updatedAt: String!
}

"""Ordering options for the notifications query."""
enum NotificationOrdering {
  createdAt_asc
  createdAt_desc
  updatedAt_asc
  updatedAt_desc
}

"""Why a notification was created."""
enum NotificationReason {
  changed_group_member_role
  commented_on_post

  """A user the recipient follows published a post."""
  followed_user_posted
  mentioned_in_comment
  mentioned_in_post

  """A new post was created in a group the recipient belongs to."""
  post_in_group
  removed_user_from_group
  user_joined_group
  user_left_group
}

"""The kind of node a notification originates from."""
union NotificationSource = Comment | Group | Post

"""A user's self-reported presence state."""
enum OnlineStatus {
  away
  online
}

"""
A single entry in the permission catalog: a grantable right and its metadata.
"""
type Permission {
  """
  Whether the permission is effective right now for the requesting viewer's config/policy. False ⇒ the feature is not configured/enabled; the admin UI disables granting it.
  """
  available: Boolean!
  description: String!

  """
  The runtime feature gate this permission depends on (e.g. videoCall, apiKeys), or null when it is always effective.
  """
  gatedBy: String
  group: String!
  key: String!
}

"""
A signal that effective permissions may have changed (a role's permission set, or a user's role assignment). Clients refetch their own myPermissions on receipt — the payload carries only the affected role name, no actor (Datensparsamkeit).
"""
type PermissionsChanged {
  """
  Set only for a rename: the role's former name, so an admin roles view with this role selected can follow the selection to its new name.
  """
  previousRoleName: String
  roleName: String
}

"""Instance-wide pinned-post counters."""
type PinnedPostCounts {
  currentlyPinnedPosts: Int!
}

"""An applied change to a single policy key, with audit metadata."""
type PolicyChangeEvent {
  actor: String!
  key: PolicyKey!
  timestamp: String!
  value: String!
}

type PolicyConfigEntry {
  """
  Whether all hard env requirements are met (always true when there are none). Policy→policy dependencies (requiresPolicy on the policy query) are folded live in the client, not here, so re-enabling a dependency un-greys the dependent key without a refetch.
  """
  available: Boolean!

  """
  Admin display group the key belongs to (e.g. registration, features, layout, video).
  """
  category: String!

  """
  The configured default = env seed if set, else the software default, JSON-encoded.
  """
  configuredDefault: String!

  """
  Effective value (env-folded), JSON-encoded. This is what the permission gates read.
  """
  effective: String!

  """Name of the env var that SEEDS the default (soft), or null."""
  envSeed: String

  """Presence of the envSeed var, or null when the key has no envSeed."""
  envSeedState: ConfigKeyState

  """The policy key (e.g. videoConference, apiKeysEnabled)."""
  key: String!

  """
  Hard env requirements with their presence state (empty when the key needs no env).
  """
  requiresEnv: [EnvKeyStatus!]!

  """The software default baked into the schema, JSON-encoded."""
  softwareDefault: String!

  """Value type: boolean | integer."""
  type: String!
}

"""
The configured policy defaults together with audit info about the last change.
"""
type PolicyDefaults {
  defaults: [PolicyEntry!]!
  lastChange: PolicyLastChange
}

"""
A single policy key with its current (or default) value, JSON-encoded (heterogeneous types: boolean / integer). The value is null for a key the viewer may not see, or a genuinely unset value (e.g. an unlimited limit).
"""
type PolicyEntry {
  key: PolicyKey!

  """
  Other policy keys this one depends on (policy→policy gate): the key is only effective while every listed key is effectively on. Static schema metadata (empty for most keys); the client re-folds it so a layout toggle respects its feature gate (e.g. showGroupButtonInHeader depends on groupsEnabled).
  """
  requiresPolicy: [PolicyKey!]!
  value: String
}

enum PolicyKey {
  activeBranding
  apiKeysEnabled
  apiKeysMaxPerUser
  askForRealName
  badgesEnabled
  brandingComposition
  categoriesActive
  groupsEnabled
  inviteCodesGroupPerUser
  inviteCodesPersonalPerUser
  inviteLinkLimit
  inviteRegistration
  maxGroupPinnedPosts
  maxPinnedPosts
  publicRegistration
  requireLocation
  showContentFilterHeaderMenu
  showContentFilterMasonryGrid
  showGroupButtonInHeader
  socialMediaEnabled
  videoConference
}

"""Who last changed a policy value, and when."""
type PolicyLastChange {
  actor: String!
  timestamp: String!
}

"""A policy key/value change, broadcast to subscribers."""
type PolicyValueChanged {
  key: PolicyKey!
  value: String!
}

"""
A contribution — an article or event — written by a user, optionally within a group.
"""
type Post {
  """ActivityPub activity id, for federated posts."""
  activityId: String
  author: User
  categories: [Category]

  """Number of times the post has been opened."""
  clickedCount: Int!

  """Comments on this post. `orderBy` defaults to oldest first."""
  comments(orderBy: [_CommentOrdering]): [Comment]!

  """Number of visible (non-deleted, non-disabled) comments."""
  commentsCount: Int!

  """Post body as rich text (HTML)."""
  content: String!

  """ISO 8601 date-time string of creation."""
  createdAt: String

  """True once the post has been moderated away."""
  deleted: Boolean

  """True once the post has been disabled by a moderator."""
  disabled: Boolean
  emotions: [EMOTED]

  """Total number of emotional reactions on the post."""
  emotionsCount: Int!

  """Event end time (Event posts)."""
  eventEnd: String

  """Whether the event takes place online (Event posts)."""
  eventIsOnline: Boolean

  """Structured location of the event (Event posts)."""
  eventLocation: Location

  """Name of the event's location (Event posts)."""
  eventLocationName: String

  """Event start time (Event posts)."""
  eventStart: String

  """Venue/room of the event (Event posts)."""
  eventVenue: String

  """The group this post belongs to, or null for a public/timeline post."""
  group: Group

  """Whether the post is pinned within its group."""
  groupPinned: Boolean
  id: ID!

  """The post's hero image."""
  image: Image

  """
  Whether the current user observes this post (receives notifications about its comments).
  """
  isObservedByMe: Boolean!

  """Content language as an IETF/ISO code (e.g. `en`, `de`)."""
  language: String

  """ActivityPub object id, for federated posts."""
  objectId: String

  """Number of users observing this post."""
  observingUsersCount: Int!

  """Whether the post is pinned instance-wide."""
  pinned: Boolean

  """When the post was pinned instance-wide, or null if not pinned."""
  pinnedAt: String

  """The user who pinned the post instance-wide."""
  pinnedBy: User

  """
  The post's type(s), derived from its Neo4j labels (e.g. Article, Event).
  """
  postType: [PostType]

  """Up to 10 other posts sharing a tag or category with this one."""
  relatedContributions: [Post]!
  shoutedBy: [User]!

  """Has the currently logged in user shouted that post?"""
  shoutedByCurrentUser: Boolean!

  """Number of users who have shouted (endorsed) this post."""
  shoutedCount: Int!

  """URL-safe unique handle for the post."""
  slug: String!

  """
  Date used to sort the post in feeds (may differ from createdAt, e.g. for events).
  """
  sortDate: String
  tags: [Tag]!
  title: String!

  """
  Unread notifications for comments in this post targeting the currently logged in user.
  """
  unreadCommentNotificationsByCurrentUser: [NOTIFIED!]!

  """
  Unread notification for this post targeting the currently logged in user, or null.
  """
  unreadNotificationByCurrentUser: NOTIFIED

  """ISO 8601 date-time string of the last update."""
  updatedAt: String

  """Whether the current user has viewed the post's teaser."""
  viewedTeaserByCurrentUser: Boolean!

  """Number of times the post's teaser has been viewed."""
  viewedTeaserCount: Int!
  visibility: Visibility
}

"""
The kind of content a post represents. Stored as an additional Neo4j node label.
"""
enum PostType {
  """A regular text article."""
  Article

  """An event with a date, and optionally a location or online link."""
  Event
}

type Query {
  """List all available badges. Public."""
  Badge: [Badge]

  """List categories. Public."""
  Category(createdAt: String, first: Int, icon: String, id: ID, name: String, offset: Int, orderBy: [_CategoryOrdering], slug: String, updatedAt: String): [Category]

  """List comments. Public."""
  Comment(content: String, createdAt: String, filter: _CommentFilter, first: Int, id: ID, offset: Int, orderBy: [_CommentOrdering], updatedAt: String): [Comment]

  """The current donation campaign state. Requires authentication."""
  Donations: Donations

  """
  List groups. Requires authentication. Filter to the current user's memberships with `isMember`, or to located groups with `hasLocation`.
  """
  Group(
    first: Int

    """If true, only groups that have a location."""
    hasLocation: Boolean
    id: ID

    """
    Null/undefined returns all groups; true only the user's groups; false only groups they are not in.
    """
    isMember: Boolean
    offset: Int
    slug: String
  ): [Group]

  """
  Count groups, optionally restricted to the current user's memberships. Requires authentication.
  """
  GroupCount(isMember: Boolean): Int

  """
  List a group's members. Visibility depends on the viewer's relation to the group. Set `includePending` to also return unapproved join requests (for admins/owners). Set `nameFilter` (min. 3 chars recommended) to search by display name.
  """
  GroupMembers(first: Int, id: ID!, includePending: Boolean, nameFilter: String, offset: Int): [GroupMember]

  """
  List messages in a room, newest first, with index-based paging. Requires authentication.
  """
  Message(beforeIndex: Int, first: Int, offset: Int, orderBy: [_MessageOrdering], roomId: ID!): [Message]

  """
  List posts (the main feed query). Public. Combine with `filter`, `orderBy` and paging for feeds, profiles and groups.
  """
  Post(content: String, createdAt: String, filter: _PostFilter, first: Int, id: ID, imageAspectRatio: Float, imageBlurred: Boolean, language: String, offset: Int, orderBy: [_PostOrdering], pinned: Boolean, slug: String, title: String, updatedAt: String, visibility: Visibility): [Post]

  """
  The emotions the current user has left on a post. Requires authentication.
  """
  PostsEmotionsByCurrentUser(postId: ID!): [String]

  """Count of a single emotion on a post. Public."""
  PostsEmotionsCountByEmotion(data: _EMOTEDInput!, postId: ID!): Int!

  """Instance-wide pinned-post counts. Requires the `post.pin` permission."""
  PostsPinnedCounts: PinnedPostCounts!

  """
  List the current user's chat rooms. Direct rooms are looked up by `userId`, group rooms by `groupId`. Requires authentication.
  """
  Room(before: String, first: Int, groupId: ID, id: ID, orderBy: [_RoomOrdering], search: String, userId: ID): [Room]

  """List hashtags, e.g. for a trending-tags widget. Public."""
  Tag(filter: _TagFilter, first: Int, id: ID, offset: Int, orderBy: [_TagOrdering]): [Tag]

  """
  Number of the current user's rooms with unread messages. Requires authentication.
  """
  UnreadRooms: Int

  """
  Look up users. Requires authentication; filtering by `email` additionally requires the user.email.readAny permission (used for admin user search).
  """
  User(
    about: String
    createdAt: String
    email: String
    filter: _UserFilter
    first: Int
    id: ID
    locationName: String
    name: String
    offset: Int
    orderBy: [_UserOrdering]

    """
    Admin user search: filter by single role (HAS_ROLE) and/or a free-text term (name/slug/about/email). Combinable; requires role.manage.
    """
    roleName: String

    """Free-text search over name/slug/about (and email for admins)."""
    search: String
    slug: String
    updatedAt: String
  ): [User]

  """
  Check whether a signup/verification nonce is valid for the given email. Public.
  """
  VerifyNonce(email: String!, nonce: String!): Boolean!

  """
  Administration overview of API-key usage per user. Requires the `apiKey.administer` permission.
  """
  apiKeyUsers(first: Int, offset: Int): [ApiKeyUserSummary!]!

  """
  All API keys belonging to a given user. Requires the `apiKey.administer` permission.
  """
  apiKeysForUser(userId: ID!): [ApiKey!]!

  """Users the current user has blocked. Requires authentication."""
  blockedUsers: [User]

  """The currently authenticated user. Requires authentication."""
  currentUser: User!

  """Fetch link-preview metadata for a URL. Public."""
  embed(url: String!): Embed

  """The oEmbed providers this instance resolves link previews for. Public."""
  embedProviders: [EmbedProvider!]!

  """Users the current user has muted. Requires authentication."""
  mutedUsers: [User]

  """
  The requesting user's own API keys. Requires authentication and the apiKeysEnabled policy.
  """
  myApiKeys: [ApiKey!]!

  """
  The current viewer's effective permissions, each carrying its catalog group — drives the webapp can() and group-based area gating.
  """
  myPermissions: [EffectivePermission!]!

  """The current user's notifications. Requires authentication."""
  notifications(first: Int, offset: Int, orderBy: NotificationOrdering, read: Boolean): [NOTIFIED]

  """The closed permission catalog (admin / role.manage)."""
  permissionCatalog: [Permission!]!

  """
  The instance's network policy as a key/value list — every recognised policy key, so a client needs no per-key field selection and the set stays in sync with the backend automatically. Public — anonymous viewers (login/register screen) need it. Per-key visibility is enforced in the resolver: a key the viewer may not see carries a null value.
  """
  policy: [PolicyEntry!]!

  """
  Per-policy configuration with its software/env-seed/effective value layers and hard env requirements (policy.manage). Secret values are never returned — only env presence state.
  """
  policyConfig: [PolicyConfigEntry!]!

  """
  The configured policy defaults plus last-change audit info. Requires the `policy.manage` permission.
  """
  policyDefaults: PolicyDefaults!

  """Posts for a user's profile page. Public."""
  profilePagePosts(filter: _PostFilter, first: Int, offset: Int, orderBy: [_PostOrdering]): [Post]

  """
  Search for places via the MapBox geocoder, to attach a location to a profile, group or event. Public.
  """
  queryLocations(lang: String!, place: String!, proximity: String, types: String): [LocationMapBox]!

  """
  List moderation reports for the moderation queue. Requires the `content.moderate` permission.
  """
  reports(
    """Filter by whether the report is closed."""
    closed: Boolean
    first: Int
    offset: Int
    orderBy: ReportOrdering

    """Filter by whether the report has been reviewed."""
    reviewed: Boolean
  ): [Report]

  """
  All roles with their permission bundles and member counts (role.manage).
  """
  roles: [Role!]!

  """
  Search for users and groups to start a chat with. Requires authentication.
  """
  searchChatTargets(limit: Int = 10, query: String!): [ChatTarget]!

  """Search groups by name/description. Public."""
  searchGroups(firstGroups: Int, groupsOffset: Int, query: String!): groupSearchResults!

  """Search hashtags. Public."""
  searchHashtags(firstHashtags: Int, hashtagsOffset: Int, query: String!): hashtagSearchResults!

  """Search posts by title/content. Public."""
  searchPosts(firstPosts: Int, postsOffset: Int, query: String!): postSearchResults!

  """
  Combined search across posts, users, tags and groups, for the global search box. Public.
  """
  searchResults(limit: Int = 5, query: String!): [SearchResult]!

  """Search users by name/slug. Public."""
  searchUsers(firstUsers: Int, query: String!, usersOffset: Int): userSearchResults!

  """
  Instance-wide usage counters. Requires the `network.statistics.read` permission.
  """
  statistics: Statistics!

  """
  Every environment variable the deployment recognises, with its effective/override/env-value/software-default layers and presence state (policy.manage). Secret values are never returned — only presence state.
  """
  systemConfig: [SystemConfigEntry!]!

  """
  Fetch a user together with their posts. Defaults to the current user when no id is given. Requires authentication.
  """
  userData(id: ID): UserData

  """
  The roles assigned to a specific user (role.manage) — for the admin UI.
  """
  userRoles(userId: ID!): [Role!]!

  """
  Look up an invite code and its validity, e.g. on the registration screen. Public.
  """
  validateInviteCode(code: String!): InviteCode

  """Whether video calls are enabled on this instance. Public."""
  videoCallConfig: VideoCallConfig!

  """
  Current number of participants in a group's video call. Requires authentication.
  """
  videoCallParticipantCount(groupId: ID!): Int!
}

"""Relationship recording a moderator's decision on a report."""
type REVIEWED {
  """Whether the moderator closed the report."""
  closed: Boolean!
  createdAt: String!

  """Whether the moderator disabled (hid) the reported resource."""
  disable: Boolean!

  """The moderator who made the decision."""
  moderator: User
  report: Report
  resource: ReviewedResource
  updatedAt: String!
}

"""
Reason a report was filed. This list equals the strings of an array in file `webapp/constants/modals.js`.
"""
enum ReasonCategory {
  """Unsolicited advertising of products, services or commercial offers."""
  advert_products_services_commercial

  """Criminal behaviour or violation of (German) law."""
  criminal_behavior_violation_german_law

  """Discrimination, racism, sexism and the like."""
  discrimination_etc

  """Publishing private/identifying information (doxing)."""
  doxing

  """Glorification or trivialisation of cruel or inhuman acts."""
  glorific_trivia_of_cruel_inhuman_acts

  """Intentional intimidation, stalking or persecution."""
  intentional_intimidation_stalking_persecution

  """None of the listed categories fits."""
  other

  """Pornographic content or links to it."""
  pornographic_content_links
}

"""
A moderation report about a user, post or comment, aggregating all filings and reviews for that resource.
"""
type Report {
  """Whether the report has been closed by a moderator."""
  closed: Boolean!
  createdAt: String!

  """Whether the reported resource is currently disabled (hidden)."""
  disable: Boolean!

  """All filings submitted against the resource."""
  filed: [FILED]!
  id: ID!
  resource: ReportedResource!

  """All moderator reviews of the report."""
  reviewed: [REVIEWED]!
  rule: ReportRule!
  updatedAt: String!
}

"""Ordering options for the reports query."""
enum ReportOrdering {
  createdAt_asc
  createdAt_desc
}

"""The rule set by which a report's aggregate state is derived."""
enum ReportRule {
  latestReviewUpdatedAtRules
}

"""The kind of node a report can target."""
union ReportedResource = Comment | Post | User

"""The kind of node a moderation decision can apply to."""
union ReviewedResource = Comment | Post | User

"""A named bundle of permissions that can be assigned to users."""
type Role {
  """Number of users currently assigned this role."""
  memberCount: Int
  name: String!

  """The permission keys granted by this role."""
  permissions: [String!]!

  """Whether the role is a protected built-in that cannot be deleted."""
  protected: Boolean!
}

"""
A chat room, either a one-to-one direct conversation between two users or the shared chat room of a group.
"""
type Room {
  """
  Alias of `id`, kept for the chat frontend (vue-advanced-chat keys objects by `_id`).
  """
  _id: String @deprecated(reason: "Use `id`.")

  """
  Display avatar URL: the group's avatar for a group room, otherwise the other participant's avatar.
  """
  avatar: String
  createdAt: String

  """The group this room belongs to, or null for a direct room."""
  group: Group
  id: ID!

  """True if this is a group room, false for a direct room."""
  isGroupRoom: Boolean!

  """The most recent message in the room."""
  lastMessage: Message

  """Timestamp of the most recent message, for sorting the room list."""
  lastMessageAt: String

  """Alias of id; prefer id in new code."""
  roomId: String!

  """
  Display name: the group's name for a group room, otherwise the other participant's name.
  """
  roomName: String!

  """Count unread messages, excluding those from blocked/muted senders."""
  unreadCount: Int
  updatedAt: String

  """Participants of the room."""
  users: [User]!
}

"""A single hit in the global search, which can be any searchable entity."""
union SearchResult = Group | Post | Tag | User

"""The kind of node that can be shouted (endorsed/boosted)."""
enum ShoutTypeEnum {
  Comment
  Post
}

"""A link to an external social-media profile, shown on a user's profile."""
type SocialMedia {
  id: ID!
  ownedBy: User!
  url: String
}

"""Aggregate counts describing the whole instance."""
type Statistics {
  """Number of trophy badges users have chosen to display."""
  badgesDisplayed: Int!
  badgesRewarded: Int!
  chatMessages: Int!
  chatRooms: Int!
  comments: Int!

  """Number of registered email addresses."""
  emails: Int!
  follows: Int!
  groups: Int!
  inviteCodes: Int!
  inviteCodesExpired: Int!
  inviteCodesRedeemed: Int!
  invites: Int!
  locations: Int!
  notifications: Int!
  posts: Int!
  reports: Int!
  shouts: Int!
  tags: Int!

  """Number of active (non-deleted) user accounts."""
  users: Int!
  usersDeleted: Int!
  usersVerified: Int!
}

type Subscription {
  """Pushes newly added messages in the current user's rooms."""
  chatMessageAdded: Message

  """Pushes delivery/seen status changes for messages."""
  chatMessageStatusUpdated: ChatMessageStatusPayload

  """
  Fires when a user changes which group memberships are visible on their profile.
  """
  groupMembershipVisibilityChanged(userId: ID!): GroupMembershipVisibilityChanged!

  """Fires when a closed group's showMembers setting changes."""
  groupShowMembersChanged(groupId: ID!): GroupShowMembersChanged!

  """Pushes newly created notifications for the current user in real time."""
  notificationAdded: NOTIFIED

  """Fires when a role's permissions or a user's role assignment changes."""
