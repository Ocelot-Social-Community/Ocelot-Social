"""
A personal API key that authenticates programmatic access on behalf of its owner. Only a non-secret prefix and metadata are stored; the secret itself is shown exactly once, at creation.
"""
type ApiKey {
  createdAt: String!

  """True once the key has been revoked."""
  disabled: Boolean!
  disabledAt: String

  """When the key expires, or null if it never expires."""
  expiresAt: String
  id: ID!

  """
  Non-secret leading segment of the key, used to identify it in listings.
  """
  keyPrefix: String!

  """When the key last authenticated a request, or null if never used."""
  lastUsedAt: String

  """Human-readable label chosen by the owner."""
  name: String!
  owner: User
}

"""Aggregated per-user API-key usage, for the administration overview."""
type ApiKeyUserSummary {
  """Number of the user's currently active (non-revoked) keys."""
  activeCount: Int!
  commentsCount: Int!

  """Most recent time any of the user's keys was used, or null."""
  lastActivity: String
  postsCount: Int!

  """Number of the user's revoked keys."""
  revokedCount: Int!
  user: User!
}

"""
Returned exactly once, on creation — the only moment the full secret is exposed.
"""
type ApiKeyWithSecret {
  apiKey: ApiKey!

  """The full API key secret. Store it now; it cannot be retrieved again."""
  secret: String!
}

"""
A badge that can be attached to users — either a verification mark or an awardable trophy.
"""
type Badge {
  createdAt: String
  description: String!

  """Identifier/URL of the badge's icon asset."""
  icon: String!
  id: ID!

  """Whether this badge is the instance-wide default of its type."""
  isDefault: Boolean!

  """Users currently wearing this trophy badge."""
  rewarded: [User]!
  type: BadgeType!

  """Users whose verification this badge represents."""
  verifies: [User]!
}

"""The purpose of a badge."""
enum BadgeType {
  """An achievement a user can be awarded and choose to display."""
  trophy

  """Marks a user as verified."""
  verification
}

"""
A topical category that posts and groups can be filed under. Categories are a fixed, instance-configured taxonomy (unlike free-form tags).
"""
type Category {
  createdAt: String

  """Identifier of the category's icon."""
  icon: String!
  id: ID!
  name: String!

  """Number of posts filed under this category."""
  postCount: Int!
  posts: [Post]!
  slug: String
  updatedAt: String
}

"""Real-time delivery/seen-status update for messages in a room."""
type ChatMessageStatusPayload {
  messageIds: [String!]!
  roomId: ID!
  status: String!
}

"""A candidate recipient when starting a chat: a user or a group."""
union ChatTarget = Group | User

"""A comment written by a user in reply to a post."""
type Comment {
  """ActivityPub activity id, for federated comments."""
  activityId: String
  author: User

  """Comment body as rich text (HTML)."""
  content: String!
  createdAt: String

  """True once the comment has been moderated away."""
  deleted: Boolean

  """True once the comment has been disabled by a moderator."""
  disabled: Boolean
  id: ID!

  """Whether the current user observes the post this comment belongs to."""
  isPostObservedByMe: Boolean!

  """The post this comment belongs to."""
  post: Post

  """Number of users observing the post this comment belongs to."""
  postObservingUsersCount: Int!

  """Whether the current user has shouted (endorsed) this comment."""
  shoutedByCurrentUser: Boolean!

  """Number of users who have shouted (endorsed) this comment."""
  shoutedCount: Int!
  updatedAt: String
}

enum ConfigKeyState {
  empty
  missing
  set
}

"""Resources that can be deleted along with a user account."""
enum Deletable {
  Comment
  Post
}

"""
Instance-wide donation campaign state, shown in the donation progress widget.
"""
type Donations {
  createdAt: String!

  """Fundraising target amount."""
  goal: Int!
  id: ID!

  """Amount raised so far."""
  progress: Int!

  """Whether the donation widget is shown to users."""
  showDonations: Boolean!
  updatedAt: String!
}

"""Relationship representing a user's emotional reaction to a post."""
type EMOTED {
  createdAt: String
  emotion: Emotion

  """The reacting user."""
  from: User

  """The post reacted to."""
  to: Post
  updatedAt: String
}

"""
A permission the current viewer effectively holds, carrying its catalog group so the webapp can gate UI areas by group (e.g. show the admin area for ANY administration-group permission) without a hard-coded key list.
"""
type EffectivePermission {
  group: String!
  key: String!
}

"""An email address belonging to a user, with its verification state."""
type EmailAddress {
  createdAt: String
  email: ID!

  """When the address was verified, or null if still unverified."""
  verifiedAt: String
}

"""
A user's email notification toggles for one category (post, chat or group).
"""
type EmailNotificationSettings {
  settings: [EmailNotificationSettingsOption]
  type: EmailNotificationSettingsType
}

"""Input toggling a single email notification setting on or off."""
input EmailNotificationSettingsInput {
  name: EmailNotificationSettingsName
  value: Boolean
}

"""
An individual email-notification toggle, identifying the event that triggers an email.
"""
enum EmailNotificationSettingsName {
  """The user received a direct chat message."""
  chatMessage

  """Someone commented on a post the user observes."""
  commentOnObservedPost

  """A user the current user follows published a post."""
  followingUsers

  """A user joined a group the user administrates."""
  groupMemberJoined

  """A user left a group the user administrates."""
  groupMemberLeft

  """A member was removed from a group the user administrates."""
  groupMemberRemoved

  """A member's role changed in a group the user administrates."""
  groupMemberRoleChanged

  """The user was mentioned in a post or comment."""
  mention

  """A new post was created in a group the user is a member of."""
  postInGroup
}

"""A single email notification toggle and its current value."""
type EmailNotificationSettingsOption {
  name: EmailNotificationSettingsName
  value: Boolean
}

"""The category a set of email-notification toggles belongs to."""
enum EmailNotificationSettingsType {
  """Notifications about direct chat messages."""
  chat

  """Notifications about group membership events."""
  group

  """Notifications about posts and comments."""
  post
}

"""
oEmbed-style metadata scraped from an external URL, used to render link previews.
"""
type Embed {
  audio: String
  author: String
  date: String
  description: String

  """
  Embeddable HTML fragment (e.g. a player iframe), when the provider offers one.
  """
  html: String

  """URL of a representative preview image."""
  image: String

  """Detected content language."""
  lang: String
  publisher: String
  sources: [String]
  title: String

  """The oEmbed resource type (e.g. link, video, photo, rich)."""
  type: String
  url: String
  video: String
}

"""An oEmbed provider this instance can resolve link previews for."""
type EmbedProvider {
  """Display name, e.g. "YouTube"."""
  name: String!

  """The provider's own site, e.g. "https://youtube.com"."""
  url: String!
}

"""An emotional reaction a user can leave on a post."""
enum Emotion {
  angry
  cry
  funny
  happy
  surprised
}

enum EnvCategory {
  auth
  branding
  database
  features
  general
  layout
  mail
  maps
  monitoring
  redis
  registration
  server
  storage
  video
}

type EnvKeyStatus {
  """The environment variable name (e.g. LIVEKIT_API_SECRET)."""
  name: String!

  """Presence state — the only thing reported; a value is never returned."""
  state: ConfigKeyState!
}

"""
Relationship recording that a user filed a moderation report against a resource, with the stated reason.
"""
type FILED {
  createdAt: String!
  reasonCategory: ReasonCategory!

  """Free-text explanation the reporter provided."""
  reasonDescription: String!

  """The user who filed the report."""
  submitter: User
}

"""A file attached to a chat message."""
type File {
  """Duration in seconds for audio/video files."""
  duration: Float
  extension: String
  name: String

  """MIME type of the file."""
  type: String

  """The file's URL, which also serves as its identifier."""
  url: ID!
}

"""
Input for a file to attach to a chat message. The file itself must be provided as `upload` (attaching without it is rejected); the remaining fields are its metadata.
"""
input FileInput {
  duration: Float
  extension: String
  name: String
  type: String

  """
  The file to upload. Required — the resolver rejects an attachment without it.
  """
  upload: Upload
}

"""
The result of filing a report, echoing the reason and linking to the created report.
"""
type FiledReport {
  createdAt: String!
  reasonCategory: ReasonCategory!
  reasonDescription: String!
  reportId: ID!
  resource: ReportedResource!
}

"""
A group: a space where members share posts, chat and optionally hold video calls. Discoverability and joining are governed by its groupType.
"""
type Group {
  """Short statement of the group's goal."""
  about: String
  actionRadius: GroupActionRadius!
  avatar: Image
  categories: [Category]

  """ISO 8601 date-time string of creation."""
  createdAt: String!

  """Number of posts currently pinned within this group."""
  currentlyPinnedPostsCount: Int!
  deleted: Boolean

  """Full group description (rich text)."""
  description: String!

  """Plain-text excerpt of the description, for previews."""
  descriptionExcerpt: String!
  disabled: Boolean
  groupType: GroupType!
  id: ID!

  """Invite codes to this group the current user has generated."""
  inviteCodes: [InviteCode]!

  """Whether the current user has muted this group."""
  isMutedByMe: Boolean!
  location: Location
  locationName: String

  """Number of members, excluding those with a pending join request."""
  membersCount: Int!

  """
  The current user's role in this group, or null if they are not a member.
  """
  myRole: GroupMemberRole

  """The group's title."""
  name: String!
  posts: [Post]

  """Total number of non-deleted, non-disabled posts in this group."""
  postsCount: Int!

  """For closed groups: whether non-members can see the member list."""
  showMembers: Boolean

  """
  Whether the profile owner has chosen to show this group on their public profile.
  """
  showOnProfile: Boolean

  """URL-safe unique handle for the group."""
  slug: String!

  """ISO 8601 date-time string of the last update."""
  updatedAt: String!
}

"""The geographic reach a group intends its activities to have."""
enum GroupActionRadius {
  continental
  global

  """Tongue-in-cheek maximum reach: beyond planet Earth."""
  interplanetary
  national
  regional
}

"""
A group member paired with their membership relationship (role, join date).
"""
type GroupMember {
  membership: MEMBER_OF
  user: User
}

"""A user's role within a group, in ascending order of privilege."""
enum GroupMemberRole {
  """Can manage members and group settings."""
  admin

  """
  Full control over the group, including deleting it; there is exactly one owner.
  """
  owner

  """
  Membership requested but not yet approved (closed groups); not counted as a member.
  """
  pending

  """Regular member."""
  usual
}

type GroupMembershipVisibilityChanged {
  userId: ID!
}

type GroupShowMembersChanged {
  groupId: ID!
}

"""Determines a group's discoverability and how users become members."""
enum GroupType {
  """
  Anyone can find the group, but joining requires approval by a group admin/owner.
  """
  closed

  """The group is unlisted; it can only be found and joined via invite."""
  hidden

  """Anyone can find the group and join without approval."""
  public
}

"""An image asset (avatar, hero image, etc.) with rendering metadata."""
type Image {
  """Alternative text for accessibility."""
  alt: String

  """Width-to-height ratio, used to reserve layout space before load."""
  aspectRatio: Float

  """
  Whether the image is flagged as sensitive and should be blurred by default.
  """
  sensitive: Boolean

  """URL of a variant resized to the requested width/height."""
  transform(height: Int, width: Int): String

  """MIME type of the image."""
  type: String

  """The image's URL, which also serves as its identifier."""
  url: ID!
}

"""
Input for uploading or updating an image. Provide `upload` to set a new file.
"""
input ImageInput {
  alt: String
  aspectRatio: Float
  sensitive: Boolean
  type: String
  upload: Upload
}

"""
An invite code. A personal code lets its holder register on the instance; a group code additionally grants membership in a specific group. May be limited by an expiry and a redemption limit.
"""
type InviteCode {
  """The code string, which also serves as its identifier."""
  code: ID!

  """Free-form note the issuer attached to the code."""
  comment: String
  createdAt: String!

  """When the code expires, or null if it never expires."""
  expiresAt: String

  """The user who issued the code."""
  generatedBy: User

  """
  The group this code invites into, or null for a personal (registration-only) code.
  """
  invitedTo: Group

  """
  Whether the code can still be redeemed (not expired, invalidated, or over its redemption limit).
  """
  isValid: Boolean!

  """Users who have redeemed this code."""
  redeemedBy: [User]
  redeemedByCount: Int!
}

"""
A geographic place (city, region, country, …) linked to users, groups and events. Places nest via `parent`, forming a hierarchy up to the country level.
"""
type Location {
  """
  Distance in kilometres from the current user's location. Requires authentication.
  """
  distanceToMe: Int
  id: ID!

  """Latitude in decimal degrees (WGS84)."""
  lat: Float

  """Longitude in decimal degrees (WGS84)."""
  lng: Float

  """
  Localized place name. Falls back through the requested `lang`, the instance default language, and finally the raw name/id.
  """
  name(lang: String = ""): String!

  """The enclosing place one level up in the hierarchy."""
  parent: Location

  """The place's granularity (e.g. country, region, place)."""
  type: String!
}

"""A geocoding suggestion returned by the MapBox-backed place search."""
type LocationMapBox {
  id: ID!
  place_name: String!
}

"""
Relationship carrying a user's membership in a group, including their role and when it began.
"""
type MEMBER_OF {
  createdAt: String!
  role: GroupMemberRole!
  showOnProfile: Boolean
  updatedAt: String!
}

"""A single chat message within a room."""
type Message {
  """
  Alias of `id`, kept for the chat frontend (vue-advanced-chat keys objects by `_id`).
  """
  _id: String @deprecated(reason: "Use `id`.")
  author: User!

  """Avatar URL of the sending user."""
  avatar: String
  content: String
  createdAt: String

  """Alias of createdAt; prefer createdAt in new code."""
  date: String!

  """
  Whether the message has been distributed to recipients (delivery-status flag).
  """
  distributed: Boolean

  """Files attached to the message."""
  files: [File]!
  id: ID!

  """
  Monotonically increasing index of the message within its room, used for ordering and paging.
  """
  indexId: Int!
  room: Room!

  """Whether the message has been persisted (delivery-status flag)."""
  saved: Boolean

  """
  Whether the current user has seen the message (always true for messages they sent).
  """
  seen: Boolean

  """Id of the sending user."""
  senderId: String!
  updatedAt: String

  """Display name of the sending user."""
  username: String!
}

type Mutation {
  """
  Add a further email address to the current account, sending a verification nonce. Requires authentication.
  """
  AddEmailAddress(email: String!): EmailAddress

  """
  Add the current user's emotional reaction to a post. Requires authentication.
  """
  AddPostEmotions(data: _EMOTEDInput!, to: _PostInput!): EMOTED

  """
  Change a member's role in a group. Restricted to admins/owners, subject to the role hierarchy.
  """
  ChangeGroupMemberRole(groupId: ID!, roleInGroup: GroupMemberRole!, userId: ID!): GroupMember

  """
  Write a comment on a post. Requires authentication, the `comment.create` permission, and permission to comment on that post.
  """
  CreateComment(content: String!, id: ID, postId: ID!): Comment

  """
  Create a group. Requires authentication and the `group.create_<type>` permission matching the chosen groupType.
  """
  CreateGroup(
    about: String
    actionRadius: GroupActionRadius!
    categoryIds: [ID]
    description: String!
    groupType: GroupType!
    id: ID

    """Empty string '' clears the location (sets it to null)."""
    locationName: String
    name: String!
    showMembers: Boolean
    slug: String
  ): Group

  """Create (or fetch) the chat room for a group. Requires authentication."""
  CreateGroupRoom(groupId: ID!): Room

  """
  Send a message to a room (by `roomId`) or to a user (by `userId`, opening a direct room). Requires authentication.
  """
  CreateMessage(content: String, files: [FileInput], roomId: ID, userId: ID): Message

  """
  Create a post. Requires authentication and the `post.create` permission; posting into a group additionally requires membership of that group.
  """
  CreatePost(
    categoryIds: [ID]
    content: String!

    """Event details; required when postType is Event."""
    eventInput: _EventInput

    """Post into this group; omit for a public/timeline post."""
    groupId: ID
    id: ID
    image: ImageInput
    language: String
    postType: PostType = Article
    slug: String
    title: String!
    visibility: Visibility
  ): Post

  """
  Add a social-media link to your profile. Requires the `socialMedia.create` permission.
  """
  CreateSocialMedia(id: ID, url: String!): SocialMedia

  """Delete one of your own comments. Restricted to the author."""
  DeleteComment(id: ID!): Comment

  """Delete one of your own posts. Restricted to the author."""
  DeletePost(id: ID!): Post

  """Remove one of your own social-media links. Restricted to the owner."""
  DeleteSocialMedia(id: ID!): SocialMedia

  """
  Delete a user account. Allowed for the account owner, or with user.delete.any subject to the act-on hierarchy. Optionally also delete the user's posts and/or comments via `resource`.
  """
  DeleteUser(id: ID!, resource: [Deletable]): User

  """
  Join a group, or accept/approve a pending membership. Allowed per the group's join rules; joining on behalf of another user requires the appropriate rights.
  """
  JoinGroup(groupId: ID!, userId: ID!): GroupMember

  """Leave a group, or (for admins/owners) let a member leave."""
  LeaveGroup(groupId: ID!, userId: ID!): GroupMember

  """
  Mark the given messages as seen by the current user. Requires authentication.
  """
  MarkMessagesAsSeen(messageIds: [String!]): Boolean

  """
  Remove the current user's emotional reaction from a post. Requires authentication.
  """
  RemovePostEmotions(data: _EMOTEDInput!, to: _PostInput!): EMOTED

  """
  Remove a user from a group. Restricted to those allowed to manage the group's members.
  """
  RemoveUserFromGroup(groupId: ID!, userId: ID!): GroupMember

  """
  Begin registration for an email address, sending a verification nonce. Allowed when public or invite registration is enabled (or by an admin with `role.manage`); an inviteCode is required for invite-only registration.
  """
  Signup(email: String!, inviteCode: String = null, locale: String!): EmailAddress

  """
  Complete registration by confirming the nonce and creating the user account. Public.
  """
  SignupVerification(about: String, email: String!, inviteCode: String = null, locale: String, locationName: String = null, name: String!, nonce: String!, password: String!, slug: String, termsAndConditionsAgreedVersion: String!): User

  """Edit one of your own comments. Restricted to the author."""
  UpdateComment(content: String!, id: ID!): Comment

  """
  Update the donation campaign settings. Requires the `donation.manage` permission.
  """
  UpdateDonations(goal: Int, progress: Int, showDonations: Boolean): Donations

  """Update a group's settings. Restricted to admins/owners of the group."""
  UpdateGroup(
    about: String
    actionRadius: GroupActionRadius
    avatar: ImageInput
    categoryIds: [ID]
    description: String
    groupType: GroupType
    id: ID!

    """Empty string '' clears the location (sets it to null)."""
    locationName: String
    name: String
    showMembers: Boolean
    slug: String
  ): Group

  """Update one of your own posts. Restricted to the author."""
  UpdatePost(categoryIds: [ID], content: String!, eventInput: _EventInput, id: ID!, image: ImageInput, language: String, postType: PostType, slug: String, title: String!, visibility: Visibility): Post

  """Update one of your own social-media links. Restricted to the owner."""
  UpdateSocialMedia(id: ID!, url: String!): SocialMedia

  """Update your own profile. Restricted to the account owner."""
  UpdateUser(
    about: String
    allowEmbedIframes: Boolean
    avatar: ImageInput
    email: String
    emailNotificationSettings: [EmailNotificationSettingsInput]
    id: ID!
    locale: String

    """Empty string '' clears the location (sets it to null)."""
    locationName: String
    name: String
    showClosedGroupsOnProfile: Boolean
    showHiddenGroupsOnProfile: Boolean
    showPublicGroupsOnProfile: Boolean
    showShoutsPublicly: Boolean
    slug: String
    termsAndConditionsAgreedAt: String
    termsAndConditionsAgreedVersion: String
  ): User

  """
  Confirm a pending email address via its nonce. Requires authentication.
  """
  VerifyEmailAddress(email: String!, nonce: String!): EmailAddress

  """
  Revoke any user's API key (administration). Requires the `apiKey.administer` permission.
  """
  adminRevokeApiKey(id: ID!): Boolean!

  """
  Revoke all of a user's API keys and return how many were revoked. Requires the `apiKey.administer` permission.
  """
  adminRevokeUserApiKeys(userId: ID!): Int!

  """
  Block a user, cutting off interaction in both directions. Requires authentication.
  """
  blockUser(id: ID!): User

  """Change the current user's password. Requires authentication."""
  changePassword(newPassword: String!, oldPassword: String!): String!

  """
  Create a new API key and return its secret (shown only here). Requires the `apiKey.create` permission (gated by the apiKeysEnabled policy).
  """
  createApiKey(expiresInDays: Int, name: String!): ApiKeyWithSecret!

  """
  Create a new role with the given permission bundle. Requires the `role.manage` permission.
  """
  createRole(name: String!, permissions: [String!]!): Role!

  """
  Delete a role. Returns the deleted role's name (the input name echoed back on success). Requires the `role.manage` permission.
  """
  deleteRole(name: String!): String!

  """
  Reversibly deactivate (disable: true) or reactivate (disable: false) a user account. Moderator-grade, subject to the act-on hierarchy.
  """
  disableUser(disable: Boolean!, id: ID!): User

  """
  File a moderation report against a user, post or comment. Requires authentication.
  """
  fileReport(reasonCategory: ReasonCategory!, reasonDescription: String!, resourceId: ID!): FiledReport

  """Follow a user. Requires authentication."""
  followUser(id: ID!): User

  """
  Issue an invite code granting membership in a group. Restricted to admins/owners of that group.
  """
  generateGroupInviteCode(comment: String = null, expiresAt: String = null, groupId: ID!): InviteCode!

  """
  Issue a personal invite code for registering new users. Requires authentication and the `user.invite` permission.
  """
  generatePersonalInviteCode(comment: String = null, expiresAt: String = null): InviteCode!

  """
  Invalidate one of your invite codes so it can no longer be redeemed. Requires authentication.
  """
  invalidateInviteCode(code: String!): InviteCode

  """
  Join a group's video call, returning the credentials to connect. Requires authentication.
  """
  joinGroupVideoCall(groupId: ID!): VideoCallJoinPayload!

  """Get a JWT Token for the given Email and password"""
  login(email: String!, password: String!): String!

  """
  Mark all of the current user's notifications as read. Requires authentication.
  """
  markAllAsRead: [NOTIFIED]

  """Mark a notification as read. Requires authentication."""
  markAsRead(id: ID!): NOTIFIED

  """Mark a notification as unread. Requires authentication."""
  markAsUnread(id: ID!): NOTIFIED

  """Mark a post's teaser as viewed by the current user. Public."""
  markTeaserAsViewed(id: ID!): Post

  """
  Mute a group so its posts no longer appear in the current user's feed. Requires membership.
  """
  muteGroup(groupId: ID!): Group

  """
  Mute a user, hiding their content from the current user. Requires authentication.
  """
  muteUser(id: ID!): User

  """
  Pin a post within its group. Restricted to those allowed to pin in that group.
  """
  pinGroupPost(id: ID!): Post

  """Pin a post instance-wide. Requires the `post.pin` permission."""
  pinPost(id: ID!): Post

  """
  Push (boost) a post to the top of feeds. Requires the `post.push` permission.
  """
  pushPost(id: ID!): Post!

  """
  Redeem an invite code for the current user (registration and/or group membership). Requires authentication.
  """
  redeemInviteCode(code: String!): Boolean!

  """
  Rename a role, keeping its permission bundle and all its members (its HAS_ROLE edges are preserved). The mandatory owner and user roles cannot be renamed. Requires the `role.manage` permission.
  """
  renameRole(name: String!, newName: String!): Role!

  """Request a password-reset email for the given address. Public."""
  requestPasswordReset(email: String!, locale: String!): Boolean!

  """Reset a password using the nonce from the reset email. Public."""
  resetPassword(email: String!, newPassword: String!, nonce: String!): Boolean!

  """
  Reset several policy keys to their configured defaults in one request (only keys that diverge actually change). Requires the `policy.manage` permission.
  """
  resetPolicies(keys: [PolicyKey!]!): [PolicyChangeEvent!]!

  """
  Reset a single policy key to its configured default. Requires the `policy.manage` permission.
  """
  resetPolicy(key: PolicyKey!): PolicyChangeEvent!

  """Clear all displayed trophy badges. Requires authentication."""
  resetTrophyBadgesSelected: User

  """
  Resynchronise the in-memory role & policy caches from the database. Dev/test-only recovery hook for when an out-of-process change (db:reset / db:seed, the e2e harness) leaves a running server's caches stale; it needs no auth outside production so it works even when no users exist yet (right after a wipe). Disabled in production — there a rolling restart re-reads the DB on each instance's boot.
  """
  resyncCaches: Boolean!

  """
  Record a moderation decision on a reported resource: optionally disable (hide) it and/or close the report. Requires the `content.moderate` permission and must respect the act-on hierarchy for the target user.
  """
  review(closed: Boolean, disable: Boolean, resourceId: ID!): REVIEWED

  """Revoke one of your own API keys. Requires authentication."""
  revokeApiKey(id: ID!): Boolean!

  """Remove a badge from a user. Requires the `badge.manage` permission."""
  revokeBadge(badgeId: ID!, userId: ID!): User

  """
  Award a trophy badge to a user. Requires the `badge.manage` permission.
  """
  rewardTrophyBadge(badgeId: ID!, userId: ID!): User

  """
  Set the current user's active content-filter categories. Requires authentication.
  """
  saveCategorySettings(activeCategories: [String]): Boolean

