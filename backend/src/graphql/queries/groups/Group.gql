query Group($isMember: Boolean, $id: ID, $slug: String) {
  Group(isMember: $isMember, id: $id, slug: $slug) {
    id
    name
    slug
    createdAt
    updatedAt
    disabled
    deleted
    about
    description
    groupType
    actionRadius
    categories {
      id
      slug
      name
      icon
    }
    avatar {
      url
    }
    locationName
    location {
      id
      name
    }
    # eslint-disable-next-line @graphql-eslint/no-deprecated -- deliberately still selected: the deprecated field stays part of the contract until the next major, and the specs assert it keeps working
    myRole
    showMembers
    membersCount
    currentlyPinnedPostsCount
    inviteCodes {
      code
      redeemedByCount
    }
  }
}
