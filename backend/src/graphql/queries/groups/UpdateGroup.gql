mutation UpdateGroup(
  $id: ID!
  $name: String
  $slug: String
  $about: String
  $description: String
  $visibility: GroupVisibility
  $actionRadius: GroupActionRadius
  $categoryIds: [ID]
  $avatar: ImageInput
  $locationName: String # empty string '' sets it to null
  $lat: Float
  $lng: Float
  $showMembers: Boolean
) {
  UpdateGroup(
    id: $id
    name: $name
    slug: $slug
    about: $about
    description: $description
    visibility: $visibility
    actionRadius: $actionRadius
    categoryIds: $categoryIds
    avatar: $avatar
    locationName: $locationName
    lat: $lat
    lng: $lng
    showMembers: $showMembers
  ) {
    id
    name
    slug
    createdAt
    updatedAt
    disabled
    deleted
    about
    description
    visibility
    actionRadius
    categories {
      id
      slug
      name
      icon
    }
    # avatar # test this as result
    locationName
    location {
      id
      name
      lat
      lng
    }
    # eslint-disable-next-line @graphql-eslint/no-deprecated -- deliberately still selected: the deprecated field stays part of the contract until the next major, and the specs assert it keeps working
    myRole
  }
}
