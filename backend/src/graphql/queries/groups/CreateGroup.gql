mutation CreateGroup(
  $id: ID
  $name: String!
  $slug: String
  $about: String
  $description: String!
  $groupType: GroupType!
  $actionRadius: GroupActionRadius!
  $categoryIds: [ID]
  $locationName: String # empty string '' sets it to null
  $lat: Float
  $lng: Float
) {
  CreateGroup(
    id: $id
    name: $name
    slug: $slug
    about: $about
    description: $description
    groupType: $groupType
    actionRadius: $actionRadius
    categoryIds: $categoryIds
    locationName: $locationName
    lat: $lat
    lng: $lng
  ) {
    id
    name
    slug
    createdAt
    updatedAt
    disabled
    deleted
    about
    description
    groupType
    actionRadius
    categories {
      id
      slug
      name
      icon
    }
    locationName
    location {
      id
      name
      lat
      lng
    }
    myRole
  }
}
