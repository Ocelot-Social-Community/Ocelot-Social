mutation CreateGroup(
  $id: ID
  $name: String!
  $slug: String
  $about: String
  $description: String!
  $template: String!
  $actionRadius: GroupActionRadius!
  $categoryIds: [ID]
  $locationName: String # empty string '' sets it to null
  $lat: Float
  $lng: Float
) {
  CreateGroup(
    id: $id
    name: $name
    slug: $slug
    about: $about
    description: $description
    template: $template
    actionRadius: $actionRadius
    categoryIds: $categoryIds
    locationName: $locationName
    lat: $lat
    lng: $lng
  ) {
    id
    name
    slug
    createdAt
    updatedAt
    disabled
    deleted
    about
    description
    visibility
    # Which preset it was created from — stored, unlike the visibility, which is derived.
    template
    actionRadius
    categories {
      id
      slug
      name
      icon
    }
    locationName
    location {
      id
      name
      lat
      lng
    }
    myRole
  }
}
