mutation invalidateInviteCode($code: String!) {
  invalidateInviteCode(code: $code) {
    code
    createdAt
    generatedBy {
      id
      name
      avatar {
        url
      }
    }
    redeemedBy {
      id
      name
      avatar {
        url
      }
    }
    expiresAt
    comment
    invitedTo {
      id
      visibility
      name
      about
      avatar {
        url
      }
    }
    isValid
  }
}
