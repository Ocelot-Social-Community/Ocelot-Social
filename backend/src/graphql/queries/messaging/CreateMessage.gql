mutation CreateMessage(
  $roomId: ID
  $userId: ID
  $content: String
  $files: [FileInput]
  $draftFiles: [ID]
  $endsDraft: Boolean
) {
  CreateMessage(
    roomId: $roomId
    userId: $userId
    content: $content
    files: $files
    draftFiles: $draftFiles
    endsDraft: $endsDraft
  ) {
    id
    content
    senderId
    username
    avatar
    date
    room {
      id
    }
    saved
    distributed
    seen
    files {
      url
      name
      type
    }
  }
}
