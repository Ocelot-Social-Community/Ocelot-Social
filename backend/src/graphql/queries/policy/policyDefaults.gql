query policyDefaults {
  policyDefaults {
    defaults {
      publicRegistration
      inviteRegistration
      askForRealName
      requireLocation
      inviteLinkLimit
      inviteCodesPersonalPerUser
      inviteCodesGroupPerUser
      categoriesActive
      badgesEnabled
      showContentFilterHeaderMenu
      showContentFilterMasonryGrid
      showGroupButtonInHeader
      apiKeysEnabled
      apiKeysMaxPerUser
      maxPinnedPosts
      maxGroupPinnedPosts
    }
    lastChange {
      actor
      timestamp
    }
  }
}
