"How findable a group is, and therefore how private: derived from what its non-member role may read (see backend/src/groupRole/privacyLevel.ts), not chosen."
enum GroupVisibility {
  "Profile and content are open to everybody, members or not."
  public
  "The group is findable, its content is not."
  closed
  "Unlisted: the group is not findable at all, and reachable only through an invite."
  hidden
}
