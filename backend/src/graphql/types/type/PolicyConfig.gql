enum ConfigKeyState {
  set
  empty
  missing
}

type EnvKeyStatus {
  "The environment variable name (e.g. LIVEKIT_API_SECRET)."
  name: String!
  "Presence state — the only thing reported; a value is never returned."
  state: ConfigKeyState!
}

type PolicyDependencyStatus {
  "A policy key this one depends on (policy→policy gate), e.g. groupsEnabled."
  key: String!
  "Whether that dependency is currently effectively on. An unsatisfied dependency makes the dependent key unavailable (its stored value has no effect)."
  satisfied: Boolean!
}

type PolicyConfigEntry {
  "The policy key (e.g. videoConference, apiKeysEnabled)."
  key: String!
  "Value type: boolean | integer."
  type: String!
  "Admin display group the key belongs to (e.g. registration, features, layout, video)."
  category: String!
  "Effective value (env-folded), JSON-encoded. This is what the permission gates read."
  effective: String!
  "The software default baked into the schema, JSON-encoded."
  softwareDefault: String!
  "The configured default = env seed if set, else the software default, JSON-encoded."
  configuredDefault: String!
  "Name of the env var that SEEDS the default (soft), or null."
  envSeed: String
  "Presence of the envSeed var, or null when the key has no envSeed."
  envSeedState: ConfigKeyState
  "Hard env requirements with their presence state (empty when the key needs no env)."
  requiresEnv: [EnvKeyStatus!]!
  "Policy keys this one depends on (policy→policy gate) with their satisfied state (empty when the key depends on no other policy)."
  requiresPolicy: [PolicyDependencyStatus!]!
  "Whether all hard requirements are met — both env presence AND policy dependencies (always true when there are none). A false value greys/disables the key in the admin policy tab."
  available: Boolean!
}

type Query {
  "Per-policy configuration with its software/env-seed/effective value layers and hard env requirements (policy.manage). Secret values are never returned — only env presence state."
  policyConfig: [PolicyConfigEntry!]!
}
