"oEmbed-style metadata scraped from an external URL, used to render link previews."
type Embed {
  "The oEmbed resource type (e.g. link, video, photo, rich)."
  type: String
  title: String
  author: String
  publisher: String
  date: String
  description: String
  url: String
  "URL of a representative preview image."
  image: String
  audio: String
  video: String
  "Detected content language."
  lang: String
  "Embeddable HTML fragment (e.g. a player iframe), when the provider offers one."
  html: String
  sources: [String]
}

"An oEmbed provider this instance can resolve link previews for."
type EmbedProvider {
  "Display name, e.g. \"YouTube\"."
  name: String!
  "The provider's own site, e.g. \"https://youtube.com\"."
  url: String!
}

type Query {
  "Fetch link-preview metadata for a URL. Public."
  embed(url: String!): Embed
  "The oEmbed providers this instance resolves link previews for. Public."
  embedProviders: [EmbedProvider!]!
}
