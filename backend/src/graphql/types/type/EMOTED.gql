"Relationship representing a user's emotional reaction to a post."
type EMOTED @relation(name: "EMOTED") {
  "The reacting user."
  from: User
  "The post reacted to."
  to: Post

  emotion: Emotion
  createdAt: String
  updatedAt: String
}

"Selects which emotion to add or remove on a post."
input _EMOTEDInput {
  emotion: Emotion
  createdAt: String
  updatedAt: String
}

input _PostEMOTEDFilter {
  emotion_in: [Emotion]
  createdAt: String
  updatedAt: String
}

type Mutation {
  "Add the current user's emotional reaction to a post. Requires authentication."
  AddPostEmotions(to: _PostInput!, data: _EMOTEDInput!): EMOTED
  "Remove the current user's emotional reaction from a post. Requires authentication."
  RemovePostEmotions(to: _PostInput!, data: _EMOTEDInput!): EMOTED
}
