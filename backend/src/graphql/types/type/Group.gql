"A group: a space where members share posts, chat and optionally hold video calls. How findable it is follows from its rights (`visibility`); who may do what inside it follows from its roles."
type Group {
  id: ID!
  "The group's title."
  name: String!
  "URL-safe unique handle for the group."
  slug: String!

  "ISO 8601 date-time string of creation."
  createdAt: String!
  "ISO 8601 date-time string of the last update."
  updatedAt: String!
  deleted: Boolean
  disabled: Boolean

  avatar: Image

  "Short statement of the group's goal."
  about: String
  "Full group description (rich text)."
  description: String!
  "The live elevation of the viewer in this group, or null when they are acting on their membership alone (see GroupElevation)."
  myGroupElevation: GroupElevation
  "Whether asking for an elevation here would grant the viewer anything beyond what they can already read."
  mayElevateInGroup: Boolean!
  "Which role template this group was created from, or last put on. Stored, unlike `visibility`, which is derived: two templates can produce the same visibility (`channel` is public too), so this is what says which preset a group is running — and what the admin area counts when it asks how many groups an edit would reach."
  template: String
  "How findable this group is — DERIVED from its rights, not chosen: `hidden` while its non-member role cannot read the profile, `closed` while it cannot read the content, `public` otherwise. Setting it through UpdateGroup applies the matching role template; the per-level network rights (group.create_*, group.administer.any_*, group.content.read.any_*) read it."
  visibility: GroupVisibility!
  actionRadius: GroupActionRadius!

  locationName: String
  location: Location

  categories: [Category]

  "Number of members, excluding those with a pending join request. Null when the viewer may not see the member list (`group.members.read`): in a small group the number plus a known owner is nearly the list itself. Nullable rather than refused, so a group teaser renders without an error for a viewer who simply may not count."
  membersCount: Int

  "The current user's role in this group, or null if they are not a member. Deprecated: a group defines its own roles, so the value is not an enum any more — use myGroupRole. Returns null for a role the enum cannot express."
  myRole: GroupMemberRole
    @deprecated(reason: "Group roles are group-defined; use myGroupRole instead.")
  "The current user's role in this group, or null when they have no membership. Unlike myRole this carries any role the group defined, with the label it chose for it."
  myGroupRole: GroupRole
  "The group rights the current user effectively holds here: their role's set, capped by their network permissions and by the runtime feature gates. Drives the webapp's canInGroup()."
  myGroupPermissions: [String!]!
  "The group's own role definitions. Requires `group.role.manage` in this group."
  roles: [GroupRole!]!
  "Whether the profile owner has chosen to show this group on their public profile."
  showOnProfile: Boolean
  "For closed groups: whether non-members can see the member list. Derived: it is true exactly when the group's non-member role holds `group.members.read`, which is where that setting now lives."
  showMembers: Boolean
  posts: [Post]

  "Whether the current user has muted this group."
  isMutedByMe: Boolean!

  "Invite codes to this group the current user has generated."
  inviteCodes: [InviteCode]!

  "How many members hold the owner role. Zero means the group has no owner left — legal, and the criterion the admin group list filters by. Null when the viewer may not see the member list."
  ownerCount: Int
  "Number of posts currently pinned within this group."
  currentlyPinnedPostsCount: Int!
  "Total number of non-deleted, non-disabled posts in this group. Null when the viewer may not read the content (`group.content.read`) — counting the posts is reading them, the same way counting members is reading the member list. Nullable rather than refused, so a teaser renders for a viewer who simply may not count."
  postsCount: Int
}

"A group member paired with their membership relationship (role, join date)."
type GroupMember {
  user: User
  membership: MEMBER_OF
}

type Query {
  "List groups. Requires authentication. Filter to the current user's memberships with `isMember`, or to located groups with `hasLocation`."
  Group(
    "Null/undefined returns all groups; true only the user's groups; false only groups they are not in."
    isMember: Boolean
    "If true, only groups that have a location."
    hasLocation: Boolean
    id: ID
    slug: String
    first: Int
    offset: Int
  ): [Group]
  # orderBy: [_GroupOrdering] # not implemented yet
  # filter: _GroupFilter # not implemented yet

  "List a group's members. Visibility depends on the viewer's relation to the group. Set `includePending` to also return unapproved join requests (for admins/owners). Set `nameFilter` (min. 3 chars recommended) to search by display name."
  GroupMembers(id: ID!, first: Int, offset: Int, includePending: Boolean, nameFilter: String): [GroupMember]
  # orderBy: [_UserOrdering] # not implemented yet

  "Count groups, optionally restricted to the current user's memberships. Requires authentication."
  GroupCount(isMember: Boolean): Int

  "Every group the viewer may administer, for the admin area — including the hidden ones, which are reachable no other way. Restricted to the visibilities the viewer holds `group.administer.any_<visibility>` for. Set `ownerless` to find the groups that have no owner left."
  adminGroups(
    "Free-text match on name and slug."
    search: String
    visibility: GroupVisibility
    "Only groups whose owner role has no members."
    ownerless: Boolean
    disabled: Boolean
    first: Int
    offset: Int
  ): [Group!]!
  "How many groups the same filters match, for paging the admin list."
  adminGroupCount(
    search: String
    visibility: GroupVisibility
    ownerless: Boolean
    disabled: Boolean
  ): Int!

  # AvailableGroupActionRadii: [GroupActionRadius]!

  # AvailableGroupMemberRoles: [GroupMemberRole]!
}

type Mutation {
  "Create a group from one of the role templates (`groupTemplates`). Requires authentication and the `group.create_<visibility>` permission for the visibility that template derives to — which is not the name of the template: `channel` is a public group. The template is stored on the group; its visibility is not, because the rights it starts with are what the visibility is read from."
  CreateGroup(
    id: ID
    name: String!
    slug: String
    about: String
    description: String!
    "Which role template the group starts from. A name from `groupTemplates` — not a visibility, which is what the rights of that template derive to."
    template: String!
    actionRadius: GroupActionRadius!
    categoryIds: [ID]

    # avatar: ImageInput # a group can not be created with an avatar

    "Empty string '' clears the location (sets it to null)."
    locationName: String
    "Coordinates for locationName (e.g. a dropped map pin), given together or not at all. Not stored on the group itself — the server reverse-geocodes them (to a coarser place/region/country match, deliberately less precise than an event's exact pin) instead of forward-geocoding locationName's text, so the saved location matches the general area the user picked rather than a text-search approximation."
    lat: Float
    "See lat."
    lng: Float
    showMembers: Boolean
  ): Group

  "Update a group's settings. Restricted to admins/owners of the group."
  UpdateGroup(
    id: ID!
    name: String
    slug: String
    about: String
    description: String

    "Applying a visibility writes the matching role template onto the `none` and `pending` roles — the rights ARE the visibility, so this is a preset rather than a label."
    visibility: GroupVisibility

    actionRadius: GroupActionRadius
    categoryIds: [ID]
    avatar: ImageInput # test this as result
    "Empty string '' clears the location (sets it to null)."
    locationName: String
    "Coordinates for locationName (e.g. a dropped map pin), given together or not at all. Not stored on the group itself — the server reverse-geocodes them (to a coarser place/region/country match, deliberately less precise than an event's exact pin) instead of forward-geocoding locationName's text, so the saved location matches the general area the user picked rather than a text-search approximation."
    lat: Float
    "See lat."
    lng: Float
    showMembers: Boolean
  ): Group

  # DeleteGroup(id: ID!): Group

  "Join a group, or accept/approve a pending membership. Allowed per the group's join rules; joining on behalf of another user requires the appropriate rights."
  JoinGroup(groupId: ID!, userId: ID!): GroupMember

  "Leave a group, or (for admins/owners) let a member leave."
  LeaveGroup(groupId: ID!, userId: ID!): GroupMember

  "Change a member's role in a group. Restricted to admins/owners, subject to the role hierarchy."
  ChangeGroupMemberRole(groupId: ID!, userId: ID!, roleInGroup: GroupMemberRole!): GroupMember

  "Remove a user from a group. Restricted to those allowed to manage the group's members."
  RemoveUserFromGroup(groupId: ID!, userId: ID!): GroupMember

  "Mute a group so its posts no longer appear in the current user's feed. Requires membership."
  muteGroup(groupId: ID!): Group
  "Unmute a previously muted group. Requires membership."
  unmuteGroup(groupId: ID!): Group

  "Toggle whether a group membership is shown on the current user's profile."
  setGroupMembershipVisibility(groupId: ID!, showOnProfile: Boolean!): MEMBER_OF
}

type GroupMembershipVisibilityChanged {
  userId: ID!
}

type GroupShowMembersChanged {
  groupId: ID!
}

type Subscription {
  "Fires when a user changes which group memberships are visible on their profile."
  groupMembershipVisibilityChanged(userId: ID!): GroupMembershipVisibilityChanged!
  "Fires when a closed group's showMembers setting changes."
  groupShowMembersChanged(groupId: ID!): GroupShowMembersChanged!
}
