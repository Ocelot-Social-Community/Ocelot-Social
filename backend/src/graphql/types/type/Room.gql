enum _RoomOrdering {
  lastMessageAt_desc
  createdAt_desc
}

"A chat room: a one-to-one direct conversation between two users, the shared chat room of a group, or the conference chat of a video call."
type Room {
  "Alias of `id`, kept for the chat frontend (vue-advanced-chat keys objects by `_id`)."
  _id: String @deprecated(reason: "Use `id`.")
  id: ID!
  createdAt: String
  updatedAt: String

  "Participants of the room."
  users: [User]!
  "The group this room belongs to — for the conference chat of a video call, the group the call takes place in — or null for a direct room."
  group: Group

  "Alias of id; prefer id in new code."
  roomId: String!
  "True if this is a group room, false for a direct room."
  isGroupRoom: Boolean!
  "True if this is the conference chat of a video call, shared only by the participants of that call."
  isCallRoom: Boolean!
  "False once the room no longer takes messages: the conference chat of a video call that is over."
  isWritable: Boolean!
  "Display name: the group's name for a group room or a call's conference chat, otherwise the other participant's name."
  roomName: String!
  "Display avatar URL: the group's avatar for a group room or a call's conference chat, otherwise the other participant's avatar."
  avatar: String

  "Timestamp of the most recent message, for sorting the room list."
  lastMessageAt: String

  "The most recent message in the room."
  lastMessage: Message

  "Count unread messages, excluding those from blocked/muted senders."
  unreadCount: Int

  "What the current user has begun to write in this room but not sent yet, or null. Only ever the viewer's own; nobody else learns of it."
  draft: String

  "The files attached to the current user's draft in this room, oldest first. Only ever the viewer's own."
  draftFiles: [File]
}

type Mutation {
  "Create (or fetch) the chat room for a group. Requires authentication."
  CreateGroupRoom(groupId: ID!): Room
  "Keep what the current user has begun to write in a room but not sent yet; an empty text removes it. Named by roomId, or by userId for a direct conversation without a message yet: that one is opened for the draft. Sending a message in the room removes the draft. Requires authentication."
  SaveRoomDraft(roomId: ID, userId: ID, text: String): Room
  "Attach a file to the current user's draft in a room, named as for SaveRoomDraft; a direct conversation without a message yet is opened for it. Stored at once; sending the message takes it over (CreateMessage, draftFiles). Requires authentication."
  AddRoomDraftFile(roomId: ID, userId: ID, file: FileInput!): File
  "Remove a file from the current user's draft in a room, by its URL, and from the storage. True when there was one. Requires authentication."
  RemoveRoomDraftFile(roomId: ID, userId: ID, url: ID!): Boolean
}

type Query {
  "List the current user's chat rooms. Direct rooms are looked up by `userId`, group rooms by `groupId`. Requires authentication."
  Room(id: ID, userId: ID, groupId: ID, first: Int, before: String, search: String, orderBy: [_RoomOrdering]): [Room]
  "Number of the current user's rooms with unread messages. Requires authentication."
  UnreadRooms: Int
}

type Subscription {
  "Pushes a room whenever its state changes (e.g. a new message arrives)."
  roomUpdated: Room
}
