"An email address belonging to a user, with its verification state."
type EmailAddress {
  email: ID!
  "When the address was verified, or null if still unverified."
  verifiedAt: String
  createdAt: String
}

type Query {
  "Check whether a signup/verification nonce is valid for the given email. Public."
  VerifyNonce(email: String!, nonce: String!): Boolean!
}

type Mutation {
  "Begin registration for an email address, sending a verification nonce. Allowed when public or invite registration is enabled (or by an admin with `role.manage`); an inviteCode is required for invite-only registration."
  Signup(email: String!, locale: String!, inviteCode: String = null): EmailAddress
  "Complete registration by confirming the nonce and creating the user account. Public."
  SignupVerification(
    nonce: String!
    email: String!
    inviteCode: String = null
    name: String!
    password: String!
    slug: String
    about: String
    termsAndConditionsAgreedVersion: String!
    locale: String
    "The place picked on the last slide, as shown. Matched exactly when no locationId is given; '' or null for none."
    locationName: String = null
    "The Mapbox feature id of the picked place (as `queryLocations` returns it). Decides the location when given — the same in every language, unlike a place name. Needs lat and lng: the server confirms the id lies there."
    locationId: ID
    "The coordinates the place was picked with, given together or not at all. With locationId they confirm it; without, they only bias the lookup of locationName's text towards same-named places nearby."
    lat: Float
    "See lat."
    lng: Float
  ): User
  "Add a further email address to the current account, sending a verification nonce. Requires authentication."
  AddEmailAddress(email: String!): EmailAddress
  "Confirm a pending email address via its nonce. Requires authentication."
  VerifyEmailAddress(nonce: String!, email: String!): EmailAddress
}
