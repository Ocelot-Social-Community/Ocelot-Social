"Whether group video calls are available on this instance."
type VideoCallConfig {
  enabled: Boolean!
}

"Credentials for connecting to a group's video-call room on the media server."
type VideoCallJoinPayload {
  "Access token authorising the current user to join the room."
  token: String!
  "WebSocket URL of the media server."
  url: String!
  "Name of the room to join."
  roomName: String!
}

"Live participant count for a group's video call."
type VideoCallParticipantCount {
  groupId: ID!
  count: Int!
}

"A video call running in a group right now."
type ActiveVideoCall {
  group: Group!
  "Connections to the call — tabs and devices, so two people sharing an account count twice."
  participantCount: Int!
  "The distinct users in the call, in the order they joined."
  participants: [User!]!
}

"A group's call started, changed or ended."
type ActiveVideoCallChange {
  groupId: ID!
  "The running call, or null once it has ended."
  call: ActiveVideoCall
}

type Query {
  "Whether video calls are enabled on this instance. Public."
  videoCallConfig: VideoCallConfig!
  "Current number of participants in a group's video call. Requires authentication."
  videoCallParticipantCount(groupId: ID!): Int!
  "The calls running right now in groups whose call the current user may join. Requires authentication."
  activeVideoCalls: [ActiveVideoCall!]!
}

type Mutation {
  "Join a group's video call, returning the credentials to connect. Requires authentication."
  joinGroupVideoCall(groupId: ID!): VideoCallJoinPayload!
}

type Subscription {
  "Pushes the updated participant count as users join or leave a group's video call."
  videoCallParticipantCountChanged(groupId: ID!): VideoCallParticipantCount!
  "Pushes every start, change and end of a call the current user may join."
  activeVideoCallChanged: ActiveVideoCallChange!
}
