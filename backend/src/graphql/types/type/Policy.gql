type Query {
  policy: Policy!
  policyDefaults: PolicyDefaults!
}

type PolicyDefaults {
  defaults: Policy!
  lastChange: PolicyLastChange
}

type PolicyLastChange {
  actor: String!
  timestamp: String!
}

type Policy {
  publicRegistration: Boolean!
  inviteRegistration: Boolean!
  askForRealName: Boolean!
  requireLocation: Boolean!
  inviteLinkLimit: Int
  inviteCodesPersonalPerUser: Int
  inviteCodesGroupPerUser: Int
  categoriesActive: Boolean!
  badgesEnabled: Boolean!
  showContentFilterHeaderMenu: Boolean!
  showContentFilterMasonryGrid: Boolean!
  showGroupButtonInHeader: Boolean!
  apiKeysEnabled: Boolean
  apiKeysMaxPerUser: Int
  maxPinnedPosts: Int
  maxGroupPinnedPosts: Int
}

type PolicyChangeEvent {
  key: PolicyKey!
  value: String!
  actor: String!
  timestamp: String!
}

type PolicyValueChanged {
  key: PolicyKey!
  value: String!
}

type Mutation {
  setPolicy(key: PolicyKey!, value: String!): PolicyChangeEvent!
  resetPolicy(key: PolicyKey!): PolicyChangeEvent!
}

type Subscription {
  policyChanged: PolicyValueChanged!
}
