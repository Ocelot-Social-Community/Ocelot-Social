enum _CommentOrdering {
  id_asc
  id_desc
  content_asc
  content_desc
  createdAt_asc
  createdAt_desc
  updatedAt_asc
  updatedAt_desc
}

"Filter for the Comment query. Scoped to what helpers/nodeQuery.ts implements; anything not listed is rejected at validation time."
input _CommentFilter {
  "A single comment id; shorthand for a one-element `id_in`."
  id: ID
  id_in: [ID!]
}

"A comment written by a user in reply to a post."
type Comment {
  id: ID!
  "ActivityPub activity id, for federated comments."
  activityId: String
  author: User
  "Comment body as rich text (HTML)."
  content: String!
  "The post this comment belongs to."
  post: Post
  createdAt: String
  updatedAt: String
  "True once the comment has been moderated away."
  deleted: Boolean
  "True once the comment has been disabled by a moderator."
  disabled: Boolean
  "Whether the current user observes the post this comment belongs to."
  isPostObservedByMe: Boolean!
  "Number of users observing the post this comment belongs to."
  postObservingUsersCount: Int!

  "Whether the current user has shouted (endorsed) this comment."
  shoutedByCurrentUser: Boolean!

  "Number of users who have shouted (endorsed) this comment."
  shoutedCount: Int!
}

type Query {
  "List comments. Public."
  Comment(
    id: ID
    content: String
    createdAt: String
    updatedAt: String
    first: Int
    offset: Int
    orderBy: [_CommentOrdering]
    filter: _CommentFilter
  ): [Comment]
}

type Mutation {
  "Write a comment on a post. Requires authentication, the `comment.create` permission, and permission to comment on that post."
  CreateComment(id: ID, postId: ID!, content: String!): Comment
  "Edit one of your own comments. Restricted to the author."
  UpdateComment(id: ID!, content: String!): Comment
  "Delete one of your own comments. Restricted to the author."
  DeleteComment(id: ID!): Comment
}
