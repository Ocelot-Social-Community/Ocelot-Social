"Filter for the Tag query. Scoped to what helpers/nodeQuery.ts implements; anything not listed is rejected at validation time."
input _TagFilter {
  "A single tag id; shorthand for a one-element `id_in`."
  id: ID
  id_in: [ID!]
}

"A free-form hashtag. The tag's text is its id. Tags are created implicitly from post content (unlike the curated Category taxonomy)."
type Tag {
  id: ID!
  taggedPosts: [Post]!
  "Total number of posts carrying this tag."
  taggedCount: Int!
  "Number of distinct authors who have used this tag."
  taggedCountUnique: Int!
  deleted: Boolean
  disabled: Boolean
}

enum _TagOrdering {
  id_asc
  id_desc
  taggedCount_asc
  taggedCount_desc
  taggedCountUnique_asc
  taggedCountUnique_desc
}

type Query {
  "List hashtags, e.g. for a trending-tags widget. Public."
  Tag(id: ID, first: Int, offset: Int, orderBy: [_TagOrdering], filter: _TagFilter): [Tag]
}
