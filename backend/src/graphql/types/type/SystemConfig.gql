enum ConfigKeyState {
  set
  empty
  missing
}

enum FeatureGateSource {
  "Fixed at deploy time — changing it needs a redeploy + restart (e.g. LiveKit secrets)."
  env
  "An env-seeded default that is changeable at runtime via the policy tab."
  policy
}

type ConfigKeyStatus {
  "The environment variable name (e.g. LIVEKIT_API_SECRET)."
  key: String!
  "Whether this key holds a secret; secret values are never returned."
  secret: Boolean!
  "Presence state: set | empty | missing. The only thing reported for secrets."
  state: ConfigKeyState!
  "Cleartext value for non-secret keys (e.g. LIVEKIT_URL); null for secrets and unset keys."
  value: String
}

type FeatureGateStatus {
  "The permission feature gate this status describes (e.g. videoCall, apiKeys)."
  gate: String!
  "Whether the gate is currently open (the feature is effective)."
  open: Boolean!
  "Where the gate's value comes from: env (fixed) or policy (runtime-changeable)."
  source: FeatureGateSource!
  "For policy-backed gates: the policy key, so the UI can deep-link to the policy tab."
  policyKey: String
  "For env-backed gates: the underlying env keys with their presence state."
  keys: [ConfigKeyStatus!]!
}

type Query {
  "Feature-gate configuration status (policy.manage). Secret values are never returned — only their presence state — so deployment misconfiguration can be diagnosed without leaking secrets."
  systemConfig: [FeatureGateStatus!]!
}
