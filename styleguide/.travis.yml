language: node_js
# Must stay in step with package-lock.json: it is lockfileVersion 3, which needs npm >= 7 and so
# Node >= 15. The "10" that stood here shipped npm 6 and could not read the lockfile at all.
node_js:
  - "26"
cache:
  npm: true
  directories:
    - node_modules

install:
  - npm ci
  - npm run build
  - npm run build:lib

before_deploy:
  - rm -Rf ./node_modules .docs ./preview ./tests *.log*
  - rm -Rf ./src/system/icons/_all
  - rm -Rf ./src/system/tokens/_examples

deploy:
  - provider: npm
    skip_cleanup: true
    email: $NPM_EMAIL
    api_key: $NPM_TOKEN
    on:
      condition: ./deployment_condition.sh
  - provider: pages
    skip_cleanup: true
    github_token: $GITHUB_TOKEN  # Set in the settings page of your repository, as a secure variable
    keep_history: true
    on:
      condition: ./deployment_condition.sh
