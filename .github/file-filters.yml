# These file filter patterns are used by the action https://github.com/dorny/paths-filter

ui: &ui
  - '.github/workflows/ui-*.yml'
  - 'packages/ui/**/*'

maintenance: &maintenance
  - '.github/workflows/maintenance-*.yml'
  - 'maintenance/**/*'
  - *ui

backend: &backend
  - '.github/workflows/test-backend.yml'
  - 'backend/**/*'
  - 'neo4j/**/*'
  - 'package.json'

docker: &docker
  - 'docker-compose.*'

webapp: &webapp
  - '.github/workflows/test-webapp.yml'
  - 'webapp/**/*'
  - 'styleguide/**/*'
  - 'package.json'
  - *ui

docs-check: &docs-check
  - '.github/workflows/check-documentation.yml'

markdown: &markdown
  - *docs-check
  - '**/*.md'
  - '.github/workflows/mlc_config.json'

vuepress: &vuepress
  - *docs-check
  - '.github/workflows/deploy-documentation.yml'
  - '.vuepress/**/*'
  - 'package.json'

documentation: &documentation
  - *vuepress
  - *markdown
  # The embedded API reference is generated from the GraphQL SDL + SpectaQL config,
  # so schema/config changes must also trigger a docs rebuild & redeploy.
  - 'backend/src/graphql/**/*.gql'
  - 'backend/spectaql.yml'