name: Dependabot auto-merge

# `pull_request`, NOT `pull_request_target`. The distinction matters for a workflow that reacts to
# bot-authored pull requests: `pull_request_target` runs in the context of the base branch with full
# secret access, which is what makes it dangerous, and it buys nothing here — this job checks out no
# code and reads no secret beyond GITHUB_TOKEN. A Dependabot-triggered run gets a READ-ONLY
# GITHUB_TOKEN by default; the `permissions:` block below raises it, which is exactly the mechanism
# GitHub's own auto-merge example uses. Note that regular Actions secrets are NOT available in these
# runs (they live in Dependabot secrets instead) — another reason to need none.
on: pull_request

# contents: write performs the merge, pull-requests: write flags the pull request for it. Nothing
# else is granted; the workflow-level block replaces whatever the repository default is.
permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    name: Enable auto-merge
    # `pull_request.user.login`, not `github.actor`: the actor changes when a human re-runs the
    # workflow, the author of the pull request does not. Without this guard the job would arm
    # auto-merge on every contributor's pull request.
    if: ${{ github.event.pull_request.user.login == 'dependabot[bot]' }}
    runs-on: ubuntu-latest

    steps:
      # `--auto` does NOT merge now — it marks the pull request, and GitHub merges it by itself once
      # every REQUIRED status check has passed. Two consequences worth spelling out:
      #
      #   • The branch protection rule is the actual gate, not this file. With no required checks
      #     configured on master, `--auto` merges the pull request IMMEDIATELY, unreviewed and
      #     untested. Whoever removes the last required check removes the review of every dependency
      #     bump along with it.
      #   • `--squash` matches how these have been landing so far (see the `build(deps): bump …(#…)`
      #     commits on master), which keeps the conventional-commit prefix that release-please reads.
      - name: Enable auto-merge
        run: gh pr merge --auto --squash "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Satisfies "Require a pull request before merging → at least 1 approving review".
      #
      # A ruleset bypass for Dependabot does NOT cover this, which was established by elimination:
      # the repository has no classic branch protection rules at all, the bypass entry was present
      # and active, and the pull request still reported "Review required". What is left is that the
      # bypass is evaluated against the actor performing the merge — github-actions[bot], which armed
      # auto-merge in the step above — and not against the pull request's author. Adding GitHub
      # Actions to the bypass list would fix that, at the price of handing EVERY workflow in the
      # repository a way around the rule; not worth it, especially once Dependabot starts merging
      # github-actions bumps on its own.
      #
      # The approval below counts because github-actions[bot] is a different actor than the author.
      # GitHub only rejects self-approval.
      #
      # Be honest about what this is: it turns a human gate into a formality, so the review of every
      # dependency bump now rests entirely on the required status checks. Delete this step the moment
      # the bypass works on its own — it is a workaround, not the design.
      #
      # Runs on every `synchronize` too, not just `opened`, so that an approval dismissed by
      # "Dismiss stale pull request approvals when new commits are pushed" is re-issued after
      # Dependabot force-pushes a rebase.
      - name: Approve
        run: gh pr review --approve "${PR_URL}"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
