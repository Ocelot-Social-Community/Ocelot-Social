name: ocelot.social end-to-end test CI

on: push

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: without this block the jobs inherit whatever the repository or
# organisation default is, which may be read-write. This workflow only checks out and inspects the
# repository, so read is enough.
permissions:
  contents: read

jobs:
  prepare_backend_environment:
    name: Fullstack | prepare backend environment
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Copy backend env file
        run: |
          cp backend/.env.test_e2e backend/.env
          cp webapp/.env.template webapp/.env

      - name: Neo4J | Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: neo4j
          file: neo4j/Dockerfile
          target: community
          load: true
          tags: ghcr.io/ocelot-social-community/ocelot-social/neo4j:community
          cache-from: type=gha,scope=neo4j
          cache-to: type=gha,mode=max,scope=neo4j

      - name: Backend | Build image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: backend/Dockerfile
          target: test
          load: true
          tags: ghcr.io/ocelot-social-community/ocelot-social/backend:test
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Pull third-party images
        run: |
          docker pull quay.io/minio/minio:latest
          docker pull quay.io/minio/mc:latest
          docker pull maildev/maildev:latest

      # gzip on the way out: `docker save` writes UNCOMPRESSED layer tars, and every byte here is
      # paid 40 times over on the matrix side. `docker load` detects the gzip itself.
      - name: Save all images
        run: |
          docker save "ghcr.io/ocelot-social-community/ocelot-social/backend:test" | gzip -1 > /tmp/backend.tar.gz
          docker save "ghcr.io/ocelot-social-community/ocelot-social/neo4j:community" | gzip -1 > /tmp/neo4j.tar.gz
          docker save "quay.io/minio/minio:latest" | gzip -1 > /tmp/minio.tar.gz
          docker save "quay.io/minio/mc:latest" | gzip -1 > /tmp/minio-mc.tar.gz
          docker save "maildev/maildev:latest" | gzip -1 > /tmp/mailserver.tar.gz

      # ARTIFACT, not cache. These are run-scoped hand-offs between jobs, which is what artifacts are
      # for; `actions/cache` with a `run_id` key can never hit on a later run, yet it occupies the
      # repo's 10 GB cache budget and evicts by LRU the caches that COULD hit — the buildx `type=gha`
      # scopes and the yarn cache. `compression-level: 0` because the payload is already gzipped.
      - name: Upload images for the test jobs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-backend-environment
          path: /tmp/*.tar.gz
          retention-days: 1
          compression-level: 0

  prepare_webapp_image:
    name: Fullstack | prepare webapp image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Webapp | Build 'test' image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: webapp/Dockerfile
          target: test
          load: true
          tags: ghcr.io/ocelot-social-community/ocelot-social/webapp:test
          cache-from: type=gha,scope=webapp-test
          cache-to: type=gha,mode=max,scope=webapp-test

      - name: Save image for test jobs
        run: docker save "ghcr.io/ocelot-social-community/ocelot-social/webapp:test" | gzip -1 > /tmp/webapp.tar.gz

      - name: Upload image for the test jobs
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: e2e-webapp-image
          path: /tmp/webapp.tar.gz
          retention-days: 1
          compression-level: 0

  prepare_cypress:
    name: Fullstack | prepare cypress
    runs-on: ubuntu-latest
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'yarn'

      - name: Copy env files
        run: |
          cp webapp/.env.template webapp/.env
          cp backend/.env.test_e2e backend/.env

      - name: Install cypress requirements
        run: |
          sudo wget --no-verbose -O /opt/cucumber-json-formatter "https://github.com/cucumber/json-formatter/releases/download/v19.0.0/cucumber-json-formatter-linux-amd64"
          echo "66a2ef158866c3ecb3d8e49a7189814a485bddca43e133e4ca5735b8d3951bf7  /opt/cucumber-json-formatter" | sha256sum -c -
          sudo chmod +x /opt/cucumber-json-formatter
          # Build the @ocelot-social/branding file: dependency first so the backend `yarn build` (tsc)
          # can resolve its types.
          cd packages/branding && npm ci && npm run build && cd ../..
          cd backend
          yarn install
          yarn build
          cd ..
          yarn install
      
      # This is a HAND-OFF to the matrix jobs below, not a dependency cache: the path includes the whole
      # workspace (sources, cypress specs, the backend `yarn build` output), so it is only ever valid
      # for the commit that produced it. Hence `github.sha` in the key and deliberately NO
      # `restore-keys`.
      #
      # A lockfile-only fallback would be actively wrong here. `actions/cache` extracts over the
      # existing tree, so it runs AFTER `actions/checkout` and overwrites what checkout just put there.
      # A fallback key matches any earlier commit with the same lockfiles — which is most commits, since
      # most do not touch dependencies — and the end-to-end suite would then silently exercise an older
      # revision and report green for it. Missing the cache outright is the far better failure: the
      # matrix job finds no node_modules and fails loudly.
      - name: Cache cypress + installed workspace
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.0.2
        with:
          path: |
            /opt/cucumber-json-formatter
            /home/runner/.cache/Cypress
            /home/runner/work/Ocelot-Social/Ocelot-Social
          key: e2e-cypress-${{ hashFiles('yarn.lock', 'backend/yarn.lock', 'packages/branding/package-lock.json') }}-${{ github.sha }}

  list_features:
    name: List Feature Files
    runs-on: ubuntu-latest
    outputs:
      features: ${{ steps.list.outputs.features }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: List feature files
        id: list
        run: |
          FEATURES=$(cd cypress && find e2e/ -name "*.feature" -printf '%P\n' | sort | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "features=$FEATURES" >> $GITHUB_OUTPUT

  fullstack_tests:
    name: E2E | ${{ matrix.feature }}
    if: success()
    needs: [prepare_backend_environment, prepare_webapp_image, prepare_cypress, list_features]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        feature: ${{ fromJson(needs.list_features.outputs.features) }}
    steps:
      - name: Delete huge unnecessary tools folder
        run: rm -rf /opt/hostedtoolcache

      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'yarn'

      # Exact key only — see the note in `prepare_cypress`. This step restores over the checkout above,
      # so anything but this commit's own workspace would mean testing a different revision than the
      # one the run reports on.
      - name: Restore cypress cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v4.0.2
        with:
          path: |
            /opt/cucumber-json-formatter
            /home/runner/.cache/Cypress
            /home/runner/work/Ocelot-Social/Ocelot-Social
          key: e2e-cypress-${{ hashFiles('yarn.lock', 'backend/yarn.lock', 'packages/branding/package-lock.json') }}-${{ github.sha }}
          fail-on-cache-miss: true

      - name: Download images
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: e2e-*
          merge-multiple: true
          path: /tmp
          
      - name: Copy env files
        run: |
          cp webapp/.env.template webapp/.env
          cp backend/.env.test_e2e backend/.env

      - name: Ensure cucumber-json-formatter exists
        run: |
          if [ ! -f /opt/cucumber-json-formatter ]; then
            sudo wget --no-verbose -O /opt/cucumber-json-formatter "https://github.com/cucumber/json-formatter/releases/download/v19.0.0/cucumber-json-formatter-linux-amd64"
            echo "66a2ef158866c3ecb3d8e49a7189814a485bddca43e133e4ca5735b8d3951bf7  /opt/cucumber-json-formatter" | sha256sum -c -
          fi
          sudo chmod +x /opt/cucumber-json-formatter
          sudo ln -fs /opt/cucumber-json-formatter /usr/bin/cucumber-json-formatter

      - name: Boot up test system | docker compose
        run: |
          docker load < /tmp/neo4j.tar.gz
          docker load < /tmp/backend.tar.gz
          docker load < /tmp/minio.tar.gz
          docker load < /tmp/minio-mc.tar.gz
          docker load < /tmp/mailserver.tar.gz
          docker load < /tmp/webapp.tar.gz
          docker compose -f docker-compose.yml -f docker-compose.test.yml up --detach backend mailserver webapp

          echo "Waiting for backend (max 120s)..."
          timeout 120 bash -c 'until curl -sf -X POST -H "Content-Type: application/json" -d "{\"query\":\"{__typename}\"}" http://localhost:4000 > /dev/null 2>&1; do sleep 5; done'
          echo "Backend is ready."

          echo "Waiting for webapp (max 120s)..."
          timeout 120 bash -c 'until curl -sf http://localhost:3000 > /dev/null 2>&1; do sleep 5; done'
          echo "Webapp is ready."

      - name: Initialize database
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T backend yarn db:migrate init

      - name: Migrate database
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml exec -T backend yarn db:migrate up

      - name: Full stack tests | run tests
        id: e2e-tests
        run: yarn run cypress:run --spec "cypress/e2e/${{ matrix.feature }}"

      - name: Full stack tests | if tests failed, compile html report
        if: ${{ failure() && steps.e2e-tests.conclusion == 'failure' }}
        run: |
          cd cypress/
          node create-cucumber-html-report.js

      - name: Full stack tests | if tests failed, compute artifact name
        id: artifact-name
        if: ${{ failure() && steps.e2e-tests.conclusion == 'failure' }}
        run: echo "name=e2e-report-$(echo '${{ matrix.feature }}' | tr '/' '-')" >> $GITHUB_OUTPUT

      - name: Full stack tests | if tests failed, upload report
        id: e2e-report
        if: ${{ failure() && steps.e2e-tests.conclusion == 'failure' }}
        uses: actions/upload-artifact@bbbca2ddaa5d8feaa63e36b76fdaad77386f024f # v7.0.0
        with:
          name: ${{ steps.artifact-name.outputs.name }}
          path: /home/runner/work/Ocelot-Social/Ocelot-Social/cypress/reports/cucumber_html_report

  e2e_status:
    name: E2E | Status
    if: always()
    needs: [fullstack_tests]
    runs-on: ubuntu-latest
    steps:
      - name: Check E2E results
        run: |
          if [ "${{ needs.fullstack_tests.result }}" != "success" ]; then
            echo "E2E tests failed or were cancelled (result: ${{ needs.fullstack_tests.result }})"
            exit 1
          fi

