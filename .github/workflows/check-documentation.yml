name: ocelot.social check documentation

on: push

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: without this block the jobs inherit whatever the repository or
# organisation default is, which may be read-write. This workflow only checks out and inspects the
# repository, so read is enough.
permissions:
  contents: read

jobs:
  files-changed:
    name: Detect File Changes - Markdown files
    runs-on: ubuntu-latest
    outputs:
      markdown: ${{ steps.changes.outputs.markdown }}
      documentation: ${{ steps.changes.outputs.documentation }}
      documentation-image: ${{ steps.changes.outputs.documentation-image }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for markdown file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
          list-files: shell

  check-markdown-links:
    name: Check Markdown links
    needs: files-changed
    runs-on: ubuntu-latest
    if: needs.files-changed.outputs.markdown == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      
      - name: Remove uncheckable documentation files
        run: rm -rf ./CHANGELOG.md # workaround until https://github.com/gaurav-nelson/github-action-markdown-link-check/pull/183 has been done

      - name: Check Markdown Links
        uses: gaurav-nelson/github-action-markdown-link-check@3c3b66f1f7d0900e37b71eca45b63ea9eedfce31 # 1.0.15
        with:
          use-quiet-mode: 'yes'
          use-verbose-mode: 'no'
          # at any .md file change take the chance to check the links in all .md files
          check-modified-files-only: 'no'
          config-file: '.github/workflows/mlc_config.json'
          base-branch: 'master'
          folder-path: '.'

  test-vuepress-build:
    name: Test Vuepress build
    needs: files-changed
    runs-on: ubuntu-latest
    if: needs.files-changed.outputs.documentation == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '20'

      - name: npm-install
        run: npm install

      - name: npm-docs:build
        run: npm run docs:build

  # The job above builds only the VuePress half, on the host and on its own Node. Nothing built
  # .vuepress/Dockerfile itself, which is how it came to be broken twice over without a single red
  # run: its `apidocs` stage lost its `file:../packages/branding` target in #9888, and #10085 bumped
  # it to node:26, which ships no yarn. Both are the kind of defect only an actual image build finds.
  #
  # `target: production` on purpose — it is the last stage, so this exercises the whole chain
  # (branding -> apidocs -> build -> nginx) rather than the documentation half alone.
  build-documentation-image:
    name: Build documentation image
    needs: files-changed
    runs-on: ubuntu-latest
    if: needs.files-changed.outputs.documentation-image == 'true'
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      # Build only — never pushed. The published image is produced by the release pipeline; this is
      # a check, so it stays inside the runner and needs no registry credentials.
      - name: Build documentation image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: ./.vuepress/Dockerfile
          target: production
          push: false
          tags: ocelot-social/documentation:ci
          cache-from: type=gha,scope=documentation
          cache-to: type=gha,mode=max,ignore-error=true,scope=documentation
