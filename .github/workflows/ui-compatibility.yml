name: UI Compatibility

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build-library:
    name: Build Library
    if: needs.files-changed.outputs.ui == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/ui

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'packages/ui/.tool-versions'
          cache: 'npm'
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ui-dist
          path: packages/ui/dist/
          retention-days: 1

  test-compatibility:
    name: Test Compatibility
    if: needs.files-changed.outputs.ui == 'true'
    needs: [files-changed, build-library]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        example:
          - vue3-tailwind
          - vue3-css
          - vue2-tailwind
          - vue2-css
    defaults:
      run:
        working-directory: packages/ui/examples/${{ matrix.example }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: ui-dist
          path: packages/ui/dist/

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'packages/ui/.tool-versions'
          cache: 'npm'
          cache-dependency-path: packages/ui/examples/${{ matrix.example }}/package-lock.json

      - name: Install dependencies
        run: npm install

      - name: Lint
        run: npm run lint

      - name: Run tests
        run: npm test

      - name: Build example app
        run: npm run build

  compatibility-result:
    name: Compatibility Result
    if: always()
    needs: [files-changed, test-compatibility]
    runs-on: ubuntu-latest
    steps:
      - name: Skip if no UI changes
        if: needs.files-changed.outputs.ui != 'true'
        run: echo "No UI changes detected, skipping."

      - name: Check matrix results
        if: needs.files-changed.outputs.ui == 'true'
        run: |
          if [ "${{ needs.test-compatibility.result }}" != "success" ]; then
            echo "Compatibility tests failed"
            exit 1
          fi
