name: Maintenance Build

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

defaults:
  run:
    working-directory: maintenance

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      maintenance: ${{ steps.changes.outputs.maintenance }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build:
    name: Build
    if: needs.files-changed.outputs.maintenance == 'true'
    needs: files-changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'maintenance/.tool-versions'
          cache: 'npm'
          cache-dependency-path: maintenance/package-lock.json

      - name: Build UI library
        working-directory: packages/ui
        run: npm ci && npm run build

      - name: Install dependencies
        run: npm ci

      - name: Generate static site
        run: npx nuxt generate

      - name: Verify build output
        run: |
          if [ ! -d ".output/public" ]; then
            echo "::error::.output/public directory not found"
            exit 1
          fi

          if [ ! -f ".output/public/index.html" ]; then
            echo "::error::index.html not found in build output"
            exit 1
          fi

          echo "Build output verified!"
          ls -la .output/public/

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: maintenance-site
          path: maintenance/.output/public/
          retention-days: 7
