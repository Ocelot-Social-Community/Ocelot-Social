name: Branding Lint

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

defaults:
  run:
    working-directory: packages/branding

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      branding: ${{ steps.changes.outputs.branding }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Check for file changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  lint:
    name: ESLint + Typecheck
    if: needs.files-changed.outputs.branding == 'true'
    needs: files-changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: 'packages/branding/.tool-versions'
          cache: 'npm'
          cache-dependency-path: packages/branding/package-lock.json

      - name: Install dependencies
        run: npm ci

      # dist/*.d.ts must exist first: the build scripts + the type-checked lint resolve the compiled
      # package by path (../dist/*.js). See tsconfig.build.json vs tsconfig.json.
      - name: Build (for .d.ts)
        run: npm run build

      - name: Run ESLint
        run: npm run lint

      - name: Run TypeScript type check
        run: npm run typecheck

      # publint + are-the-types-wrong: guards the published package's exports/types resolution — catches
      # ESM/CJS interop regressions (the package is "type": "module" with a CommonJS dist).
      - name: Validate package
        run: npm run validate
