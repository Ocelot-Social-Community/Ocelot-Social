name: ocelot.social backend test CI


on: push

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Workflow-wide floor for GITHUB_TOKEN, so no job silently inherits the repository or organisation
# default. A job that needs more overrides it locally — note that a job-level block REPLACES this one
# rather than adding to it, which is why the escalating job below re-states everything it needs.
permissions:
  contents: read
  pull-requests: read

# Naming the shell explicitly is what turns on `pipefail`: an unspecified `run:` gets `bash -e {0}`,
# where only the LAST command of a pipeline decides the exit code. The `docker save X | zstd` steps
# below would then report success even when the save failed — zstd happily compresses an empty stream
# and exits 0 — and the failure would only surface later, at `docker load`.
defaults:
  run:
    shell: bash

jobs:
  files-changed:
    name: Detect File Changes - Backend
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
      docker: ${{ steps.changes.outputs.docker }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for backend file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
          list-files: shell

  build_test_neo4j:
    name: Docker Build Test - Neo4J
    if: needs.files-changed.outputs.backend == 'true' || needs.files-changed.outputs.docker == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Neo4J | Build 'community' image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: neo4j
          file: neo4j/Dockerfile
          target: community
          load: true
          tags: ghcr.io/ocelot-social-community/ocelot-social/neo4j:community
          cache-from: type=gha,scope=neo4j
          cache-to: type=gha,mode=max,scope=neo4j

      - name: Save image for test job
        run: docker save "ghcr.io/ocelot-social-community/ocelot-social/neo4j:community" | zstd -T0 -3 > /tmp/neo4j.tar.zst

      # ARTIFACT, not cache. This is a run-scoped hand-off between two jobs: the key carries
      # `github.run_id`, so it can never be hit by a later run — it only occupies the repository's
      # 10 GB cache budget and evicts, by LRU, the dependency caches that COULD hit. Artifacts do not
      # count against that budget at all. `retention-days: 7` matches what a cache would have given
      # (caches expire 7 days after last access), so "Re-run failed jobs" keeps working just as long.
      # zstd because `docker save` writes an UNCOMPRESSED layer tar; `compression-level: 0` because
      # the upload would otherwise compress the already-compressed payload a second time.
      - name: Upload image for the test job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: neo4j-image
          path: /tmp/neo4j.tar.zst
          retention-days: 7
          compression-level: 0

  build_test_backend:
    name: Docker Build Test - Backend
    if: needs.files-changed.outputs.backend == 'true' || needs.files-changed.outputs.docker == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: backend | Build 'test' image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: backend/Dockerfile
          target: test
          load: true
          tags: ghcr.io/ocelot-social-community/ocelot-social/backend:test
          cache-from: type=gha,scope=backend-test
          cache-to: type=gha,mode=max,scope=backend-test

      - name: Save image for test job
        run: docker save "ghcr.io/ocelot-social-community/ocelot-social/backend:test" | zstd -T0 -3 > /tmp/backend.tar.zst

      # ARTIFACT, not cache. This is a run-scoped hand-off between two jobs: the key carries
      # `github.run_id`, so it can never be hit by a later run — it only occupies the repository's
      # 10 GB cache budget and evicts, by LRU, the dependency caches that COULD hit. Artifacts do not
      # count against that budget at all. `retention-days: 7` matches what a cache would have given
      # (caches expire 7 days after last access), so "Re-run failed jobs" keeps working just as long.
      # zstd because `docker save` writes an UNCOMPRESSED layer tar; `compression-level: 0` because
      # the upload would otherwise compress the already-compressed payload a second time.
      - name: Upload image for the test job
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-test-image
          path: /tmp/backend.tar.zst
          retention-days: 7
          compression-level: 0

  lint_backend:
    name: Lint Backend
    if: needs.files-changed.outputs.backend == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'backend/package-lock.json'

      # The backend depends on @ocelot-social/branding via `file:../packages/branding`; its dist/ (built
      # output + .d.ts) must exist BEFORE `npm` packs the file: dependency, otherwise the types don't
      # resolve and the type-aware lint fails. (The unit-test job runs in Docker, whose Dockerfile builds
      # this stage already.)
      - name: Build @ocelot-social/branding
        run: cd packages/branding && npm ci && npm run build

      - name: backend | Lint
        run: cd backend && npm ci && npm run lint

  # Sharded across four runners. The suite runs with `fileParallelism: false` because every spec
  # talks to the SAME Neo4j and wipes it between cases (cleanDatabase) — so no parallelism is
  # available inside a runner without breaking that isolation. Sharding sidesteps the problem
  # instead of fighting it: each shard is a separate runner with its own compose stack and
  # therefore its own database, and `fileParallelism: false` still holds within each one.
  #
  # Four is where the curve flattens. Measured: ~95s of fixed setup per shard (image download and
  # `docker load` dominate at ~60s of it) against a 9m23s test run, so N=4 lands at ~5.5 minutes
  # wall clock versus 11 minutes today. N=6 would buy under a minute more for 50% more runner
  # minutes.
  #
  # Vitest splits test FILES, not test cases, and has no runtime feedback to balance them —
  # groups.spec.ts alone is three times the size of the next largest spec, so the shards are not
  # expected to finish evenly. The slowest one sets the wall clock.
  unit_test_backend:
    name: Unit tests - Backend (${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    if: needs.files-changed.outputs.backend == 'true' || needs.files-changed.outputs.docker == 'true'
    needs: [files-changed, build_test_neo4j, build_test_backend]
    runs-on: ubuntu-latest
    strategy:
      # A failing shard must not cancel its siblings. The shards cover disjoint sets of specs, so
      # killing them on the first failure hides every other failure in the suite and turns a full
      # picture into one bisect step per push.
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4]
        shardTotal: [4]
    permissions:
      # A job-level block REPLACES the workflow-level one, so `contents: read` has to be repeated
      # here — this job checks out the repository. It works today without it only because the
      # repository is public.
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download Neo4J image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: neo4j-image
          path: /tmp

      - name: Download backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-test-image
          path: /tmp

      - name: Load Docker Images
        run: |
          zstd -dc /tmp/neo4j.tar.zst | docker load
          zstd -dc /tmp/backend.tar.zst | docker load

      - name: backend | copy env files
        run: |
          cp webapp/.env.template webapp/.env
          cp backend/.env.template backend/.env

      - name: backend | docker compose
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --detach backend

      # `up --detach` returns when the CONTAINER started, not when Neo4j accepts bolt. The
      # first migrate run then raced it: the CI log showed nine index statements failing with
      # ECONNREFUSED while the constraints, issued moments later, went through. The indices
      # were simply missing afterwards — silently, because the previous schema installer
      # swallowed the error. The schema check is what made it visible.
      #
      # The helm chart's wait initContainer (templates/backend/deployment.yaml) uses node for a
      # port check, because busybox's nc has no portable -z. This one goes further, see below —
      # a port that listens is not the same as a database that answers.
      - name: backend | Wait for Neo4j to accept connections
        run: |
          # The DRIVER, not a bare TCP connect: Neo4j accepts on 7687 before it will answer a
          # query, and the step after this one runs migrations. verifyConnectivity() does the
          # Bolt handshake and `RETURN 1` proves the database itself is servable. Measured: a
          # net.connect probe reports READY against any listening port, this one does not.
          #
          # Built from `neo4j-driver` in node_modules rather than from the app's own
          # getDriver(): the `test` image is `FROM base` + `COPY backend/`, so it has no
          # build/ — and the production image has no src/ or tsx. node_modules is the one thing
          # both carry, and neo4j-driver is a runtime dependency.
          #
          # The env fallbacks mirror config/softwareDefaults.ts, so the probe connects exactly
          # where the migration will. With NEO4J_AUTH=none the credentials are ignored by the
          # server, which is why no special case is needed for it.
          #
          # The 5s guard: the driver would otherwise wait out its own connection timeout, far
          # past the retry interval.
          probe='const neo4j = require("neo4j-driver")
          const done = (code) => process.exit(code)
          setTimeout(() => done(1), 5000)
          const driver = neo4j.driver(
            process.env.NEO4J_URI || "bolt://localhost:7687",
            neo4j.auth.basic(
              process.env.NEO4J_USERNAME || "neo4j",
              process.env.NEO4J_PASSWORD || "neo4j",
            ),
          )
          driver.verifyConnectivity()
            .then(() => driver.session().run("RETURN 1"))
            .then(() => done(0))
            .catch(() => done(1))'
          # An absolute deadline, not a number of attempts. A failing probe costs up to 5s of
          # its own guard plus the 5s pause, so "60 attempts" was anywhere between five and ten
          # minutes of runner time — and this step runs once per job. The wall clock is the
          # thing worth bounding, and it makes the failure message exact by construction.
          deadline_seconds=300
          started=$(date +%s)
          deadline=$(( started + deadline_seconds ))
          attempt=0
          while :; do
            remaining=$(( deadline - $(date +%s) ))
            [ "$remaining" -gt 0 ] || break
            attempt=$(( attempt + 1 ))
            # Both waits are capped by what is left of the deadline. The probe guards itself at 5s,
            # but that guard runs INSIDE the container while the deadline lives out here — without the
            # cap a probe starting one second before the deadline still burns its five, and the pause
            # adds five more. 6s so the normal path is decided by the probe's own guard, not by this.
            if timeout "$(( remaining < 6 ? remaining : 6 ))" docker compose exec -T backend node -e "$probe"; then
              echo "neo4j is reachable after $attempt attempt(s)"
              exit 0
            fi
            remaining=$(( deadline - $(date +%s) ))
            [ "$remaining" -gt 0 ] || break
            sleep "$(( remaining < 5 ? remaining : 5 ))"
          done
          echo "neo4j was not ready: $attempt attempts over $(( $(date +%s) - started ))s (deadline ${deadline_seconds}s)"
          exit 1

      - name: backend | Initialize Database
        run: docker compose exec -T backend npm run db:migrate -- init

      - name: backend | Migrate Database Up
        run: docker compose exec -T backend npm run db:migrate -- up

      # Read-only, and it exits non-zero on any finding. Placed BEFORE the unit tests because
      # those wipe the database (every spec calls cleanDatabase), which would make the data
      # audits vacuous. On a freshly migrated database the meaningful part is the comparison
      # against src/db/schema: a constraint or index the declaration wants and `migrate init`
      # did not produce, or one the database holds that nothing declares any more — plus a
      # label or relationship type in the database that the registry does not know.
      #
      # Only on the first shard. It is a property of the migration against the declaration, not of
      # the test run, so every shard would assert the identical thing against an identically
      # migrated database. Kept here rather than promoted to a job of its own because a separate
      # job would pay the full ~95s setup (image load, Neo4j boot, migrate) a second time to
      # re-run an 8s check that shard 1 already has the state for.
      - name: backend | Schema check - declaration vs. database
        if: matrix.shardIndex == 1
        run: docker compose exec -T backend npm run db:schema:check

      # `--coverage` stays ON per shard: the coverage data is what gets embedded in the blob and
      # merged later. The THRESHOLD is what has to be off (`test:shard` passes
      # --coverage.thresholds.lines=0) — a shard runs a quarter of the specs against the whole of
      # `src/**/*.ts`, so the 94.3% gate would fail every shard by construction. It is enforced
      # once, on the merged total, in the job below.
      #
      # The blob goes to a directory of its OWN, not into `coverage/` next to the reports:
      # `--merge-reports=<dir>` parses EVERY file in the directory it is given as a blob, and
      # chokes on the first one that is not (verified — it fails with a JSON SyntaxError).
      - name: backend | Unit test (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
        run: |
          docker compose exec -T backend npm run test:shard -- \
            --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }} \
            --outputFile=coverage/blobs/blob-${{ matrix.shardIndex }}.json

      # `./coverage` is bind-mounted to `/app/coverage` (docker-compose.test.yml), so the blob the
      # container just wrote is already on the runner — no `docker compose cp` needed.
      - name: backend | Upload coverage blob
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: backend-coverage-blob-${{ matrix.shardIndex }}
          path: coverage/blobs/blob-${{ matrix.shardIndex }}.json
          retention-days: 1
          if-no-files-found: error

  # The coverage gate. No shard can hold it on its own — each one exercises a quarter of the specs
  # against the whole of `src/**/*.ts` — so the 94.3% line threshold from vitest.config.ts is
  # checked here, once, on the merged total. This is the job to make a required status check;
  # the shards individually only prove that their own slice passed.
  #
  # Verified before adopting this: merged coverage is IDENTICAL to a single unsharded run, down to
  # the covered/total counts on lines, statements, functions and branches. That is not a given —
  # vitest-dev/vitest#8616 reports merged v8 coverage drifting far enough to break thresholds, but
  # that repro relies on `experimentalAstAwareRemapping`, which this project does not set, and
  # `coverage.include: ['src/**/*.ts']` gives every shard the same file basis to begin with.
  #
  # No Neo4j, no migration, no compose stack: `--merge-reports` runs no tests, it re-aggregates
  # the blobs. It only needs the backend image for vitest, its node_modules and the sources the
  # v8 provider remaps against.
  merge_coverage_backend:
    name: Coverage - Backend
    if: needs.files-changed.outputs.backend == 'true' || needs.files-changed.outputs.docker == 'true'
    needs: [files-changed, build_test_backend, unit_test_backend]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download backend image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: backend-test-image
          path: /tmp

      - name: Load Docker Image
        run: zstd -dc /tmp/backend.tar.zst | docker load

      # `merge-multiple` flattens all four artifacts into the one directory `--merge-reports`
      # expects. Nothing else may land in it — see the note on the shard test step.
      - name: Download coverage blobs
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: backend-coverage-blob-*
          merge-multiple: true
          path: coverage/blobs

      - name: backend | copy env files
        run: |
          cp webapp/.env.template webapp/.env
          cp backend/.env.template backend/.env

      # `run` rather than `up`+`exec`, and `--no-deps` because the backend service declares
      # depends_on minio/minio-mc/mailserver — none of which a report merge has any use for.
      - name: backend | Merge coverage incl. coverage check
        run: |
          docker compose -f docker-compose.yml -f docker-compose.test.yml \
            run --rm --no-deps -T backend npm run test:merge

