name: UI Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  # The merge queue runs the required checks on its temporary gh-readonly-queue/master/* branch.
  merge_group:

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
#
# master is the exception: one group per COMMIT there, so a merge never cancels the run of the
# commit before it. Every master commit gets its full result instead of a red "cancelled" — a
# Dependabot wave merging every few minutes otherwise left hardly one commit with complete checks.
# Runs of different master commits may overlap; nothing here depends on their order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.sha) || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: without this block the jobs inherit whatever the repository or
# organisation default is, which may be read-write. Read-only is all this workflow does — the token
# is handed to dorny/paths-filter, which needs `pull-requests: read` to list a pull request's
# changed files.
permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    # actions: read for the merge-queue lookup below; a job-level block replaces the workflow's,
    # so the rest is restated.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      ui: ${{ steps.changes.outputs.ui }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On master, a commit the merge queue already tested here reports no changes: every job
      # below is then skipped (which counts as passed), instead of running the same tree twice.
      - name: Already verified by the merge queue?
        id: queue
        uses: ./.github/actions/merge-queue-verified

      - name: Check for file changes
        if: steps.queue.outputs.verified != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build:
    name: Build Docker Image
    if: needs.files-changed.outputs.ui == 'true'
    needs: files-changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # Base images from Docker Hub through Google's mirror of it first: a 503 from Docker Hub
        # failed whole builds. BuildKit falls back to docker.io whenever the mirror has nothing.
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Build development image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./packages/ui
          file: ./packages/ui/Dockerfile
          target: development
          push: false
          tags: ocelot-social/ui:development
          cache-from: type=gha,scope=ui-development
          cache-to: type=gha,mode=max,scope=ui-development

      - name: Build production image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ./packages/ui
          file: ./packages/ui/Dockerfile
          target: production
          push: false
          tags: ocelot-social/ui:latest
          cache-from: type=gha,scope=ui-production
          cache-to: type=gha,mode=max,scope=ui-production
