name: UI Release

on:
  push:
    branches: [master]
    paths:
      - 'packages/ui/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'

# One run at a time, and never drop one. `cancel-in-progress: false` alone does NOT achieve that:
# the default `queue: single` holds exactly ONE pending run, and the next arrival cancels it. Three
# pushes in quick succession would therefore skip the middle one's release outright — no release PR,
# no publish, and nothing saying so. `queue: max` keeps a real backlog instead (up to 100 runs,
# processed in order), so every release commit gets its run. The two settings are coupled: pairing
# `queue: max` with cancelling is a workflow validation error.
# The group matches the CI workflows here (pull request number, falling back to `github.ref`); this
# one only triggers on push, so it always resolves to refs/heads/master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

# Read-only default, because nothing here writes with GITHUB_TOKEN: release-please authenticates
# with the it4c-release-bot app token minted below, and `publish` authenticates to npm over OIDC.
# Set explicitly rather than inheriting the repository or organisation default; the `publish` job
# widens it to `id-token: write` for itself.
permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    # Deliberately no `permissions:` block. Neither step here uses GITHUB_TOKEN: there is no
    # checkout, `create-github-app-token` authenticates with the app id and private key, and
    # release-please-action takes its credentials solely from its `token` input (src/index.ts reads
    # `core.getInput('token')` and hands that to the GitHub client — `process.env` is only consulted
    # for GITHUB_REPOSITORY, never as an auth fallback). Granting write here would have widened
    # GITHUB_TOKEN without any step asking for it. What release-please is actually allowed to do is
    # governed by the app token's scopes below.
    outputs:
      release_created: ${{ steps.release.outputs['packages/ui--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/ui--tag_name'] }}
      version: ${{ steps.release.outputs['packages/ui--version'] }}

    steps:
      # Mint a token from the it4c-release-bot GitHub App (vars.RELEASE_APP_ID +
      # secrets.RELEASE_APP_PRIVATE_KEY) instead of the default GITHUB_TOKEN — a GITHUB_TOKEN-created
      # release PR/tag does NOT trigger other workflows, so the ui build/lint/test checks would never
      # run on the release PR. The app token lets them run.
      - name: Generate it4c-release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the minted token to what release-please actually does. Without these inputs "the
          # token inherits all the installation's permissions" — the workflow-level `permissions:`
          # block above governs GITHUB_TOKEN only and does not constrain this one, so whatever the
          # app happens to be installed with would reach every later step in this job.
          #   contents      — commits, branches, tags and the GitHub release
          #   pull-requests — the release pull request itself
          #   issues        — its `autorelease: pending`/`tagged` labels; labelling a pull request
          #                   goes through the issues API, so it is a separate scope
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Everything that runs third-party code lives HERE, in a job that cannot mint an OIDC token.
  # `ACTIONS_ID_TOKEN_REQUEST_URL`/`_TOKEN` are job-wide environment variables, readable by every
  # step — including any `postinstall` in the dependency tree `npm ci` unpacks. Granting
  # `id-token: write` to the same job that installs Storybook, Playwright and Vite would let any
  # one of those packages exchange a token for npm publish rights on @ocelot-social/ui.
  build:
    name: Build package
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: packages/ui

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'packages/ui/.tool-versions'
          cache: 'npm'
          cache-dependency-path: packages/ui/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Validate package
        run: npm run validate

      # The exact bytes that get published. Packing here rather than in `publish` is what makes the
      # split work: the privileged job then needs neither the sources nor a dependency install.
      # `--pack-destination` does not create the directory, it fails with ENOENT — hence the mkdir.
      - name: Pack tarball
        run: |
          mkdir -p "${RUNNER_TEMP}/pkg"
          npm pack --pack-destination "${RUNNER_TEMP}/pkg"

      - name: Upload tarball
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: npm-package-ui
          path: ${{ runner.temp }}/pkg/*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish to npm
    needs: [release-please, build]
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    # Job-level block, and it REPLACES the workflow-level one rather than adding to it — hence
    # `contents: read` is repeated here for the sparse checkout below.
    #   id-token: write — mints the OIDC token that npm trusted publishing authenticates with. No
    #                     NPM_TOKEN anywhere: the registry verifies the OIDC claims (repository,
    #                     workflow filename, ref) against the trusted publisher configured on the
    #                     package, so there is no long-lived credential to store or rotate. This
    #                     also makes npm attach a provenance attestation automatically — `id-token`
    #                     is what signs it, and `--provenance` is therefore not passed below.
    #                     Provenance survives the split: the attested subject is computed from the
    #                     tarball's bytes, not from how it came to be on disk.
    permissions:
      contents: read
      id-token: write

    steps:
      # Sparse, and deliberately so: the only thing this job needs from the repository is the Node
      # version. Checking out is not what is dangerous — executing is — but keeping the working
      # copy to a single file makes it obvious that nothing here can run.
      - name: Checkout Node version
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: packages/ui/.tool-versions
          sparse-checkout-cone-mode: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Trusted publishing needs npm >= 11.5.1, whose own floor is Node >= 22.14.0. npm is
          # taken from Node's bundle here, and that is the tighter of the two constraints: Node 22
          # LTS ships npm 10.9.x to this day, and the first Node bundling >= 11.5.1 is 24.5.0. The
          # version pinned in .tool-versions (25.5.0) brings npm 11.8.0. Below that, OIDC drops out
          # silently unless a step installs a newer npm explicitly.
          node-version-file: 'packages/ui/.tool-versions'
          # Still required without a token: it writes the .npmrc that points npm at the public
          # registry, which is where the OIDC exchange happens. No `cache:` — nothing is installed.
          registry-url: 'https://registry.npmjs.org'

      - name: Download tarball
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: npm-package-ui
          path: ${{ runner.temp }}/pkg

      # Authenticated by the OIDC token, not by a secret. The trusted publisher on npm pins the
      # workflow FILENAME (`ui-release.yml`), so moving or renaming this file breaks publishing
      # with a 404 until the configuration on npmjs.com is updated to match.
      #
      # Publishing a tarball rather than a directory runs no lifecycle scripts at all — npm gates
      # those on `spec.type === 'directory'`. `--ignore-scripts` is redundant belt-and-braces, and
      # the run happens outside any package directory so npm cannot pick up a local package.json.
      - name: Publish to npm
        run: npm publish "${RUNNER_TEMP}"/pkg/*.tgz --access public --ignore-scripts
