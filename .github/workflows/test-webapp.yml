name: ocelot.social webapp test CI


on:
  # Every branch and every tag, as a bare `on: push` gave — except the merge queue's temporary
  # branch. Creating it raises a push event too, and the `merge_group` run below already covers it;
  # without the exclusion every queue entry would run this workflow twice. `tags` has to be spelled
  # out because naming `branches-ignore` alone would stop the workflow from running for tags.
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
    tags:
      - '**'
  # The merge queue runs the required checks on its temporary gh-readonly-queue/master/* branch.
  merge_group:

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
#
# master is the exception: one group per COMMIT there, so a merge never cancels the run of the
# commit before it. Every master commit gets its full result instead of a red "cancelled" — a
# Dependabot wave merging every few minutes otherwise left hardly one commit with complete checks.
# Runs of different master commits may overlap; nothing here depends on their order.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || (github.ref == 'refs/heads/master' && github.sha) || github.ref }}
  cancel-in-progress: true

# Workflow-wide floor for GITHUB_TOKEN, so no job silently inherits the repository or organisation
# default. A job that needs more overrides it locally — note that a job-level block REPLACES this one
# rather than adding to it, which is why the escalating job below re-states everything it needs.
permissions:
  contents: read
  pull-requests: read

# Naming the shell explicitly is what turns on `pipefail`: an unspecified `run:` gets `bash -e {0}`,
# where only the LAST command of a pipeline decides the exit code. The `docker save X | zstd` steps
# below would then report success even when the save failed — zstd happily compresses an empty stream
# and exits 0 — and the failure would only surface later, at `docker load`.
defaults:
  run:
    shell: bash

jobs:
  files-changed:
    name: Detect File Changes - Webapp
    runs-on: ubuntu-latest
    # actions: read for the merge-queue lookup below; a job-level block replaces the workflow's,
    # so the rest is restated.
    permissions:
      contents: read
      pull-requests: read
      actions: read
    outputs:
      docker: ${{ steps.changes.outputs.docker }}
      webapp: ${{ steps.changes.outputs.webapp }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # On master, a commit the merge queue already tested here reports no changes: every job
      # below is then skipped (which counts as passed), instead of running the same tree twice.
      - name: Already verified by the merge queue?
        id: queue
        uses: ./.github/actions/merge-queue-verified

      - name: Check for frontend file changes
        if: steps.queue.outputs.verified != 'true'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
          list-files: shell

  prepare:
    name: Prepare
    if: needs.files-changed.outputs.webapp == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'webapp/.nvmrc'

      - name: Check translation files
        run: |
          scripts/translations/sort.sh
          scripts/translations/missing-keys.sh
          scripts/translations/backend-error-codes.sh

  build_test_webapp:
    name: Docker Build Test - Webapp
    if: needs.files-changed.outputs.docker == 'true' || needs.files-changed.outputs.webapp == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        # Base images from Docker Hub through Google's mirror of it first: a 503 from Docker Hub
        # failed whole builds. BuildKit falls back to docker.io whenever the mirror has nothing.
        with:
          buildkitd-config-inline: |
            [registry."docker.io"]
              mirrors = ["mirror.gcr.io"]

      - name: Webapp | Build 'test' image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: webapp/Dockerfile
          target: test
          load: true
          tags: ghcr.io/ocelot-social-community/ocelot-social/webapp:test
          # Reads the scopes of the other builds of this Dockerfile too (webapp, webapp-e2e): the stages
          # they share (base image, dependencies, branding) are then built once, not once per
          # workflow. Writes only its own, so builds running side by side never race for a key.
          cache-from: |
            type=gha,scope=webapp-test
            type=gha,scope=webapp
            type=gha,scope=webapp-e2e
          cache-to: type=gha,mode=max,scope=webapp-test

      - name: Save image for test job
        run: docker save "ghcr.io/ocelot-social-community/ocelot-social/webapp:test" | zstd -T0 -3 > /tmp/webapp.tar.zst

      # ARTIFACT, not cache. This is a run-scoped hand-off between two jobs: the key carries
      # `github.run_id`, so it can never be hit by a later run — it only occupies the repository's
      # 10 GB cache budget and evicts, by LRU, the dependency caches that COULD hit. Artifacts do not
      # count against that budget at all. `retention-days: 7` matches what a cache would have given
      # (caches expire 7 days after last access), so "Re-run failed jobs" keeps working just as long.
      # zstd because `docker save` writes an UNCOMPRESSED layer tar; `compression-level: 0` because
      # the upload would otherwise compress the already-compressed payload a second time.
      - name: Upload image for the test job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: webapp-test-image
          path: /tmp/webapp.tar.zst
          retention-days: 7
          compression-level: 0

  lint_webapp:
    name: Lint Webapp
    if: needs.files-changed.outputs.webapp == 'true'
    needs: files-changed
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: 'webapp/.nvmrc'
          cache: 'npm'
          cache-dependency-path: 'webapp/package-lock.json'

      # The webapp depends on @ocelot-social/branding via `file:../packages/branding`; its dist/ must
      # exist BEFORE `npm` packs the file: dependency, otherwise `import/no-unresolved` fails on the
      # branding imports. (The unit-test job runs in Docker, whose Dockerfile builds this stage already.)
      - name: Build @ocelot-social/branding
        run: cd packages/branding && npm ci && npm run build

      - name: webapp | Lint
        run: cd webapp && npm ci && npm run lint

      # Separate step so a token regression reads as one in the log, rather than as "lint failed".
      # Needs no install of its own — it only reads files (see webapp/scripts/check-css-tokens.js).
      - name: webapp | Design tokens
        run: cd webapp && npm run lint:css-tokens

  unit_test_webapp:
    name: Unit Tests - Webapp
    if: needs.files-changed.outputs.docker == 'true' || needs.files-changed.outputs.webapp == 'true'
    needs: [files-changed, build_test_webapp]
    runs-on: ubuntu-latest
    permissions:
      # A job-level block REPLACES the workflow-level one, so `contents: read` has to be repeated
      # here — this job checks out the repository. It works today without it only because the
      # repository is public.
      contents: read
      checks: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download webapp image
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: webapp-test-image
          path: /tmp

      - name: Load Docker Image
        run: zstd -dc /tmp/webapp.tar.zst | docker load

      - name: Copy env files
        run: |
          cp webapp/.env.template webapp/.env
          cp backend/.env.template backend/.env

      - name: Start webapp container
        run: docker compose -f docker-compose.yml -f docker-compose.test.yml up --detach --no-deps webapp

      - name: webapp | Unit tests incl. coverage check
        run: docker compose exec -T webapp npm test
