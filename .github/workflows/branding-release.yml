name: Branding Release

on:
  push:
    branches: [master]
    paths:
      - 'packages/branding/**'
      - 'release-please-config.json'
      - '.release-please-manifest.json'

# One run at a time, and never drop one. `cancel-in-progress: false` alone does NOT achieve that:
# the default `queue: single` holds exactly ONE pending run, and the next arrival cancels it. Three
# pushes in quick succession would therefore skip the middle one's release outright — no release PR,
# no publish, and nothing saying so. `queue: max` keeps a real backlog instead (up to 100 runs,
# processed in order), so every release commit gets its run. The two settings are coupled: pairing
# `queue: max` with cancelling is a workflow validation error.
# The group matches the CI workflows here (pull request number, falling back to `github.ref`); this
# one only triggers on push, so it always resolves to refs/heads/master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

permissions:
  contents: read

jobs:
  release-please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/branding--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/branding--tag_name'] }}
      version: ${{ steps.release.outputs['packages/branding--version'] }}

    steps:
      # Mint a token from the it4c-release-bot GitHub App (vars.RELEASE_APP_ID +
      # secrets.RELEASE_APP_PRIVATE_KEY) instead of the default GITHUB_TOKEN — a GITHUB_TOKEN-created
      # release PR/tag does NOT trigger other workflows, so the branding build/lint/test checks would
      # never run on the release PR. The app token lets them run.
      - name: Generate it4c-release-bot token
        id: app-token
        uses: actions/create-github-app-token@fee1f7d63c2ff003460e3d139729b119787bc349 # v2.2.2
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the minted token to what release-please actually does. Without these inputs "the
          # token inherits all the installation's permissions" — the workflow-level `permissions:`
          # block above governs GITHUB_TOKEN only and does not constrain this one, so whatever the
          # app happens to be installed with would reach every later step in this job.
          #   contents      — commits, branches, tags and the GitHub release
          #   pull-requests — the release pull request itself
          #   issues        — its `autorelease: pending`/`tagged` labels; labelling a pull request
          #                   goes through the issues API, so it is a separate scope
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Publish to npm
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packages/branding

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version-file: 'packages/branding/.tool-versions'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'
          cache-dependency-path: packages/branding/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Build the CommonJS dist (+ dist/package.json CJS marker via postbuild) that consumers require;
      # `files` publishes dist/ + scripts/ (the .ts sources for the ocelot-brand-archive bin).
      - name: Build
        run: npm run build

      - name: Validate package
        run: npm run validate

      - name: Publish to npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
