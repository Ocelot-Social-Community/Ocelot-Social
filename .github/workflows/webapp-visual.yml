name: Webapp Visual

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege. pull-requests:read is required by dorny/paths-filter, which lists a PR's changed
# files via the API (the fetch-depth:1 checkout has no base history for a local diff).
permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: webapp

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      webapp: ${{ steps.changes.outputs.webapp }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  visual:
    name: Visual Regression
    if: needs.files-changed.outputs.webapp == 'true'
    needs: files-changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'webapp/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: 'webapp/yarn.lock'

      # The webapp depends on @ocelot-social/branding and @ocelot-social/ui via file: links; their
      # dist/ directories are not committed, so they must be built BEFORE `yarn` copies the
      # file: dependencies into node_modules — otherwise the install resolves an empty package.
      - name: Build @ocelot-social/branding
        working-directory: packages/branding
        run: npm ci && npm run build

      - name: Build @ocelot-social/ui
        working-directory: packages/ui
        run: npm ci && npm run build

      # The repo root node_modules/ (webpack@5, etc.) must exist so that vue-loader's
      # plugin-webpack5.js can resolve webpack/lib/rules/BasicEffectRulePlugin via Node's
      # directory-walk — it is present in root/node_modules/webpack but absent from
      # webapp/node_modules/webpack (which is v4).
      - name: Install root dependencies
        working-directory: .
        run: yarn --frozen-lockfile --ignore-scripts

      - name: Install dependencies
        run: yarn --frozen-lockfile

      - name: Build Storybook
        run: yarn build-storybook

      - name: Install Playwright browsers
        run: npx playwright install chromium --with-deps

      - name: Run visual tests
        run: yarn test:visual

      - name: Upload test results
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: failure()
        with:
          name: webapp-visual-test-results
          path: |
            webapp/test-results/
            webapp/playwright-report/
          retention-days: 7
