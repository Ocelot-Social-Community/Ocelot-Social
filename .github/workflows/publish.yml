name: publish

on:
  push:
    branches:
      - master

# One run at a time, and never drop one. `cancel-in-progress: false` alone does NOT achieve that:
# the default `queue: single` holds exactly ONE pending run, and the next arrival cancels it. This
# workflow tags a version, cuts a GitHub release and dispatches the downstream deploys — a dropped
# pending run means one master commit silently never gets tagged or shipped. `queue: max` keeps a
# real backlog instead (up to 100 runs, processed in order). The two settings are coupled: pairing
# `queue: max` with cancelling is a workflow validation error.
# The group matches the CI workflows here (pull request number, falling back to `github.ref`); this
# one only triggers on push, so it always resolves to refs/heads/master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

# Read-only floor, so no job silently inherits the repository or organisation default. Write is
# granted per job, to the ones that need it: `contents: write` for github_tag and release_notes,
# which create the build tag and edit the GitHub release with GITHUB_TOKEN, and `packages: write`
# for docker_retag, which pushes the version tags to the registry. `release_please` needs none of
# it — it works through the it4c-release-bot app token it mints itself. The repository dispatches in
# build_trigger authenticate with OCELOT_PUBLISH_EVENT_PAT rather than GITHUB_TOKEN, so that job
# needs no scope at all and says so with `permissions: {}`.
permissions:
  contents: read

jobs:
  ##############################################################################
  # JOB: RELEASE PLEASE ########################################################
  ##############################################################################
  # Owns the version. On a normal master push it only refreshes the open release pull request; on
  # the push that merges that pull request it bumps every versioned file, writes CHANGELOG.md,
  # creates the `<version>` git tag and cuts the GitHub release.
  #
  # Its `release_created` output is NOT what the jobs below gate on. It is true exactly once —
  # release-please will not create an existing release a second time — so a re-run after a failure
  # further down would report `false` and silently skip the work that failed. github_tag answers
  # "is this commit the release?" from the tag instead, which stays true across re-runs.
  #
  # Runs first in this workflow rather than in a file of its own (the packages each have one) so
  # that the tag, the version image tags and the release notes are produced by one run, in order,
  # with no cross-workflow race over who releases what.
  release_please:
    name: Release Please
    runs-on: ubuntu-latest
    outputs:
      # Only the version, and only as a cross-check — see the comment above on why
      # `release_created` is deliberately not exposed as a gate. For the root package (manifest path
      # `.`) the action publishes its outputs unprefixed, so there is no
      # `packages/branding--version` equivalent of the key branding-release.yml reads.
      version: ${{ steps.release.outputs.version }}
    steps:
      # Mint a token from the it4c-release-bot GitHub App (vars.RELEASE_APP_ID +
      # secrets.RELEASE_APP_PRIVATE_KEY) instead of the default GITHUB_TOKEN — a GITHUB_TOKEN-created
      # release PR/tag does NOT trigger other workflows, so none of the CI checks would ever run on
      # the release pull request. The app token lets them run. Same reasoning as in the package
      # release workflows.
      - name: Generate it4c-release-bot token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          # Narrow the minted token to what release-please actually does. Without these inputs the
          # token inherits all the installation's permissions — the workflow-level `permissions:`
          # block above governs GITHUB_TOKEN only and does not constrain this one.
          #   contents      — commits, branches, tags and the GitHub release
          #   pull-requests — the release pull request itself
          #   issues        — its `autorelease: pending`/`tagged` labels; labelling a pull request
          #                   goes through the issues API, so it is a separate scope
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write

      - name: Release Please
        id: release
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app-token.outputs.token }}
          # Scoped to the application at the repository root. `packages/*` have their own
          # config/manifest pair and their own workflow — see .github/release-please/README.md. The
          # root config does NOT exclude packages/**: a `feat(package/ui)` ships with the app, so it
          # belongs in the app's changelog and bumps the app's version, exactly as the hand-written
          # auto-changelog releases did.
          config-file: .github/release-please/root-config.json
          manifest-file: .github/release-please/root-manifest.json

  ##############################################################################
  # JOB: GITHUB TAG LATEST VERSION #############################################
  ##############################################################################
  github_tag:
    name: Tag latest version on Github
    runs-on: ubuntu-latest
    # Ordering only: the release state below is read back from the repository, and release_please
    # has to have created the tag before that read happens.
    needs: [release_please]
    # Writes the per-commit build tag with GITHUB_TOKEN. `release_notes` below needs the same scope
    # to edit the release body; `docker_retag` needs `packages: write` instead, and `build_trigger`
    # needs nothing at all — its repository dispatches authenticate with OCELOT_PUBLISH_EVENT_PAT.
    # Each job states its own, none inherits more than it uses.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_tag: ${{ steps.version.outputs.build_tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout code
        # actions/checkout leaves GITHUB_TOKEN in the workspace's .git/config unless told not to,
        # and no step in this workflow runs an authenticated git operation: git-tag-action below
        # reaches the API through `github.getOctokit(github_token)`, and release_notes talks to the
        # releases API through `gh`.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Setup env
        id: version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # package.json, not the release_please output: this job runs on EVERY master push and the
          # build tag has to exist for all of them. On a release commit the two agree by
          # construction — release-please bumped package.json in that same commit.
          VERSION="$(node -p -e "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Matches what git-tag-action produces below: the `b` prefix plus version and build
          # number. Downstream consumers get one immutable identifier that names both the git tag
          # and the container image tag for this exact commit.
          echo "build_tag=b${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"

          # "Is this commit the release?" is answered from the repository — does the `<version>` tag
          # point here — and NOT from release_please's `release_created`. That output is true exactly
          # once: release-please refuses to create an existing release a second time (the same
          # property that lost @ocelot-social/ui@0.0.2, see .github/release-please/README.md). Gating
          # the retag on it means that if docker_retag ever fails, a re-run reports `false` and the
          # version image tags are never applied at all — unrecoverable without doing it by hand.
          # Reading the tag is idempotent: true on the release commit and on every re-run of it,
          # false on every later commit.
          REF="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${VERSION}" 2>/dev/null || true)"
          TAGGED_SHA="$(printf '%s' "${REF}" | jq -r '.object.sha // empty')"
          # An annotated tag's ref points at the tag object, not at the commit. release-please
          # creates lightweight ones, but a tag pushed by hand would not be, and the difference
          # would silently read as "not the release commit".
          if [ "$(printf '%s' "${REF}" | jq -r '.object.type // empty')" = 'tag' ]; then
            TAGGED_SHA="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${TAGGED_SHA}" --jq '.object.sha')"
          fi
          if [ "${TAGGED_SHA}" = "${GITHUB_SHA}" ]; then
            echo 'is_release=true' >> "$GITHUB_OUTPUT"
          else
            echo 'is_release=false' >> "$GITHUB_OUTPUT"
          fi
      - name: package-version-to-git-tag + build number
        uses: pkgdeps/git-tag-action@a5a161774bace8b4e1969dd850c67a7421f1b710 # v3.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ steps.version.outputs.version }}-${{ github.run_number }}
          git_commit_sha: ${{ github.sha }}
          # The `b` prefix is load-bearing now that release-please derives the version from the
          # tags: `3.18.4-2267` parses as a prerelease of the root component and would join the
          # release history, `b3.18.4-2267` is not a version and is ignored.
          git_tag_prefix: "b"

  ##############################################################################
  # JOB: TAG THE CONTAINER IMAGES ##############################################
  ##############################################################################
  # `docker-push` builds and pushes every image under `sha-<40 hex>` on the same push that starts
  # this workflow. Copying those manifests onto the version tags is preferred over rebuilding: it
  # takes seconds instead of a full matrix build, and it guarantees the released image is bit for
  # bit the artefact CI tested, which a rebuild cannot promise.
  docker_retag:
    name: Tag container images
    runs-on: ubuntu-latest
    needs: [release_please, github_tag]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      VERSION: ${{ needs.github_tag.outputs.version }}
      BUILD_TAG: ${{ needs.github_tag.outputs.build_tag }}
      IS_RELEASE: ${{ needs.github_tag.outputs.is_release }}
      # Empty on every push that is not a release, AND on a re-run of one — release-please only
      # reports a version in the run that created the release. Only used to cross-check VERSION
      # below, so an empty value simply skips that check rather than failing it.
      RELEASE_VERSION: ${{ needs.release_please.outputs.version }}
      # `docker-push` and this workflow are triggered by the same push and run concurrently, with
      # no way to express a dependency across workflows. Waiting for the source manifest to appear
      # is that dependency. The budget covers a cold cache on the slowest image; exceeding it is a
      # real failure (a broken or skipped build), not something to paper over with a fallback tag.
      WAIT_SECONDS: 2400
      POLL_SECONDS: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy sha-tagged manifests onto the version tags
        run: |
          set -euo pipefail

          # Two sources say what this release is called: the version release-please released, and
          # the one it wrote into package.json through the config's `extra-files`. They can only
          # disagree if that file list stops matching reality — and the failure would be silent:
          # images tagged with the old version while the git tag carries the new one, which is
          # exactly what the branded downstream repositories resolve by. Skipped when
          # RELEASE_VERSION is empty, which is every run that did not itself create the release —
          # including a re-run of the release commit, where the tag comparison above still holds.
          if [ -n "${RELEASE_VERSION}" ] && [ "${RELEASE_VERSION}" != "${VERSION}" ]; then
            echo "::error::release-please released ${RELEASE_VERSION} but package.json says ${VERSION} — check extra-files in .github/release-please/root-config.json"
            exit 1
          fi

          # GITHUB_REPOSITORY and GITHUB_SHA rather than the matching Actions expressions: an
          # expression is substituted into the script text, the runner defaults arrive as data. Same
          # reason as in the release notes step of release_notes, applied uniformly so the rule does
          # not read as if these two were exceptions.
          #
          # GITHUB_REPOSITORY keeps the owner's capitalisation, registry paths are lowercase only.
          # docker/metadata-action does this downcasing for the build; here it is done by hand.
          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          SOURCE_TAG="sha-${GITHUB_SHA}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))

          for APP in $(jq -r '.[].name' .github/images.json); do
            IMAGE="${REGISTRY}/${REPOSITORY}/${APP}"

            until docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}" > /dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                echo "::error::${IMAGE}:${SOURCE_TAG} never appeared — check the docker-push run for ${GITHUB_SHA}"
                exit 1
              fi
              echo "waiting for ${IMAGE}:${SOURCE_TAG}"
              sleep "${POLL_SECONDS}"
            done

            # The build tag is unique per commit and therefore always safe to apply. The version
            # tags are only moved on the release commit — that is what IS_RELEASE, fed by
            # github_tag's tag lookup, decides. Without the distinction this would move
            # `3.18.4` onto every later master commit, which is the mutability the version tags
            # exist to avoid.
            # `latest` alongside the version tags, because without it `docker pull <image>` — the
            # form every registry UI and every copied command line uses — fails outright. It only
            # moves on a release, never on an ordinary master commit: the moving tag that follows
            # master already exists and is called `master` (docker-push applies it through
            # `type=ref,event=branch`), and conflating the two would make `latest` mean "newest
            # commit" rather than "newest release".
            TAGS=(--tag "${IMAGE}:${BUILD_TAG}")
            if [ "${IS_RELEASE}" = 'true' ]; then
              TAGS+=(--tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${MINOR}" --tag "${IMAGE}:${MAJOR}" --tag "${IMAGE}:latest")
            fi

            echo "tagging ${IMAGE}: ${TAGS[*]//--tag /}"
            docker buildx imagetools create "${TAGS[@]}" "${IMAGE}:${SOURCE_TAG}"
          done

  ##############################################################################
  # JOB: CUT THE GITHUB RELEASE ################################################
  ##############################################################################
  # The release itself is created by release_please, with the changelog entry it generated as the
  # body — that is the whole point of the migration, so nothing here re-derives release notes.
  # What is appended is the one thing release-please cannot know: which container image tags this
  # release is published under. It runs after docker_retag so those tags exist by the time anyone
  # can read about them, and it is also what takes the release out of draft — see the publish step.
  #
  # `gh release view`/`edit` do find a draft by tag: the releases-by-tag endpoint returns 404 for
  # drafts, and gh falls back to listing releases and matching the tag name itself.
  #
  # Gated on the same repository-derived `is_release` as docker_retag, not on release-please's
  # one-shot `release_created`, so that a re-run after a failed retag appends the section it never
  # got to write. That makes the step itself re-entrant, hence the marker check below.
  release_notes:
    name: Append image tags to the release
    runs-on: ubuntu-latest
    needs: [release_please, github_tag, docker_retag]
    if: needs.github_tag.outputs.is_release == 'true'
    permissions:
      contents: write
    env:
      REGISTRY: ghcr.io
      # From github_tag, which reads package.json: release-please only reports a version in the run
      # that created the release, and this job has to work on a re-run too. `include-v-in-tag` is
      # false for the application, so the tag and the version are the same string.
      VERSION: ${{ needs.github_tag.outputs.version }}
      TAG_NAME: ${{ needs.github_tag.outputs.version }}
      BUILD_TAG: ${{ needs.github_tag.outputs.build_tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      # Only .github/images.json is read here, and nothing in the checkout is executed.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/images.json
          sparse-checkout-cone-mode: false
      # `"${VERSION}"` and not `${{ env.VERSION }}`: an expression is pasted into the script text
      # before the shell starts, so the version string would be parsed as shell source. It reaches
      # here through a merged pull request, which is review-gated but not a trust boundary. Reading
      # it from the environment hands it over as data.
      - name: Append container image tags to the release notes
        run: |
          set -euo pipefail

          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          # Read the body back rather than keeping a copy of it: release-please owns that text, and
          # `gh release edit --notes-file` replaces the body wholesale, so the existing notes have
          # to be carried through the edit.
          gh release view "${TAG_NAME}" --json body --jq .body > notes.md

          # Re-entrant: this job runs again on a re-run of the release commit, and appending a
          # second copy of the section would be the visible result. Publishing still has to happen
          # below, so this only skips the append — a re-run of a job that failed AFTER appending
          # would otherwise leave the release a draft forever.
          if grep -qxF '## Container images' notes.md; then
            echo "release ${TAG_NAME} already lists its container images, nothing to append"
            exit 0
          fi

          # The images themselves are not attached as release assets: a release asset is not a
          # registry, so a `docker save` tarball could not be pulled, would share no layers with
          # any other version and would cost gigabytes per release. Pointing at the registry tags
          # is what makes a release actionable. Only the runtime images are listed — the `-base`
          # and `-build` stages carry the same tags but are consumed by downstream image builds,
          # not deployed.
          {
            echo
            echo '## Container images'
            echo
            echo "Published to \`${REGISTRY}\` and tagged \`${VERSION}\`, \`${MINOR}\`, \`${MAJOR}\`, \`latest\` and \`${BUILD_TAG}\` (this commit only)."
            echo
            echo '```bash'
            jq -r --arg registry "${REGISTRY}/${REPOSITORY}" --arg version "${VERSION}" \
              '.[] | select(.release) | "docker pull \($registry)/\(.name):\($version)"' \
              .github/images.json
            echo '```'
          } >> notes.md

          gh release edit "${TAG_NAME}" --notes-file notes.md

      # A SEPARATE step, so the early exit above cannot skip it: a re-run that finds the section
      # already appended must still publish, or a job that died between the append and the publish
      # would leave the release a draft for good.
      #
      # This is the moment the release becomes public. Until here it exists only as a draft, which
      # is what keeps a failed docker_retag from announcing a version whose images were never
      # tagged — the branded downstream repositories resolve their base images by exactly those
      # tags. The `<version>` git tag is NOT waiting on this: `force-tag-creation` in
      # root-config.json has release-please create the ref outright rather than letting it appear
      # as a side effect of publishing the release.
      #   --title  the release list holds the application's releases next to `ui: v0.0.4` and
      #            `branding: v0.2.1`, and an entry reading just `3.19.0` does not say what it is
      #            the version OF. release-please cannot produce this name: it only prefixes the
      #            component when `include-component-in-tag` is on, which would turn the tag into
      #            `ocelot-v3.19.0` — the one string the branded downstream repositories resolve
      #            their base images by. So the name is set here and the tag stays bare.
      #   --latest GitHub has no way to pin a release; the "Latest" badge is the mechanism, and by
      #            default it follows whichever release was published most recently. That is a
      #            package release most of the time, so the application — the thing anyone visiting
      #            this repository is looking for — gets buried. Claiming it explicitly here, and
      #            declining it in the package workflows, keeps the badge on ocelot.social itself.
      # Block scalar, not a plain one: the title contains `: `, which ends a plain YAML scalar and
      # makes the whole workflow unparseable.
      - name: Publish the release
        run: |
          gh release edit "${TAG_NAME}" --title "ocelot: v${VERSION}" --latest --draft=false

  build_trigger:
    name: Trigger successful build
    runs-on: ubuntu-latest
    # Depends on the retag rather than on the tag: the downstream deployments resolve images from
    # this registry, so the tags have to exist before they are told to go. github_tag is listed as
    # well because a job's outputs are only readable through `needs`.
    needs: [github_tag, docker_retag]
    # GITHUB_TOKEN is unused here: both dispatches authenticate with OCELOT_PUBLISH_EVENT_PAT, and
    # since the payload no longer comes from package.json there is not even a checkout left to grant
    # `contents: read` for. Stated explicitly so that adding a step which does need a scope has to
    # say so — see the commented-out dispatch below, which would need `contents: write`.
    permissions: {}
    steps:
      # The payload used to be assembled inline in each dispatch as `"VERSION": "${VERSION}"`. That
      # is shell syntax in a `with:` string, which Actions does not expand — the stage repositories
      # received the four-character literal `${VERSION}` and an empty GITHUB_RUN_NUMBER, since
      # runner defaults like GITHUB_RUN_NUMBER are not part of the `env` context either. Building it
      # once with jq fixes both, keeps the two dispatches from drifting apart, and quotes the values
      # properly instead of relying on them never containing a `"`.
      #
      # No checkout and no Node any more: the only reason for either was reading the version out of
      # package.json, which github_tag already publishes as an output.
      - name: Compose dispatch payload
        id: payload
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ needs.github_tag.outputs.version }}
          BUILD_TAG: ${{ needs.github_tag.outputs.build_tag }}
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -cn \
            --arg ref "${REF}" \
            --arg sha "${SHA}" \
            --arg run_number "${RUN_NUMBER}" \
            --arg version "${VERSION}" \
            --arg build_tag "${BUILD_TAG}" \
            --arg build_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
               ref: $ref,
               sha: $sha,
               GITHUB_RUN_NUMBER: $run_number,
               VERSION: $version,
               BUILD_DATE: $build_date,
               BUILD_COMMIT: $sha,
               BUILD_VERSION: "\($version)-\($run_number)",
               BUILD_TAG: $build_tag
             }')"
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"
      # BUILD_TAG is the one key that is new: it names the immutable container image tag for this
      # commit, so a downstream deployment can pin it instead of resolving a moving `master`.
      #
      # Unlike the two dispatches below, this one uses GITHUB_TOKEN instead of the PAT. Reactivating
      # it therefore needs `permissions: contents: write` on this job — a repository dispatch is a
      # write operation, and the job runs read-only.
      #- name: Repository Dispatch
      #  uses: peter-evans/repository-dispatch@b7037b45472c64c96f5a28a8c8443a7d5a237848 # v3.0.0
      #  with:
      #    token: ${{ github.token }}
      #    event-type: trigger-ocelot-build-success
      #    repository: ${{ github.repository }}
      #    client-payload: ${{ steps.payload.outputs.payload }}

      - name: Repository Dispatch stage.ocelot.social
        uses: peter-evans/repository-dispatch@b7037b45472c64c96f5a28a8c8443a7d5a237848 # v3.0.0
        with:
          token: ${{ secrets.OCELOT_PUBLISH_EVENT_PAT }} # this token is required to access the other repository
          event-type: trigger-ocelot-build-success
          repository: 'Ocelot-Social-Community/stage.ocelot.social'
          client-payload: ${{ steps.payload.outputs.payload }}

      - name: Repository Dispatch stage.yunite.me
        uses: peter-evans/repository-dispatch@b7037b45472c64c96f5a28a8c8443a7d5a237848 # v3.0.0
        with:
          token: ${{ secrets.OCELOT_PUBLISH_EVENT_PAT }} # this token is required to access the other repository
          event-type: trigger-ocelot-build-success
          repository: 'Yunite-Net/stage.yunite.me'
          client-payload: ${{ steps.payload.outputs.payload }}
