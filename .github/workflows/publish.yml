name: publish

on:
  push:
    branches:
      - master

# One run at a time, and never drop one. `cancel-in-progress: false` alone does NOT achieve that:
# the default `queue: single` holds exactly ONE pending run, and the next arrival cancels it. This
# workflow tags a version, cuts a GitHub release and dispatches the downstream deploys — a dropped
# pending run means one master commit silently never gets tagged or shipped. `queue: max` keeps a
# real backlog instead (up to 100 runs, processed in order). The two settings are coupled: pairing
# `queue: max` with cancelling is a workflow validation error.
# The group matches the CI workflows here (pull request number, falling back to `github.ref`); this
# one only triggers on push, so it always resolves to refs/heads/master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

# Read-only floor, so no job silently inherits the repository or organisation default. Write is
# granted per job, to the ONE that needs it — see github_tag below, which creates the git tag and
# the GitHub release with GITHUB_TOKEN. The repository dispatches in build_trigger authenticate
# with OCELOT_PUBLISH_EVENT_PAT rather than GITHUB_TOKEN, so that job needs no scope at all.
permissions:
  contents: read

jobs:
  ##############################################################################
  # JOB: GITHUB TAG LATEST VERSION #############################################
  ##############################################################################
  github_tag:
    name: Tag latest version on Github
    runs-on: ubuntu-latest
    # The only job that writes: it creates the git tag and the GitHub release with GITHUB_TOKEN.
    # `build_trigger` below deliberately does not inherit this — its repository dispatches
    # authenticate with OCELOT_PUBLISH_EVENT_PAT, so reading the checkout is all it needs.
    permissions:
      contents: write
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full History for changelog
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - name: Setup env
        run: |
          echo "VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
      - run: echo "BUILD_VERSION=${VERSION}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
      - name: package-version-to-git-tag + build number
        uses: pkgdeps/git-tag-action@ef111413f44ebe5cc05994e7f5b5b9edaaada08d # v3.0.0
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ env.BUILD_VERSION }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "b"
      - name: Generate changelog
        run: |
          yarn install
          yarn auto-changelog --latest-version ${{ env.VERSION }} --unreleased-only
      - name: package-version-to-git-release
        continue-on-error: true # Will fail if tag exists
        id: create_release
        uses: actions/create-release@4c11c9fe1dcd9636620a16455165783b20fc7ea0 # v1.1.4
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }} # This token is provided by Actions, you do not need to create your own token
        with:
          tag_name: ${{ env.VERSION }}
          release_name: ${{ env.VERSION }}
          body_path: ./CHANGELOG.md
          draft: false
          prerelease: false

  build_trigger:
    name: Trigger successful build
    runs-on: ubuntu-latest
    needs: [github_tag]
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full History for changelog
      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: '.nvmrc'
      - name: Setup env
        run: |
          echo "VERSION=$(node -p -e "require('./package.json').version")" >> $GITHUB_ENV
          echo "BUILD_DATE=$(date -u +'%Y-%m-%dT%H:%M:%SZ')" >> $GITHUB_ENV
          echo "BUILD_COMMIT=${GITHUB_SHA}" >> $GITHUB_ENV
      - run: echo "BUILD_VERSION=${VERSION}-${GITHUB_RUN_NUMBER}" >> $GITHUB_ENV
      # Unlike the two dispatches below, this one uses GITHUB_TOKEN instead of the PAT. Reactivating
      # it therefore needs `permissions: contents: write` on this job — a repository dispatch is a
      # write operation, and the job runs read-only.
      #- name: Repository Dispatch
      #  uses: peter-evans/repository-dispatch@831550845b9842397c9b90c366a610d53f2b846b # v3.0.0
      #  with:
      #    token: ${{ github.token }}
      #    event-type: trigger-ocelot-build-success
      #    repository: ${{ github.repository }}
      #    client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "VERSION": "${VERSION}", "BUILD_DATE": "${BUILD_DATE}", "BUILD_COMMIT": "${BUILD_COMMIT}", "BUILD_VERSION": "${BUILD_VERSION}"}'

      - name: Repository Dispatch stage.ocelot.social
        uses: peter-evans/repository-dispatch@831550845b9842397c9b90c366a610d53f2b846b # v3.0.0
        with:
          token: ${{ secrets.OCELOT_PUBLISH_EVENT_PAT }} # this token is required to access the other repository
          event-type: trigger-ocelot-build-success
          repository: 'Ocelot-Social-Community/stage.ocelot.social'
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "GITHUB_RUN_NUMBER": "${{ env.GITHUB_RUN_NUMBER }}", "VERSION": "${VERSION}", "BUILD_DATE": "${BUILD_DATE}", "BUILD_COMMIT": "${BUILD_COMMIT}", "BUILD_VERSION": "${BUILD_VERSION}"}'
      
      - name: Repository Dispatch stage.yunite.me
        uses: peter-evans/repository-dispatch@831550845b9842397c9b90c366a610d53f2b846b # v3.0.0
        with:
          token: ${{ secrets.OCELOT_PUBLISH_EVENT_PAT }} # this token is required to access the other repository
          event-type: trigger-ocelot-build-success
          repository: 'Yunite-Net/stage.yunite.me'
          client-payload: '{"ref": "${{ github.ref }}", "sha": "${{ github.sha }}", "GITHUB_RUN_NUMBER": "${{ env.GITHUB_RUN_NUMBER }}", "VERSION": "${VERSION}", "BUILD_DATE": "${BUILD_DATE}", "BUILD_COMMIT": "${BUILD_COMMIT}", "BUILD_VERSION": "${BUILD_VERSION}"}'
