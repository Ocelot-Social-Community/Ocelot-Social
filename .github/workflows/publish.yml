name: publish

on:
  push:
    branches:
      - master

# One run at a time, and never drop one. `cancel-in-progress: false` alone does NOT achieve that:
# the default `queue: single` holds exactly ONE pending run, and the next arrival cancels it. This
# workflow tags a version, cuts a GitHub release and dispatches the downstream deploys — a dropped
# pending run means one master commit silently never gets tagged or shipped. `queue: max` keeps a
# real backlog instead (up to 100 runs, processed in order). The two settings are coupled: pairing
# `queue: max` with cancelling is a workflow validation error.
# The group matches the CI workflows here (pull request number, falling back to `github.ref`); this
# one only triggers on push, so it always resolves to refs/heads/master.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
  queue: max

# Read-only floor, so no job silently inherits the repository or organisation default. Write is
# granted per job, to the ones that need it: `contents: write` for github_tag and github_release,
# which create the git tags and the GitHub release with GITHUB_TOKEN, and `packages: write` for
# docker_retag, which pushes the version tags to the registry. The repository dispatches in
# build_trigger authenticate with OCELOT_PUBLISH_EVENT_PAT rather than GITHUB_TOKEN, so that job
# needs no scope at all and says so with `permissions: {}`.
permissions:
  contents: read

jobs:
  ##############################################################################
  # JOB: GITHUB TAG LATEST VERSION #############################################
  ##############################################################################
  github_tag:
    name: Tag latest version on Github
    runs-on: ubuntu-latest
    # Writes the per-commit build tag with GITHUB_TOKEN. `github_release` below needs the same
    # scope for the release itself; `docker_retag` needs `packages: write` instead, and
    # `build_trigger` needs nothing at all — its repository dispatches authenticate with
    # OCELOT_PUBLISH_EVENT_PAT. Each job states its own, none inherits more than it uses.
    permissions:
      contents: write
    outputs:
      version: ${{ steps.version.outputs.version }}
      build_tag: ${{ steps.version.outputs.build_tag }}
      is_release: ${{ steps.version.outputs.is_release }}
    steps:
      - name: Checkout code
        # actions/checkout leaves GITHUB_TOKEN in the workspace's .git/config unless told not to,
        # and no step in this workflow runs an authenticated git operation: git-tag-action below
        # reaches the API through `github.getOctokit(github_token)`, and auto-changelog in
        # github_release only reads local state (`git config --get`, `git tag -l`, `git log`).
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full History for changelog
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      - name: Setup env
        id: version
        run: |
          set -euo pipefail
          VERSION="$(node -p -e "require('./package.json').version")"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          # Matches what git-tag-action produces below: the `b` prefix plus version and build
          # number. Downstream consumers get one immutable identifier that names both the git tag
          # and the container image tag for this exact commit.
          echo "build_tag=b${VERSION}-${GITHUB_RUN_NUMBER}" >> "$GITHUB_OUTPUT"
          # Every master push runs this workflow, but only the release commit bumps the version in
          # package.json. The version tag is created by the release job below and nowhere else, so
          # its absence identifies the first commit carrying this version — the release commit.
          # Without this distinction the retag job would move `3.18.4` onto every later master
          # commit, which is the mutability the version tags exist to avoid.
          if git rev-parse -q --verify "refs/tags/${VERSION}" > /dev/null; then
            echo "is_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "is_release=true" >> "$GITHUB_OUTPUT"
          fi
      - name: package-version-to-git-tag + build number
        uses: pkgdeps/git-tag-action@a5a161774bace8b4e1969dd850c67a7421f1b710 # v3.0.1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          github_repo: ${{ github.repository }}
          version: ${{ steps.version.outputs.version }}-${{ github.run_number }}
          git_commit_sha: ${{ github.sha }}
          git_tag_prefix: "b"

  ##############################################################################
  # JOB: TAG THE CONTAINER IMAGES ##############################################
  ##############################################################################
  # `docker-push` builds and pushes every image under `sha-<40 hex>` on the same push that starts
  # this workflow. Copying those manifests onto the version tags is preferred over rebuilding: it
  # takes seconds instead of a full matrix build, and it guarantees the released image is bit for
  # bit the artefact CI tested, which a rebuild cannot promise.
  docker_retag:
    name: Tag container images
    runs-on: ubuntu-latest
    needs: [github_tag]
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      VERSION: ${{ needs.github_tag.outputs.version }}
      BUILD_TAG: ${{ needs.github_tag.outputs.build_tag }}
      IS_RELEASE: ${{ needs.github_tag.outputs.is_release }}
      # `docker-push` and this workflow are triggered by the same push and run concurrently, with
      # no way to express a dependency across workflows. Waiting for the source manifest to appear
      # is that dependency. The budget covers a cold cache on the slowest image; exceeding it is a
      # real failure (a broken or skipped build), not something to paper over with a fallback tag.
      WAIT_SECONDS: 2400
      POLL_SECONDS: 20
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Copy sha-tagged manifests onto the version tags
        run: |
          set -euo pipefail

          # GITHUB_REPOSITORY and GITHUB_SHA rather than the matching Actions expressions: an
          # expression is substituted into the script text, the runner defaults arrive as data. Same
          # reason as in the changelog step of github_release, applied uniformly so the rule does
          # not read as if these two were exceptions.
          #
          # GITHUB_REPOSITORY keeps the owner's capitalisation, registry paths are lowercase only.
          # docker/metadata-action does this downcasing for the build; here it is done by hand.
          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          SOURCE_TAG="sha-${GITHUB_SHA}"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"
          DEADLINE=$(( $(date +%s) + WAIT_SECONDS ))

          for APP in $(jq -r '.[].name' .github/images.json); do
            IMAGE="${REGISTRY}/${REPOSITORY}/${APP}"

            until docker buildx imagetools inspect "${IMAGE}:${SOURCE_TAG}" > /dev/null 2>&1; do
              if [ "$(date +%s)" -ge "${DEADLINE}" ]; then
                echo "::error::${IMAGE}:${SOURCE_TAG} never appeared — check the docker-push run for ${GITHUB_SHA}"
                exit 1
              fi
              echo "waiting for ${IMAGE}:${SOURCE_TAG}"
              sleep "${POLL_SECONDS}"
            done

            # The build tag is unique per commit and therefore always safe to apply. The version
            # tags are only moved on the release commit — see is_release above.
            TAGS=(--tag "${IMAGE}:${BUILD_TAG}")
            if [ "${IS_RELEASE}" = 'true' ]; then
              TAGS+=(--tag "${IMAGE}:${VERSION}" --tag "${IMAGE}:${MINOR}" --tag "${IMAGE}:${MAJOR}")
            fi

            echo "tagging ${IMAGE}: ${TAGS[*]//--tag /}"
            docker buildx imagetools create "${TAGS[@]}" "${IMAGE}:${SOURCE_TAG}"
          done

  ##############################################################################
  # JOB: CUT THE GITHUB RELEASE ################################################
  ##############################################################################
  # Runs after docker_retag so the image tags quoted in the release notes exist by the time anyone
  # can read them.
  github_release:
    name: Create Github release
    runs-on: ubuntu-latest
    needs: [github_tag, docker_retag]
    if: needs.github_tag.outputs.is_release == 'true'
    permissions:
      contents: write
    env:
      REGISTRY: ghcr.io
      VERSION: ${{ needs.github_tag.outputs.version }}
      BUILD_TAG: ${{ needs.github_tag.outputs.build_tag }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # Fetch full History for changelog
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'
      # `"${VERSION}"` and not `${{ env.VERSION }}`: an expression is pasted into the script text
      # before the shell starts, so the version string from package.json would be parsed as shell
      # source. It reaches here through a merged pull request, which is review-gated but not a
      # trust boundary. Reading it from the environment hands it over as data.
      - name: Generate changelog
        run: |
          yarn install
          yarn auto-changelog --latest-version "${VERSION}" --unreleased-only
      - name: Compose release notes
        run: |
          set -euo pipefail

          REPOSITORY="$(echo "${GITHUB_REPOSITORY}" | tr '[:upper:]' '[:lower:]')"
          MAJOR="${VERSION%%.*}"
          MINOR="${VERSION%.*}"

          # The images themselves are not attached as release assets: a release asset is not a
          # registry, so a `docker save` tarball could not be pulled, would share no layers with
          # any other version and would cost gigabytes per release. Pointing at the registry tags
          # is what makes a release actionable. Only the runtime images are listed — the `-base`
          # and `-build` stages carry the same tags but are consumed by downstream image builds,
          # not deployed.
          {
            echo
            echo '## Container images'
            echo
            echo "Published to \`${REGISTRY}\` and tagged \`${VERSION}\`, \`${MINOR}\`, \`${MAJOR}\` and \`${BUILD_TAG}\` (this commit only)."
            echo
            echo '```bash'
            jq -r --arg registry "${REGISTRY}/${REPOSITORY}" --arg version "${VERSION}" \
              '.[] | select(.release) | "docker pull \($registry)/\(.name):\($version)"' \
              .github/images.json
            echo '```'
          } >> CHANGELOG.md
      - name: package-version-to-git-release
        uses: softprops/action-gh-release@3d0d9888cb7fd7b750713d6e236d1fcb99157228 # v3.0.2
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          tag_name: ${{ env.VERSION }}
          name: ${{ env.VERSION }}
          body_path: ./CHANGELOG.md
          draft: false
          prerelease: false

  build_trigger:
    name: Trigger successful build
    runs-on: ubuntu-latest
    # Depends on the retag rather than on the tag: the downstream deployments resolve images from
    # this registry, so the tags have to exist before they are told to go. github_tag is listed as
    # well because a job's outputs are only readable through `needs`.
    needs: [github_tag, docker_retag]
    # GITHUB_TOKEN is unused here: both dispatches authenticate with OCELOT_PUBLISH_EVENT_PAT, and
    # since the payload no longer comes from package.json there is not even a checkout left to grant
    # `contents: read` for. Stated explicitly so that adding a step which does need a scope has to
    # say so — see the commented-out dispatch below, which would need `contents: write`.
    permissions: {}
    steps:
      # The payload used to be assembled inline in each dispatch as `"VERSION": "${VERSION}"`. That
      # is shell syntax in a `with:` string, which Actions does not expand — the stage repositories
      # received the four-character literal `${VERSION}` and an empty GITHUB_RUN_NUMBER, since
      # runner defaults like GITHUB_RUN_NUMBER are not part of the `env` context either. Building it
      # once with jq fixes both, keeps the two dispatches from drifting apart, and quotes the values
      # properly instead of relying on them never containing a `"`.
      #
      # No checkout and no Node any more: the only reason for either was reading the version out of
      # package.json, which github_tag already publishes as an output.
      - name: Compose dispatch payload
        id: payload
        env:
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          VERSION: ${{ needs.github_tag.outputs.version }}
          BUILD_TAG: ${{ needs.github_tag.outputs.build_tag }}
        run: |
          set -euo pipefail
          PAYLOAD="$(jq -cn \
            --arg ref "${REF}" \
            --arg sha "${SHA}" \
            --arg run_number "${RUN_NUMBER}" \
            --arg version "${VERSION}" \
            --arg build_tag "${BUILD_TAG}" \
            --arg build_date "$(date -u +'%Y-%m-%dT%H:%M:%SZ')" \
            '{
               ref: $ref,
               sha: $sha,
               GITHUB_RUN_NUMBER: $run_number,
               VERSION: $version,
               BUILD_DATE: $build_date,
               BUILD_COMMIT: $sha,
               BUILD_VERSION: "\($version)-\($run_number)",
               BUILD_TAG: $build_tag
             }')"
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"
      # BUILD_TAG is the one key that is new: it names the immutable container image tag for this
      # commit, so a downstream deployment can pin it instead of resolving a moving `master`.
      #
      # Unlike the two dispatches below, this one uses GITHUB_TOKEN instead of the PAT. Reactivating
      # it therefore needs `permissions: contents: write` on this job — a repository dispatch is a
      # write operation, and the job runs read-only.
      #- name: Repository Dispatch
      #  uses: peter-evans/repository-dispatch@73ca9d9f4f806f6470bf0a2c4245a7d14df16b37 # v3.0.0
      #  with:
      #    token: ${{ github.token }}
      #    event-type: trigger-ocelot-build-success
      #    repository: ${{ github.repository }}
      #    client-payload: ${{ steps.payload.outputs.payload }}

      - name: Repository Dispatch stage.ocelot.social
        uses: peter-evans/repository-dispatch@73ca9d9f4f806f6470bf0a2c4245a7d14df16b37 # v3.0.0
        with:
          token: ${{ secrets.OCELOT_PUBLISH_EVENT_PAT }} # this token is required to access the other repository
          event-type: trigger-ocelot-build-success
          repository: 'Ocelot-Social-Community/stage.ocelot.social'
          client-payload: ${{ steps.payload.outputs.payload }}

      - name: Repository Dispatch stage.yunite.me
        uses: peter-evans/repository-dispatch@73ca9d9f4f806f6470bf0a2c4245a7d14df16b37 # v3.0.0
        with:
          token: ${{ secrets.OCELOT_PUBLISH_EVENT_PAT }} # this token is required to access the other repository
          event-type: trigger-ocelot-build-success
          repository: 'Yunite-Net/stage.yunite.me'
          client-payload: ${{ steps.payload.outputs.payload }}
