name: docker-push

on: push

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build-and-push-images:
    strategy:
      matrix:
        app:
          - name: neo4j
            context: neo4j
            file: neo4j/Dockerfile
            target: community
          - name: backend-base
            context: .
            file: backend/Dockerfile
            target: base
          - name: backend-build
            context: .
            file: backend/Dockerfile
            target: build
          - name: backend
            context: .
            file: backend/Dockerfile
            target: production
          - name: webapp-base
            context: .
            file: webapp/Dockerfile
            target: base
          - name: webapp-build
            context: .
            file: webapp/Dockerfile
            target: build
          - name: webapp
            context: .
            file: webapp/Dockerfile
            target: production
          - name: maintenance-base
            context: .
            file: maintenance/Dockerfile
            target: production
          - name: maintenance-build
            context: .
            file: maintenance/Dockerfile
            target: build
          - name: maintenance
            context: .
            file: maintenance/Dockerfile
            target: production
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0
      - name: Log in to the Container registry
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=branch
            type=ref,event=pr
            type=sha
      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: ${{ matrix.app.context }}
          target:  ${{ matrix.app.target }}
          file:  ${{ matrix.app.file }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=${{ matrix.app.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.app.name }}
