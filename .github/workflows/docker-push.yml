name: docker-push

on:
  # Every branch and every tag, as a bare `on: push` gave — except the merge queue's temporary
  # branch. Creating it raises a push event too, and the `merge_group` run below already covers it;
  # without the exclusion every queue entry would run this workflow twice. `tags` has to be spelled
  # out because naming `branches-ignore` alone would stop the workflow from running for tags.
  push:
    branches-ignore:
      - 'gh-readonly-queue/**'
    tags:
      - '**'
  # The merge queue runs the required checks on its temporary gh-readonly-queue/master/* branch.
  merge_group:

# master builds EVERY commit, one after the other, in order: its images are the release artefacts.
# The `publish` workflow retags them by commit sha (`sha-<40 hex>` below) into the version tags, so
# a master commit without its images leaves a `publish` run that waits for them in vain — and, as
# `publish` queues its runs, holds up every run behind it for its whole wait. Every commit's images
# also make each state of master deployable on its own, to test or bisect. (The moving `master` tag
# does not rely on that order — see the last step of the build job.)
#
# `cancel-in-progress: false` alone did NOT achieve that: the default `queue: single` holds exactly
# ONE pending run, and the next arrival cancels it. A Dependabot wave merging ten pull requests
# within seconds therefore built the first and the last commit only — the eight in between never
# got images, and their `publish` runs failed one by one, 40 minutes each. `queue: max` keeps a real
# backlog instead (up to 100 runs, processed in order).
#
# `queue` takes no expression, and `queue: max` with cancelling is a workflow validation error, so
# branches cannot keep the old cancelling in this block. They get their own group per commit instead:
# a new push starts at once rather than waiting behind the previous one, and the `superseded` check
# in the first job ends a run whose branch has moved on before any image is built. What remains is a
# build that was already running when the next push came — it runs to its end.
#
# The merge queue's runs and tags are per commit anyway. `event_name` stays part of the group, so a
# push and a merge_group run of the same commit do not share one.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref == 'refs/heads/master' && github.ref || github.sha }}
  queue: max
  cancel-in-progress: false

# Workflow-wide floor for GITHUB_TOKEN, so no job silently inherits the repository or organisation
# default. A job that needs more overrides it locally — note that a job-level block REPLACES this one
# rather than adding to it, which is why the escalating job below re-states everything it needs.
permissions:
  contents: read

jobs:
  ##############################################################################
  # JOB: LOAD THE IMAGE DEFINITIONS ############################################
  ##############################################################################
  # The matrix lives in `.github/images.json` rather than inline here, because a second workflow
  # needs the same list: `publish` retags every one of these images with the release version. An
  # inline matrix would silently leave a newly added image untagged forever — the failure mode is
  # invisible, which is what makes it worth a job. `strategy.matrix` cannot read a file itself, so
  # one cheap job reads it and hands the parsed JSON to the matrix below.
  images:
    name: Load image definitions
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.load.outputs.matrix }}
      superseded: ${{ steps.superseded.outputs.superseded }}
    steps:
      # What cancelling did for branches before (see the concurrency block): a push whose branch has
      # moved on — or is gone — builds nothing. Its images would only be replaced by the newer push's,
      # and the pull request's checks are decided on its head commit anyway. With the free plan's
      # limited parallel jobs a run often waits for a runner, so by the time this runs a newer push
      # is common. Never for master (every commit counts there), tags or the merge queue.
      - name: Check whether the branch has moved on
        id: superseded
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/') && github.ref != 'refs/heads/master'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only a confirmed 404 means the branch is gone. Any other API error fails the step: read as
          # "gone" it would skip the build of a commit that is still the branch's head.
          if ! head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha 2> "${RUNNER_TEMP}/api-error.txt")"; then
            if grep -q 'HTTP 404' "${RUNNER_TEMP}/api-error.txt"; then
              head=''
            else
              cat "${RUNNER_TEMP}/api-error.txt" >&2
              exit 1
            fi
          fi
          if [ "${head}" = "${GITHUB_SHA}" ]; then
            echo "superseded=false" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::${GITHUB_REF_NAME} is at ${head:-nothing} now, not ${GITHUB_SHA} — not building superseded images"
            echo "superseded=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Checkout repository
        # actions/checkout leaves GITHUB_TOKEN in the workspace's .git/config unless told not to.
        # No job in this workflow runs an authenticated git operation, so there is nothing to keep
        # it for. The build context below excludes .git through .dockerignore and the token would
        # therefore not reach an image layer either way — not persisting it is the cheaper of the
        # two guarantees, and it does not depend on .dockerignore staying correct.
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Load image definitions
        id: load
        run: echo "matrix=$(jq -c . .github/images.json)" >> "$GITHUB_OUTPUT"

  ##############################################################################
  # JOB: BUILD AND PUSH THE IMAGES #############################################
  ##############################################################################
  build-and-push-images:
    # Named explicitly instead of letting GitHub derive it from the matrix entry: the derived name
    # interpolates every matrix key, so adding a field to images.json would rename all ten checks.
    name: build-and-push-images (${{ matrix.app.name }})
    needs: images
    if: needs.images.outputs.superseded != 'true'
    strategy:
      matrix:
        app: ${{ fromJSON(needs.images.outputs.matrix) }}
    runs-on: ubuntu-latest
    env:
      REGISTRY: ghcr.io
      IMAGE_NAME: ${{ github.repository }}/${{ matrix.app.name }}
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Log in to the Container registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # The `semver` rules only fire on a tag push. The version tags are created by the
          # `publish` workflow with GITHUB_TOKEN, and events raised by GITHUB_TOKEN do not trigger
          # workflows — so this workflow never sees them and the rules never match. They are kept
          # because they cost nothing and would do the right thing if a tag were ever pushed by a
          # human or an app token; the version tags that actually reach the registry are applied
          # by the retag job in `publish`, which copies the manifest of `sha-<40 hex>` below.
          #
          # No branch tag here: it MOVES, and the build is minutes long — by the time it pushes, a
          # newer commit of the branch may already have pushed its own. The step after the build sets
          # it, checked right before writing.
          #
          # `type=sha` is listed twice on purpose: the short form is what a human reads in the
          # registry UI, the long form is what a deployment references. Helm charts get the full
          # commit sha from the dispatch payload, not an abbreviated one, and abbreviating it in
          # the chart is not something a template can do.
          tags: |
            type=schedule
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=ref,event=pr
            type=sha
            type=sha,format=long
      - name: Build and push Docker images
        id: push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ${{ matrix.app.context }}
          target:  ${{ matrix.app.target }}
          file:  ${{ matrix.app.file }}
          # A merge group is built but not pushed. The build is the required check; the images
          # themselves would be redundant, because the queue's fast-forward is a regular push to
          # master and that run builds and pushes the very same commit. Pushing here would only
          # leave a branch tag for the queue's temporary branch and, for every group that fails or
          # is dropped from the queue, sha-tagged images of a commit that never reaches master.
          push: ${{ github.event_name != 'merge_group' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # One cache scope per DOCKERFILE, not per image, and only one image per scope writes it.
          #
          # `mode=max` exports every stage a build touched. The three images built from one Dockerfile
          # are nested — for backend, `production` is `FROM base` plus a COPY out of `production_build`
          # (`FROM build`), so building it involves base, base-build, build and production_build. Its
          # cache therefore already CONTAINS everything the `base` and `build` images would export;
          # writing all three meant storing the same layers under three keys. A cache key of a step in
          # `base` does not depend on which target the build was aiming for, so the two readers hit the
          # writer's entries exactly as they hit their own before.
          #
          # Letting all three WRITE one shared scope would not work: Actions cache keys are immutable,
          # the three matrix jobs run concurrently, and the losers fail with "cache already exists"
          # after mixing up the index. Hence `cacheTo` on the one target that subsumes the others —
          # see .github/images.json, which also documents which target that is per Dockerfile.
          #
          # `ignore-error=true` because the export runs as part of the same solve as the push and
          # defaults to being fatal: a throttled or briefly unavailable Actions cache service would
          # turn a run whose images are ALREADY IN THE REGISTRY into a red one. On master that is
          # not just noise — `publish` waits for this workflow to succeed before it retags those
          # images into the version tags, so a cache hiccup would hold up a release. A failed export
          # only costs the next build its cache hits, which is the cheaper failure by a wide margin.
          cache-from: type=gha,scope=${{ matrix.app.cacheScope }}
          cache-to: ${{ matrix.app.cacheTo && format('type=gha,mode=max,ignore-error=true,scope={0}', matrix.app.cacheScope) || '' }}

      # The moving branch tag (`master`, or the branch's name), written only by the build of the
      # commit that is the branch's head RIGHT NOW. master queues its runs in the order they entered
      # the queue, which is not guaranteed to be push order; branches run their commits side by side.
      # Either way an older build can finish last, and if it wrote the tag with its push, the tag
      # would point back at older images. Checked here, seconds before writing, instead of before the
      # build; the `sha-` tags are pushed by every build regardless.
      - name: Branch tag for this branch's newest commit
        id: branchtag
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/heads/')
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: type=ref,event=branch
      - name: Point the branch tag at this build
        if: steps.branchtag.outcome == 'success'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_TAG: ${{ steps.branchtag.outputs.tags }}
          SOURCE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:sha-${{ github.sha }}
        run: |
          # Only a confirmed 404 (branch deleted meanwhile) is a reason to skip quietly.
          if ! head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${GITHUB_REF_NAME}" --jq .object.sha 2> "${RUNNER_TEMP}/api-error.txt")"; then
            if grep -q 'HTTP 404' "${RUNNER_TEMP}/api-error.txt"; then
              echo "::notice::${GITHUB_REF_NAME} is gone — no branch tag"
              exit 0
            fi
            cat "${RUNNER_TEMP}/api-error.txt" >&2
            exit 1
          fi
          if [ "${head}" != "${GITHUB_SHA}" ]; then
            echo "::notice::${GITHUB_REF_NAME} is at ${head} now — ${GITHUB_SHA} keeps its sha tags, the branch tag stays with the newer build"
            exit 0
          fi
          # Registry paths are lowercase; metadata-action lowercased BRANCH_TAG already.
          docker buildx imagetools create --tag "${BRANCH_TAG}" "$(echo "${SOURCE}" | tr '[:upper:]' '[:lower:]')"
