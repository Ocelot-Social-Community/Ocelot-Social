name: ocelot.social GraphQL API docs

# Builds the static GraphQL API reference (SpectaQL) from the backend schema and
# uploads it as a build artifact. Hosting is intentionally out of scope for now —
# download the artifact from the workflow run to view docs/index.html.

on: push

jobs:
  files-changed:
    name: Detect File Changes - Backend
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.changes.outputs.backend }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for backend file changes
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
          list-files: shell

  build-api-docs:
    name: Build GraphQL API docs
    needs: files-changed
    if: needs.files-changed.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: 'backend/.nvmrc'
          cache: 'yarn'
          cache-dependency-path: 'backend/yarn.lock'

      - name: backend | Build API docs
        run: cd backend && yarn --frozen-lockfile && yarn run docs:api

      - name: Upload API docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: graphql-api-docs
          path: backend/public-docs/
          retention-days: 30
