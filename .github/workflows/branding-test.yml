name: Branding Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# Least privilege. pull-requests:read is required by dorny/paths-filter, which lists a PR's changed
# files via the API (the fetch-depth:1 checkout has no base history for a local diff).
# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

defaults:
  run:
    working-directory: packages/branding

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      branding: ${{ steps.changes.outputs.branding }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  test:
    name: Unit Tests (node --test, coverage-gated)
    if: needs.files-changed.outputs.branding == 'true'
    needs: files-changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: 'packages/branding/.tool-versions'
          cache: 'npm'
          cache-dependency-path: packages/branding/package-lock.json

      - name: Install dependencies
        run: npm ci

      # Builds the CJS dist, then runs the .mts tests via Node type-stripping with the coverage gate
      # (--test-coverage-lines/functions/branches). Requires Node >= 23 (see .tool-versions).
      - name: Run tests with coverage
        run: npm run test:coverage
