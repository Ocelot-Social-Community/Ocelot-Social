name: "review gate CI"

# Enforces that CodeRabbit has reviewed the *current* head commit of a pull request.
#
# Why this exists instead of requiring CodeRabbit's own check directly: CodeRabbit is a GitHub App,
# not a workflow. When it stays silent — bot authored pull requests, path filters swallowing a
# lockfile-only diff, paused incremental reviews — no status is ever reported and the required check
# hangs on "Expected — Waiting for status to be reported" forever.
#
# Why this job does not report the verdict through its OWN conclusion, which is the obvious design and
# was the previous one: GitHub identifies a workflow's check by `workflow / job (EVENT)`. A run started
# by `pull_request` and a run started by `pull_request_review` therefore write two DIFFERENT rows in
# the merge box, and a run can only ever overwrite its own. Combined with a cancelling concurrency
# group that produced a dead end:
#
#     review dismissed  -> pull_request_review run A starts
#     push              -> pull_request        run B starts, cancels A
#     CodeRabbit approve-> pull_request_review run C starts, cancels B
#
# every one of those events leaves the head commit untouched, so each cancelled run parks a permanently
# red row on the CURRENT commit — and no later CodeRabbit report can clear it, because a report arrives
# as a different event and thus writes a different row. Re-reviewing simply had no effect.
#
# So the verdict is published as a check run of our own, under the FIXED name in GATE_CHECK_NAME. Every
# trigger rewrites that one row, so the most recent evaluation always wins no matter which event caused
# it, and a cancelled run writes nothing at all and therefore cannot turn the gate red.
#
# ==> Make GATE_CHECK_NAME ("CodeRabbit Review Gate") the required status check, NOT this job.
# Until branch protection is switched over, the job conclusion still mirrors the verdict, so the old
# required check keeps gating instead of silently going green during the changeover.

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
      - converted_to_draft
  pull_request_review:
    types:
      - submitted
      - dismissed

# Cancelling is SAFE again, and now necessary. Safe, because the verdict no longer travels on the run's
# own conclusion: a cancelled run simply writes nothing and the published gate keeps its last state —
# that is the whole point of the indirection above. Necessary, because a poll can now run for hours
# (TIMEOUT_MINUTES below), and without cancelling a push during that wait would queue behind it instead
# of taking over. The newest run always wins and always publishes.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read
  checks: write

jobs:
  coderabbit-review:
    name: CodeRabbit Review
    # Deliberately NO job-level `if:`. Skipping counts as satisfied for branch protection only when the
    # required check IS this job — the published check run of a skipped job is never created at all,
    # which leaves branch protection waiting forever. Exemptions are decided in the script instead and
    # publish a passing check.
    runs-on: ubuntu-latest
    # Slightly above TIMEOUT_MINUTES so the script always reaches its own verdict and publishes it,
    # rather than being killed by the runner while the gate still says "in progress".
    timeout-minutes: 190
    env:
      # Login of the reviewing app and the slug it publishes its check run under.
      REVIEWER_LOGIN: "coderabbitai[bot]"
      REVIEWER_APP_SLUG: "coderabbitai"
      # The published check run. THIS is the name branch protection has to require.
      GATE_CHECK_NAME: "CodeRabbit Review Gate"
      # Base branches CodeRabbit watches (see `base_branches` in .coderabbit.yaml). Pull requests
      # targeting anything else are exempt, otherwise stacked pull requests could never go green.
      REVIEWED_BASE_BRANCHES: '["master", "main"]'
      # How long the gate stays PENDING before it gives up and calls it a failure. Sized after how long
      # CodeRabbit actually takes, which is hours under its rate limits — not after how long we would
      # like to wait. Too low is not a harmless default here: it flips a review that is merely slow into
      # a red required check.
      #
      # The wait is nearly free: this repository is public, so GitHub-hosted runner minutes are not
      # billed, and the poll only has to survive until CodeRabbit reports — a submitted review fires
      # `pull_request_review`, which supersedes this run within seconds. The long poll exists for the
      # one case that emits no event at all: CodeRabbit publishing only a check run because it had
      # nothing to say. On a private repository, lower this and lean on the review event.
      TIMEOUT_MINUTES: "180"
      # Deliberately slow. Latency is covered by the review event, so this only paces the fallback, and
      # each attempt costs three API calls against the 1000/hour GITHUB_TOKEN budget shared by every
      # workflow in the repository.
      POLL_INTERVAL_SECONDS: "120"
    steps:
      - name: Publish review gate status
        uses: actions/github-script@v8
        with:
          script: |
            const reviewerLogin = process.env.REVIEWER_LOGIN
            const reviewerAppSlug = process.env.REVIEWER_APP_SLUG
            const gateCheckName = process.env.GATE_CHECK_NAME
            const reviewedBaseBranches = JSON.parse(process.env.REVIEWED_BASE_BRANCHES)
            const pollIntervalMs = Number(process.env.POLL_INTERVAL_SECONDS) * 1000
            const deadline = Date.now() + Number(process.env.TIMEOUT_MINUTES) * 60 * 1000

            const { owner, repo } = context.repo
            const pullNumber = context.payload.pull_request.number

            const sleep = (ms) => new Promise((resolve) => setTimeout(resolve, ms))

            const readPullRequest = async () => {
              const { data } = await github.rest.pulls.get({ owner, repo, pull_number: pullNumber })
              return data
            }

            // The gate itself. Always written against the head commit as read in THIS moment, so a run
            // that started before a push still reports about what is actually on the branch now.
            //
            // `conclusion === null` means PENDING: the check run stays `in_progress`, which branch
            // protection treats as "not satisfied yet" and shows as a waiting check. That is the honest
            // state while CodeRabbit is merely slow — a `failure` there would paint a red cross on a
            // review that is going to arrive.
            //
            // One row per commit: an earlier run on the same commit may have left a check run behind
            // (cancelled mid-poll, so still `in_progress`), and creating a second one would leave the
            // merge box showing a stale pending entry next to the real verdict. So reuse the newest
            // existing row and update it; only create when there is none.
            let gateCheck = { sha: null, id: null }
            const publish = async (headSha, conclusion, title, summary) => {
              const status = conclusion ? 'completed' : 'in_progress'
              let publishError = null
              try {
                if (gateCheck.sha !== headSha) {
                  const { data } = await github.rest.checks.listForRef({
                    owner,
                    repo,
                    ref: headSha,
                    check_name: gateCheckName,
                    per_page: 100,
                  })
                  const newest = data.check_runs.sort((a, b) =>
                    String(b.started_at).localeCompare(String(a.started_at)),
                  )[0]
                  gateCheck = { sha: headSha, id: newest?.id ?? null }
                }

                if (gateCheck.id) {
                  await github.rest.checks.update({
                    owner,
                    repo,
                    check_run_id: gateCheck.id,
                    status,
                    ...(conclusion ? { conclusion } : {}),
                    output: { title, summary },
                  })
                } else {
                  const { data } = await github.rest.checks.create({
                    owner,
                    repo,
                    name: gateCheckName,
                    head_sha: headSha,
                    status,
                    ...(conclusion ? { conclusion } : {}),
                    output: { title, summary },
                  })
                  gateCheck.id = data.id
                }
                core.info(`Published "${gateCheckName}" = ${conclusion ?? status} on ${headSha}: ${title}`)
              } catch (error) {
                // Pull requests from a FORK get a read-only GITHUB_TOKEN regardless of `permissions:`,
                // so the gate cannot be published for them and branch protection would wait forever on
                // a check that never appears. The fix is switching the trigger to `pull_request_target`
                // (safe here — this workflow never checks out the head code).
                publishError = error
                core.error(
                  `Could not publish "${gateCheckName}" (HTTP ${error.status}). For a fork pull ` +
                    'request the token is read-only; the required check will never appear. See the ' +
                    'note in this workflow about pull_request_target.',
                )
              }
              await core.summary.addHeading(title, 3).addRaw(summary).write()
              // Rethrow only AFTER the summary is written, so the run still explains what it wanted to
              // report. Failing here is the point: an unpublished gate must never leave a green job
              // behind, or a broken gate looks exactly like a healthy one — the job would pass while
              // the required check silently stays "Expected". Failing fast also stops the poll, which
              // would otherwise burn TIMEOUT_MINUTES writing a verdict it cannot deliver.
              if (publishError) {
                throw new Error(
                  `Could not publish the required check "${gateCheckName}" on ${headSha} ` +
                    `(HTTP ${publishError.status}): ${publishError.message}`,
                )
              }
            }

            // Re-read the pull request on every attempt: a push during the wait moves the head and an
            // older review must not satisfy the gate.
            const findReview = async () => {
              const pullRequest = await readPullRequest()
              const headSha = pullRequest.head.sha

              const reviews = await github.paginate(github.rest.pulls.listReviews, {
                owner,
                repo,
                pull_number: pullNumber,
                per_page: 100,
              })
              // An allowlist, not `!== 'PENDING'`: that also let `DISMISSED` through, and a dismissed
              // review is a retracted one — dismissing CodeRabbit's approval to force a fresh look
              // would have left the gate green on the very evidence that was just withdrawn. Only
              // states that represent a submitted, still-standing review count. (`dismissed` is in the
              // `pull_request_review` triggers above, so the gate drops back to pending immediately.)
              const acceptedReviewStates = ['APPROVED', 'CHANGES_REQUESTED', 'COMMENTED']
              const review = reviews.find(
                (candidate) =>
                  candidate.user?.login === reviewerLogin &&
                  candidate.commit_id === headSha &&
                  acceptedReviewStates.includes(candidate.state),
              )
              if (review) {
                return { headSha, evidence: `review ${review.state} (${review.html_url})` }
              }

              // Second signal: CodeRabbit publishes a check run even when it has nothing to say in a
              // review (empty diff after path filters, for example).
              //
              // `completed` alone is NOT evidence — it only says the run ended. It also covers
              // `cancelled`, `timed_out`, `stale`, `skipped`, `failure` and `action_required`, and a
              // cancelled CodeRabbit run would turn the gate green on an unreviewed commit. Hence
              // `success` only. Nothing legitimate is lost by that: this branch exists solely for the
              // "reviewed, nothing to report" case, and whenever CodeRabbit *does* have something to
              // report it submits a review, which the first signal above already matches.
              const checkRuns = await github.paginate(github.rest.checks.listForRef, {
                owner,
                repo,
                ref: headSha,
                per_page: 100,
              })
              const checkRun = checkRuns.find(
                (candidate) =>
                  candidate.app?.slug === reviewerAppSlug &&
                  candidate.status === 'completed' &&
                  candidate.conclusion === 'success',
              )
              if (checkRun) {
                return { headSha, evidence: `check run "${checkRun.name}" (${checkRun.conclusion})` }
              }

              return { headSha, evidence: null }
            }

            const pullRequest = await readPullRequest()

            // Exemptions. Bots (dependabot, renovate, release bots) get a free pass because CodeRabbit
            // does not reliably review them; so do pull requests against a base CodeRabbit ignores.
            const exemption =
              pullRequest.user?.type === 'Bot'
                ? `author \`${pullRequest.user.login}\` is a bot — CodeRabbit does not reliably review those`
                : !reviewedBaseBranches.includes(pullRequest.base.ref)
                  ? `base branch \`${pullRequest.base.ref}\` is not one CodeRabbit watches`
                  : null

            if (exemption) {
              await publish(pullRequest.head.sha, 'success', 'Review not required', exemption)
              return
            }

            // Drafts fail rather than pass: passing would let a draft satisfy the gate. They are not
            // mergeable anyway, so red here is honest, not blocking.
            if (pullRequest.draft) {
              const message =
                'CodeRabbit does not review drafts (`drafts: false`). Mark the pull request ready for review.'
              await publish(pullRequest.head.sha, 'failure', 'Draft pull request', message)
              core.setFailed(message)
              return
            }

            let headSha
            let pendingSha = null
            for (;;) {
              const attempt = await findReview()
              headSha = attempt.headSha
              // Mark the gate PENDING before the first sleep, and again whenever a push moved the head
              // mid-wait: until this lands, the merge box would still show the verdict for the previous
              // state of the branch.
              if (!attempt.evidence && pendingSha !== headSha) {
                pendingSha = headSha
                await publish(
                  headSha,
                  null,
                  'Waiting for CodeRabbit review',
                  `Head commit \`${headSha}\` has not been reviewed yet. CodeRabbit can take hours ` +
                    'under its rate limits; this check goes green on its own once the review lands.',
                )
              }
              if (attempt.evidence) {
                await publish(
                  headSha,
                  'success',
                  'CodeRabbit review found',
                  `Head commit \`${headSha}\` — ${attempt.evidence}`,
                )
                return
              }

              const remainingMs = deadline - Date.now()
              if (remainingMs <= 0) break
              core.info(
                `No review by ${reviewerLogin} on ${headSha} yet, retrying in ` +
                  `${pollIntervalMs / 1000}s (${Math.ceil(remainingMs / 1000)}s left).`,
              )
              await sleep(Math.min(pollIntervalMs, remainingMs))
            }

            // Only NOW does this become a failure: the gate waited out the full TIMEOUT_MINUTES, so this
            // is no longer "slow" but "not coming without help".
            const message =
              `${reviewerLogin} has not reviewed head commit ${headSha} within ` +
              `${process.env.TIMEOUT_MINUTES} minutes. Comment "@coderabbitai review" on the pull ` +
              'request to trigger one — CodeRabbit pauses incremental reviews after several commits ' +
              '(auto_pause_after_reviewed_commits). This check turns green on its own as soon as the ' +
              'review lands; no re-run needed.'
            await publish(headSha, 'failure', 'CodeRabbit review missing', message)
            // Mirrored onto the job conclusion as well, so the gate keeps working while branch
            // protection still requires this job rather than the published check.
            core.setFailed(message)
