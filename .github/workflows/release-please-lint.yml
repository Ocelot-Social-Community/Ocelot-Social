name: Release Please Config Lint

# No `paths:` filter here, deliberately — the filtering happens on the `lint` job below instead.
#
# Where the filter sits is not a style question once the job is a REQUIRED status check, because
# Actions treats the two placements in opposite ways:
#
#   workflow-level `paths:` — a run that the filter turns away does not happen, so NO check run is
#                             ever reported. Branch protection cannot tell "never reported" from
#                             "still running": the check sits at "Expected — waiting for status to
#                             be reported" and the pull request can never be merged. Since the
#                             common pull request touches none of the bump targets, that blocked
#                             essentially everything.
#   job-level `if:`         — the workflow runs, the job is skipped, and a skipped job reports
#                             success. That is the behaviour a required check needs.
#
# So the workflow starts on every pull request and the job decides. The shape is the one
# branding-lint.yml and maintenance-lint.yml already use: `dorny/paths-filter` against the shared
# `.github/file-filters.yml`, where the path list lives under `release-please:` together with the
# reasoning for what belongs in it. As a side effect the list is written ONCE — that file is plain
# YAML and supports anchors, where the Actions workflow parser does not, which is why this workflow
# used to spell the same list out twice.
on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Nothing here writes. `contents: read` covers the checkout of public repository content;
# `pull-requests: read` is what dorny/paths-filter needs to list a pull request's changed files via
# the API, the fetch-depth:1 checkout having no base history for a local diff. Stated explicitly so
# the jobs cannot inherit a read-write repository or organisation default.
permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      release-please: ${{ steps.changes.outputs.release-please }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # `lint.mjs` resolves its way from the `if:` below to this step's `id`, to the filter file and
      # finally to the `release-please` rule inside it, and then checks that the rule still matches
      # every file the lint opens. Rewiring any link of that chain fails the lint loudly rather than
      # leaving the job gated on a list nobody maintains.
      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  lint:
    name: Lint release-please config
    needs: files-changed
    if: needs.files-changed.outputs.release-please == 'true'
    runs-on: ubuntu-latest
    steps:
      # Deliberately NOT a sparse checkout. The lint does not only read this directory: the lockstep
      # check opens every file the configs claim to bump — the package.json and package-lock.json of
      # the application, of backend, webapp and maintenance and of each package, plus both Helm
      # charts — and that list is defined by the configs, so no static `sparse-checkout` can stay
      # correct. An earlier version of this workflow checked out `.github` alone, and the lint then
      # reported every one of those files as missing.
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: '.nvmrc'

      # Before the lint, and without any dependency. Two units are tested here, both of them the
      # kind whose bugs are silent: `path-filter.mjs` reimplements GitHub's filter patterns, which
      # differ from any classic glob, and `workflow-gate.mjs` resolves the chain from a job's `if:`
      # to the filter rule that gates it. An approximately-right matcher or a half-resolved chain
      # would report the trigger list as complete while nothing actually starts a run. Node's
      # built-in runner picks up `*.test.mjs` only, so `lint.mjs` beside them is not executed here.
      - name: Test the lint's helper modules
        run: node --test .github/release-please/

      # Into a throwaway prefix, never into the repository. release-please is a release tool, not an
      # application dependency; adding it to the root package.json to satisfy a lint would put it
      # into the dependency tree of everything built from this repository.
      #
      # Exact versions, because the point of the check is to compare against a KNOWN schema. Bumping
      # release-please here is a deliberate act that may legitimately turn the lint red — that is
      # the signal that an option moved or was dropped, and it is better to see it here than in a
      # release run. Keep it in the same major as the release-please-action pinned in the release
      # workflows (v5.0.0 depends on `release-please@^17.6.0`); a newer patch only ever validates
      # more strictly than what the action bundles, which is the safe direction.
      #
      # `picomatch` is here for the opposite reason — it must match the version dorny/paths-filter
      # bundles (v4.0.3 depends on `picomatch@^2.3.1`), because the lint uses it to decide whether
      # the `release-please` filter rule covers a file. Any other matcher would answer a slightly
      # different question than the action does, and the disagreement would show up as a lint that
      # calls the rule complete while the job it gates never runs.
      - name: Install lint dependencies
        run: npm install --prefix "${RUNNER_TEMP}/rp-lint" --no-audit --no-fund --no-save ajv@8.20.0 ajv-formats@3.0.1 jsonpath-plus@10.3.0 yaml@2.9.1 picomatch@2.3.1 release-please@17.11.2

      - name: Lint release-please config
        run: node .github/release-please/lint.mjs
        env:
          RP_LINT_MODULES: ${{ runner.temp }}/rp-lint
