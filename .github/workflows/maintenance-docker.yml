name: Maintenance Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      maintenance: ${{ steps.changes.outputs.maintenance }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build:
    name: Build Docker Image
    if: needs.files-changed.outputs.maintenance == 'true'
    needs: files-changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build development image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./maintenance/Dockerfile
          target: development
          push: false
          tags: ocelot-social/maintenance:development
          cache-from: type=gha,scope=maintenance-development
          cache-to: type=gha,mode=max,scope=maintenance-development

      - name: Build production image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./maintenance/Dockerfile
          target: production
          push: false
          tags: ocelot-social/maintenance:latest
          cache-from: type=gha,scope=maintenance-production
          cache-to: type=gha,mode=max,scope=maintenance-production
