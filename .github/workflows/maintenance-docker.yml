name: Maintenance Docker

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
# Keyed by pull request NUMBER, not `head_ref`: head_ref is only the branch NAME, which is unique
# within this repository but not across forks — two contributors using GitHub's "edit this file"
# flow both get `patch-1`, and their pull requests would then cancel each other's runs. `github.ref`
# stays as the fallback for events that carry no pull request (a push gives refs/heads/<branch>).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

# Least privilege for GITHUB_TOKEN: without this block the jobs inherit whatever the repository or
# organisation default is, which may be read-write. Read-only is all this workflow does — the token
# is handed to dorny/paths-filter, which needs `pull-requests: read` to list a pull request's
# changed files.
permissions:
  contents: read
  pull-requests: read

jobs:
  files-changed:
    name: Detect File Changes
    runs-on: ubuntu-latest
    outputs:
      maintenance: ${{ steps.changes.outputs.maintenance }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check for file changes
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml

  build:
    name: Build Docker Image
    if: needs.files-changed.outputs.maintenance == 'true'
    needs: files-changed
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Build development image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./maintenance/Dockerfile
          target: development
          push: false
          tags: ocelot-social/maintenance:development
          cache-from: type=gha,scope=maintenance-development
          cache-to: type=gha,mode=max,scope=maintenance-development

      - name: Build production image
        uses: docker/build-push-action@bcafcacb16a39f128d818304e6c9c0c18556b85f # v7.1.0
        with:
          context: .
          file: ./maintenance/Dockerfile
          target: production
          push: false
          tags: ocelot-social/maintenance:latest
          cache-from: type=gha,scope=maintenance-production
          cache-to: type=gha,mode=max,scope=maintenance-production
