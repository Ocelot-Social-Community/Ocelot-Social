name: ocelot.social deploy documentation

on:
  push:
    branches:
      - master

# One run per workflow and branch. A newer push makes the older run's result irrelevant, so it is
# cancelled instead of holding a runner. Publishing runs are queued, not cancelled: a half-pushed release is worse than a slow one. `event_name` is part of the group on purpose: a branch
# push and its pull_request run are separate required checks — they must not cancel each other.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: false

jobs:
  files-changed:
    name: Detect File Changes - Markdown and Vuepress files
    runs-on: ubuntu-latest
    outputs:
      documentation: ${{ steps.changes.outputs.documentation }}
    steps:
      - name: Checkout code
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      - name: Check for file changes
        uses: dorny/paths-filter@7b450fff21473bca461d4b92ce414b9d0420d706 # v4.0.2
        id: changes
        with:
          token: ${{ github.token }}
          filters: .github/file-filters.yml
          list-files: shell

  build-and-deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2

      # The embedded API reference is generated with the backend toolchain, which
      # needs the backend's Node (metascraper requires >= 22, and tsx's require-hook
      # mis-resolves on Node 22.x — schema:print runs cleanly only on the backend's
      # Node 25). So generate it here on the backend's Node, into .vuepress/public/api.
      - name: Setup backend Node (for the GraphQL API reference)
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version-file: 'backend/.nvmrc'

      - name: Generate GraphQL API reference (SpectaQL)
        run: cd backend && yarn install --frozen-lockfile --ignore-scripts && cd .. && npm run docs:api

      # VuePress builds on Node 20; it just copies the already-generated
      # .vuepress/public/api into the site. Keep these as separate steps so each
      # tool runs on the Node version it supports.
      - name: Setup Node 20 (for VuePress)
        uses: actions/setup-node@6044e13b5dc448c55e2357c09f80417699197238 # v6.2.0
        with:
          node-version: 20

      - name: Build Vuepress Pages
        run: npm install && npm run docs:build

      - name: Deploy Vuepress to Github Pages
        uses: crazy-max/ghaction-github-pages@1d6ee9b181a81033a16bd707a1401afa978daab4 # v4.0.0
        with:
          target_branch: gh-pages
          build_dir: .vuepress/dist
          author: Wolfgang Huß <vorstand@busfaktor.org>
          fqdn: docs.ocelot.social
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
