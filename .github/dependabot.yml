# `rebase-strategy` is deliberately absent: the default is "auto", and every block here used to
# override it with "disabled". Auto-merge is what changed the calculation — a pull request that has
# fallen into conflict with master is never merged by anyone, and with rebasing off it just sits
# there until someone notices. Dependabot now resolves that itself.
#
# It is cheaper than it sounds. "auto" does NOT rebase on every push to master; it re-checks a pull
# request when the weekly schedule runs, when a closed one is reopened, when `target-branch` changes,
# or when a push to master puts the pull request in CONFLICT. Only the last one is event-driven, and
# only conflicting pull requests pay for it. Two limits worth knowing: Dependabot gives up rebasing a
# pull request 30 days after it was opened, and it stops rebasing any branch that has received
# commits of its own (unless the commit message carries `[dependabot skip]`).
version: 2
updates:
- package-ecosystem: "github-actions"
  open-pull-requests-limit: 99
  directory: "/"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
- package-ecosystem: npm
  open-pull-requests-limit: 99
  directory: "/"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
  groups:
    babel:
      applies-to: version-updates
      patterns:
        - "@babel*"
    cypress:
      applies-to: version-updates
      patterns:
        - "*cypress*"
        - "*cucumber*"
    vuepress:
      applies-to: version-updates
      patterns:
        - "*vuepress*"

# backend
- package-ecosystem: docker
  open-pull-requests-limit: 99
  directory: "/backend"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
- package-ecosystem: npm
  open-pull-requests-limit: 99
  directory: "/backend"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
  groups:
    apollo-server:
      applies-to: version-updates
      patterns:
        - "*apollo-server*"
    metascraper:
      applies-to: version-updates
      patterns:
        - "metascraper*"

# webapp
- package-ecosystem: docker
  open-pull-requests-limit: 99
  directory: "/webapp"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
- package-ecosystem: npm
  open-pull-requests-limit: 99
  directory: "/webapp"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
  groups:
    apollo:
      applies-to: version-updates
      patterns:
        - "apollo*"
    babel:
      applies-to: version-updates
      patterns:
        - "@babel*"
    jest:
      applies-to: version-updates
      patterns:
        - "jest*"
    mapbox:
      applies-to: version-updates
      patterns:
        - "*mapbox*"
    storybook:
      applies-to: version-updates
      patterns:
        - "*storybook*"
    vue:
      applies-to: version-updates
      patterns:
        - "@vue*"

- package-ecosystem: docker
  open-pull-requests-limit: 99
  directory: "/neo4j"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"

# documentation site — its npm dependencies ride on the root package.json above (see the `vuepress`
# group there); only the image it is served from needs its own entry.
- package-ecosystem: docker
  open-pull-requests-limit: 99
  directory: "/.vuepress"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"

# maintenance
- package-ecosystem: docker
  open-pull-requests-limit: 99
  directory: "/maintenance"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
- package-ecosystem: npm
  open-pull-requests-limit: 99
  directory: "/maintenance"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
  groups:
    nuxt:
      applies-to: version-updates
      patterns:
        - "nuxt*"
        - "@nuxt*"
        - "@nuxtjs*"
    vitest:
      applies-to: version-updates
      patterns:
        - "vitest*"
        - "@vitest*"
    tailwind:
      applies-to: version-updates
      patterns:
        - "tailwindcss*"
        - "@tailwindcss*"

# ui library
- package-ecosystem: docker
  open-pull-requests-limit: 99
  directory: "/packages/ui"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
- package-ecosystem: npm
  open-pull-requests-limit: 99
  directory: "/packages/ui"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"
  groups:
    # `@size-limit/*` pins its `size-limit` peer to an exact version, so a pull request that moves
    # only one of the two can never install — `npm ci` fails with ERESOLVE. They have to arrive
    # together.
    size-limit:
      applies-to: version-updates
      patterns:
        - "size-limit"
        - "@size-limit/*"
    storybook:
      applies-to: version-updates
      patterns:
        - "*storybook*"
    # `tailwind-merge` and `tailwind-csstree` are deliberately outside this group: they are
    # independent packages that happen to start with the same word, not part of the v4 release train.
    tailwind:
      applies-to: version-updates
      patterns:
        - "tailwindcss*"
        - "@tailwindcss*"
    vue:
      applies-to: version-updates
      patterns:
        - "vue*"
        - "@vue*"
    # `vite*` also matches `vitest`, which would pull it out of the `vitest` group below and away from
    # `@vitest/coverage-v8` — and that one pins its `vitest` peer to an exact version. Excluded here so
    # the two vitest packages stay in one pull request.
    vite:
      applies-to: version-updates
      patterns:
        - "vite*"
        - "@vitejs*"
      exclude-patterns:
        - "vitest*"
    vitest:
      applies-to: version-updates
      patterns:
        - "vitest*"
        - "@vitest*"

# branding library — no `groups`: ten dependencies, none of them a family that arrives in a bundle,
# so grouping would only hide which one moved.
- package-ecosystem: npm
  open-pull-requests-limit: 99
  directory: "/packages/branding"
  schedule:
    interval: weekly
    day: "saturday"
    timezone: "Europe/Berlin"
    time: "03:00"

# ui examples
