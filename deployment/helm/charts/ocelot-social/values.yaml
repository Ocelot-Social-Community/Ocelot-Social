domain: stage.ocelot.social
redirect_domains: []

cert_manager:
  issuer:

underMaintenance: false

global:
  image:
    pullPolicy: IfNotPresent
    tag:

backend:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/backend
  storage: "10Gi"
  env:
    NEO4J_URI: "bolt://ocelot-social-neo4j:7687"

webapp:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/webapp
  # Rendered into the webapp ConfigMap VERBATIM (see templates/webapp/configmap.yml), so every value
  # has to be a QUOTED STRING: a ConfigMap's `data` is map[string]string, and an unquoted `true` or
  # `730` arrives as a YAML bool/int — the API server then rejects the whole manifest. The values shown
  # are the defaults; set only what differs.
  #
  #   env:
  #     # Name of the auth cookie holding the JWT. Set it to keep an instance's established sessions
  #     # alive when its cookie used to be named differently — nothing else depends on the name, and
  #     # cookies are host-only. NOT a branding value: deliberately not switchable while the app runs,
  #     # because renaming it mid-flight would end every session.
  #     COOKIE_NAME: "ocelot-social-token"
  #     # Comma-separated predecessor name(s) whose sessions are ADOPTED instead of dropped.
  #     # "" switches the adoption off.
  #     COOKIE_NAME_LEGACY: "ocelot-social-token"
  #     COOKIE_EXPIRE_TIME: "730" # session lifetime in days
  #     COOKIE_HTTPS_ONLY: "true" # send the cookie over HTTPS only (production default)
  env: {}

maintenance:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/maintenance
  # The support address shown on the maintenance page. Defaults to backend.env.SUPPORT_EMAIL — the
  # page is static, so its nginx entrypoint substitutes the value at startup instead of it being baked
  # into a per-brand image. Set this only to show a DIFFERENT address than the backend uses.
  supportEmail: ""

imagor:
  image:
    repository: shumc/imagor
    tag: 1.5.4

