domain: stage.ocelot.social
redirect_domains: []

cert_manager:
  issuer:

underMaintenance: false

global:
  image:
    pullPolicy: IfNotPresent
    tag:

backend:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/backend
  storage: "10Gi"
  env:
    NEO4J_URI: "bolt://ocelot-social-neo4j:7687"

webapp:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/webapp
  # Rendered into the webapp ConfigMap as-is (see templates/webapp/configmap.yml).
  #
  #   COOKIE_NAME         name of the auth cookie holding the JWT (default: "ocelot-social-token").
  #                       Set it to keep an instance's established sessions alive when its cookie used
  #                       to be named differently — nothing else depends on the name, cookies are
  #                       host-only. NOT a branding value: it is deliberately not switchable at
  #                       runtime, because renaming it mid-flight would end every session.
  #   COOKIE_NAME_LEGACY  comma-separated predecessor name(s) whose sessions are ADOPTED instead of
  #                       dropped (default: "ocelot-social-token"). Set "" to switch that off.
  #   COOKIE_EXPIRE_TIME  session lifetime in days (default: 730).
  #   COOKIE_HTTPS_ONLY   send the cookie over HTTPS only (default: true in production images).
  env: {}

maintenance:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/maintenance
  # The support address shown on the maintenance page. Defaults to backend.env.SUPPORT_EMAIL — the
  # page is static, so its nginx entrypoint substitutes the value at startup instead of it being baked
  # into a per-brand image. Set this only to show a DIFFERENT address than the backend uses.
  supportEmail: ""

imagor:
  image:
    repository: shumc/imagor
    tag: 1.5.4

