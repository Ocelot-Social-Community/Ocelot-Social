domain: stage.ocelot.social
redirect_domains: []

cert_manager:
  issuer:

underMaintenance: false

global:
  image:
    pullPolicy: IfNotPresent
    tag:

# Credentials for pulling images from private registries. Public images need none — leave this empty
# unless a repository the instance pulls from is actually private.
#
# `registries` generates a `kubernetes.io/dockerconfigjson` Secret and references it from every pod.
# Scope each entry to "host/path" rather than the bare host, so that several GHCR organizations with
# DIFFERENT tokens can coexist (see the "imagePullSecretDockerConfigJson" helper):
#
#   registries:
#     - registry: ghcr.io/it4change
#       username: ocelot-bot
#       password: ghp_...            # classic PAT, scope `read:packages` only
#     - registry: ghcr.io/ocelot-social-community
#       username: ocelot-bot
#       password: ghp_...
#
# Never put these into a plaintext values file — they come from the sops-encrypted
# `helmfile/environments/*.secrets.yaml` of a configuration, see deployment/deployment-values.md.
#
# `existingSecrets` references pull Secrets created outside this chart, additionally to the
# generated one. Use it to share a single Secret between the ocelot-social and ocelot-neo4j releases
# instead of having each chart generate its own copy.
imagePullCredentials:
  registries: []
  existingSecrets: []

backend:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/backend
  # `storage` used to size an uploads PVC. Uploads live in S3 since migration
  # 20250502230521-migrate-to-s3, the backend no longer touches disk, and the volume is gone — the
  # key is obsolete and safe to drop from an instance's values.
  migrations:
    # How long a starting pod waits for Neo4j to accept connections before it gives up. Neo4j is a
    # separate release and routinely needs several minutes; the default covers a 25 minute cold
    # start. The pod sits in Init during that time and costs nothing. Raising this also raises the
    # Deployment's progressDeadlineSeconds, which is derived from it.
    waitForDatabaseSeconds: 1500
  env:
    NEO4J_URI: "bolt://ocelot-social-neo4j:7687"

webapp:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/webapp
  # Rendered into the webapp ConfigMap VERBATIM (see templates/webapp/configmap.yml), so every value
  # has to be a QUOTED STRING: a ConfigMap's `data` is map[string]string, and an unquoted `true` or
  # `730` arrives as a YAML bool/int — the API server then rejects the whole manifest. The values shown
  # are the defaults; set only what differs.
  #
  #   env:
  #     # Name of the auth cookie holding the JWT. Set it to keep an instance's established sessions
  #     # alive when its cookie used to be named differently — nothing else depends on the name, and
  #     # cookies are host-only. NOT a branding value: deliberately not switchable while the app runs,
  #     # because renaming it mid-flight would end every session.
  #     COOKIE_NAME: "ocelot-social-token"
  #     # Comma-separated predecessor name(s) whose sessions are ADOPTED instead of dropped.
  #     # "" switches the adoption off.
  #     COOKIE_NAME_LEGACY: "ocelot-social-token"
  #     COOKIE_EXPIRE_TIME: "730" # session lifetime in days
  #     COOKIE_HTTPS_ONLY: "true" # send the cookie over HTTPS only (production default)
  env: {}

maintenance:
  image:
    repository: ghcr.io/ocelot-social-community/ocelot-social/maintenance
  # The support address shown on the maintenance page. Defaults to backend.env.SUPPORT_EMAIL — the
  # page is static, so its nginx entrypoint substitutes the value at startup instead of it being baked
  # into a per-brand image. Set this only to show a DIFFERENT address than the backend uses.
  supportEmail: ""

imagor:
  image:
    repository: shumc/imagor
    tag: 1.5.4

