---
{{- define "joinRedirectMiddlewares" -}}
{{- $local := dict "first" true -}}
{{- range $k, $v := .Values.redirect_domains -}}{{- if not $local.first -}},{{- end -}}{{$.Release.Namespace}}-redirect-{{- $v | replace "." "-" -}}@kubernetescrd{{- $_ := set $local "first" false -}}{{- end -}}
{{- end -}}
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-ocelot
  annotations:
    cert-manager.io/issuer: {{ .Values.cert_manager.issuer | default (printf "%s-letsencrypt-staging"  .Release.Name) }}
    traefik.ingress.kubernetes.io/router.middlewares: {{ quote (include "joinRedirectMiddlewares" $)}}
spec:
  tls:
  - hosts:
      - {{ quote .Values.domain }}
      {{- range .Values.redirect_domains }}
      - {{ quote . }}
      {{- end }}
    secretName: {{ .Release.Name }}-letsencrypt-tls

  rules:
  - host: {{ quote .Values.domain }}
    http:
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
            {{- if .Values.underMaintenance }}
              name: {{ .Release.Name }}-maintenance
              port:
                number: 80
            {{- else }}
              name: {{ .Release.Name }}-webapp
              port:
                number: 3000
            {{- end }}
  {{- range .Values.redirect_domains }}
  - host:  {{ quote . }} # the service must be defined, else the redirect is not working
    http:
      paths:
        - path: /
          pathType: ImplementationSpecific
          backend:
            service:
              name: {{ $.Release.Name }}-maintenance
              port:
                number: 80
  {{- end }}

{{- range .Values.redirect_domains }}
---
# Redirect with domain replacement
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: redirect-{{ . | replace "." "-" }}
spec:
  redirectRegex:
    regex: ^https://{{ . }}(.*)
    replacement: https://{{ $.Values.domain }}${1}
    permanent: true
{{- end }}

---
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: {{ .Release.Name }}-stripprefix
spec:
  stripPrefix:
    prefixes:
      - /imagor
      # `/api` -> `/`: the backend mounts Apollo at the root (server.ts). stripPrefix removes the
      # FIRST matching prefix, so one middleware serves both routes.
      - /api

---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ .Release.Name }}-path-prefixes
  annotations:
    traefik.ingress.kubernetes.io/router.middlewares: "{{ .Release.Namespace }}-{{ .Release.Name }}-stripprefix@kubernetescrd"
spec:
  rules:
  - host: {{ quote .Values.domain }}
    http:
      paths:
      - path: /imagor
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-imagor
            port:
              number: 8000
      {{- if not .Values.underMaintenance }}
      # Browser GraphQL (and the subscription websocket, `wss://<domain>/api/graphql`) goes STRAIGHT
      # to the backend instead of through the webapp's Nuxt proxy.
      #
      # Why: the webapp only proxies /api so the call stays SAME-ORIGIN — the auth cookie is
      # SameSite=lax and apollo sends `credentials: 'same-origin'` (webapp/plugins/apollo-config.js).
      # Routing here keeps that property (the browser still calls https://<domain>/api/…) while
      # taking the request out of the Nuxt process. That matters because Nuxt renders server-side in
      # ONE single-threaded event loop: a proxied API call has to queue behind whatever page is being
      # rendered. Measured locally against this stack, same query, backend answering in ~3 ms
      # throughout: +2 ms through the proxy while idle, but +75 ms at 2 concurrent renders and
      # +459 ms at 8 — while the direct path stayed flat. Traefik is a separate process, so the
      # coupling disappears.
      #
      # The Nuxt `proxy` block in nuxt.config.js STAYS: it is what serves /api in local development,
      # where there is no ingress. In the cluster the request never reaches Nuxt, so the two cannot
      # conflict — which also makes this safe to roll back by deleting this path.
      #
      # SSR-time queries are unaffected either way: they already bypass the proxy and talk to
      # $GRAPHQL_URI directly.
      #
      # Skipped under maintenance ON PURPOSE: /api then falls through to the `/` rule and lands on
      # the maintenance service, exactly as it does today. Taking the UI down while leaving the API
      # up would be a behaviour change, and migrations are the usual reason for the switch.
      - path: /api
        pathType: Prefix
        backend:
          service:
            name: {{ .Release.Name }}-backend
            port:
              number: 4000
      {{- end }}
