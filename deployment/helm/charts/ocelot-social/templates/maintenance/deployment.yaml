kind: Deployment
apiVersion: apps/v1
metadata:
  name:  {{ .Release.Name }}-maintenance
spec:
  selector:
    matchLabels:
      app: {{ .Release.Name }}-maintenance
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}-maintenance
    spec:
      restartPolicy: Always
      containers:
      - name: {{ .Release.Name }}-maintenance
        image: "{{ .Values.maintenance.image.repository }}:{{ .Values.maintenance.image.tag | default (include "defaultTag" .)  }}"
        imagePullPolicy: {{ quote .Values.global.image.pullPolicy }}
        {{- include "resources" .Values.maintenance.resources | indent 8 }}
        env:
          - name: HOST
            value: 0.0.0.0
          # The support address the page shows. Same value the backend gets — the page is static, so
          # its nginx entrypoint substitutes it into the built files at startup
          # (maintenance/nginx/40-support-email.sh) rather than it being baked in per brand image.
          # Unset → the vanilla ocelot address.
          {{- with .Values.maintenance.supportEmail | default (.Values.backend.env).SUPPORT_EMAIL }}
          - name: SUPPORT_EMAIL
            value: {{ quote . }}
          {{- end }}
        ports:
          - containerPort: 8080
