# Visual regression baseline update — renders screenshots on Linux so they match CI.
#
# Simplest usage — regenerate whatever differs from the current baselines:
#   webapp:      cd webapp && npm run test:visual:docker
#   packages/ui: cd packages/ui && npm run test:visual:docker
# These build Storybook natively first (fast, architecture-independent — the
# static HTML/JS/CSS output doesn't depend on the CPU that built it) and then
# run only the Playwright test/screenshot step in the amd64 container below,
# which is the part that actually needs to match CI's runner architecture.
# The webapp services deliberately do NOT build anything themselves — they run
# Playwright and nothing else. Two reasons. Speed: a Storybook build under amd64
# emulation costs minutes for output that is architecture-independent anyway.
# And it would not work: webapp's own webpack is v4 while the Storybook 7 builder
# needs the v5 in the repo ROOT node_modules (see the "Install root dependencies"
# step in webapp-visual.yml), which is not mounted here — the build dies inside
# builder-webpack5. So arrive with a freshly built storybook-static; the services
# refuse to run against a stale or missing one rather than silently screenshotting
# an outdated app (scripts/assert-fresh-storybook.js).
#
# Why a plain ubuntu:24.04 base instead of a prebuilt Playwright image: the
# actual GitHub Actions workflows (ui-visual.yml / webapp-visual.yml) run
# directly on the ubuntu-latest runner and call
# `npx playwright install chromium --with-deps` there — that installs
# Chromium plus current OS font/rendering packages live, at whatever
# versions Ubuntu's repos have *right now*. A prebuilt image (e.g.
# mcr.microsoft.com/playwright:...) freezes those same packages at the
# image's own build date, which silently drifts out of sync with CI over
# time — confirmed in practice: OsBadge's icon rendering matched a prebuilt
# image locally while still failing 2% different in real CI. Installing
# Node and Playwright's browser/deps fresh in every run, exactly like CI's
# own steps, is slower per run but is the only way that's actually
# guaranteed to match — no periodic image-drift debugging.
#
# Manual / advanced usage — build first, then run a service directly:
#   cd webapp && npm run build:file-packages && npm run build-storybook
# build:file-packages rebuilds @ocelot-social/branding and @ocelot-social/ui and
# forces npm to re-pack them. Both are `file:` dependencies whose dist/ is not
# committed, so a stale dist/ silently drops components from every screenshot —
# a dist/ predating OsRibbon is how PostTeaser baselines once disagreed with CI.
#
# webapp — New component (missing baseline):
#   docker compose -f docker-compose.visual.yml run --rm webapp-visual-update
# webapp — Existing component changed:
#   docker compose -f docker-compose.visual.yml run --rm webapp-visual-update-changed
#
# packages/ui — New component (missing baseline):
#   docker compose -f docker-compose.visual.yml run --rm ui-visual-update
# packages/ui — Existing component changed:
#   docker compose -f docker-compose.visual.yml run --rm ui-visual-update-changed
#
# Filter to specific component: -e TEST=OsValidationHint
#
# Node and Playwright's browser/OS deps are re-installed on every run (not
# cached) — that live install is the whole point, see above.
# After the run, commit the updated __screenshots__/ files.

x-visual-base: &visual-base
  image: ubuntu:24.04
  platform: linux/amd64
  working_dir: /app
  shm_size: '2gb'
  environment:
    - NODE_ENV=development
    - DEBIAN_FRONTEND=noninteractive
    # TEST filters which spec files Playwright runs — empty = all tests.
    # Override via: docker compose ... run --rm -e TEST=CommentCard webapp-visual-update-changed
    - TEST=
  volumes:
    - ./webapp:/app
    - webapp_visual_node_modules:/app/node_modules
    # Read-only: the container never builds these, it only lets assert-fresh-storybook.js compare
    # their mtimes against the bundle. Building them is the host's job (npm run build:file-packages).
    - ./packages/ui:/packages/ui:ro
    - ./packages/branding:/packages/branding:ro

services:
  # Every service below starts its command with the same four lines,
  # installing the exact Node version CI uses (webapp/.nvmrc and
  # packages/ui/.tool-versions both pin the same version) via NodeSource —
  # same effective binary actions/setup-node would install, just fetched
  # ourselves since this is a bare Ubuntu image, not a GitHub Actions runner.
  # YAML anchors can't be spliced into the middle of another scalar string,
  # so this is duplicated rather than shared.
  #
  # The webapp services then assert the bundle is current before touching anything else, so a stale
  # storybook-static fails with an explicit message instead of producing a green run against an
  # outdated app. `npm ci` afterwards is only for Playwright itself — node_modules has no
  # bearing on the screenshots, which come solely from storybook-static.
  webapp-visual-update:
    <<: *visual-base
    command: >
      /bin/bash -c "
        apt-get update -qq &&
        apt-get install -y -qq curl ca-certificates &&
        curl -fsSL https://deb.nodesource.com/setup_26.x | bash - &&
        apt-get install -y -qq nodejs &&
        node scripts/assert-fresh-storybook.js /packages/ui /packages/branding &&
        npm ci &&
        npx playwright install chromium --with-deps &&
        CI=true ./node_modules/.bin/playwright test --update-snapshots=missing $${TEST:-}
      "

  webapp-visual-update-changed:
    <<: *visual-base
    command: >
      /bin/bash -c "
        apt-get update -qq &&
        apt-get install -y -qq curl ca-certificates &&
        curl -fsSL https://deb.nodesource.com/setup_26.x | bash - &&
        apt-get install -y -qq nodejs &&
        node scripts/assert-fresh-storybook.js /packages/ui /packages/branding &&
        npm ci &&
        npx playwright install chromium --with-deps &&
        CI=true ./node_modules/.bin/playwright test --update-snapshots=changed $${TEST:-}
      "

  ui-visual-update:
    <<: *visual-base
    volumes:
      - ./packages/ui:/app
      - ui_visual_node_modules:/app/node_modules
    command: >
      /bin/bash -c "
        apt-get update -qq &&
        apt-get install -y -qq curl ca-certificates &&
        curl -fsSL https://deb.nodesource.com/setup_26.x | bash - &&
        apt-get install -y -qq nodejs &&
        npm install &&
        ([ -d storybook-static ] || npm run storybook:build) &&
        npx playwright install chromium --with-deps &&
        CI=true npx playwright test --update-snapshots=missing $${TEST:-}
      "

  ui-visual-update-changed:
    <<: *visual-base
    volumes:
      - ./packages/ui:/app
      - ui_visual_node_modules:/app/node_modules
    command: >
      /bin/bash -c "
        apt-get update -qq &&
        apt-get install -y -qq curl ca-certificates &&
        curl -fsSL https://deb.nodesource.com/setup_26.x | bash - &&
        apt-get install -y -qq nodejs &&
        npm install &&
        ([ -d storybook-static ] || npm run storybook:build) &&
        npx playwright install chromium --with-deps &&
        CI=true npx playwright test --update-snapshots=changed $${TEST:-}
      "

volumes:
  webapp_visual_node_modules:
  ui_visual_node_modules:
