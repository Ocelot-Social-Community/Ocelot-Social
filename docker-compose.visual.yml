# Visual regression baseline update — renders screenshots on Linux so they match CI.
#
# Usage:
#   docker compose -f docker-compose.visual.yml run --rm webapp-visual-update
#
# First run: ~10 min (yarn install + storybook build; result cached in named volume).
# Subsequent runs: much faster — yarn detects nothing changed, storybook rebuilds only.
#
# After the run, commit the updated __screenshots__/ files.

services:
  webapp-visual-update:
    image: mcr.microsoft.com/playwright:v1.61.1-noble
    working_dir: /app
    command: >
      /bin/bash -c "
        npm install -g yarn@1.22.22 --quiet &&
        PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1 yarn install &&
        node scripts/fix-storybook-webpack.js &&
        yarn build-storybook &&
        CI=true yarn test:visual:update
      "
    environment:
      - NODE_ENV=development
      - PLAYWRIGHT_BROWSERS_PATH=/ms-playwright
      - PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD=1
    volumes:
      - ./webapp:/app
      - webapp_visual_node_modules:/app/node_modules
      - ./packages/ui:/packages/ui
      - ./packages/branding:/packages/branding

volumes:
  webapp_visual_node_modules:
