services:

  webapp:
    image: ghcr.io/ocelot-social-community/ocelot-social/webapp:local-development
    build:
      target: development
    environment:
      - NODE_ENV="development"
      # - DEBUG=true
      - NUXT_BUILD=/tmp/nuxt # avoid file permission issues when `rm -rf .nuxt/`
    volumes:
      - ./webapp:/app
      - ./packages/ui:/packages/ui
      - /packages/ui/node_modules
      - ./packages/branding:/packages/branding
      # The brand archives, at the path the code looks in by default (no env needed — see
      # @ocelot-social/branding discover.DEFAULT_ROOTS). Build them with
      # `npm --prefix packages/branding run build:dev-brandings`, then pick one in the admin
      # Branding tab. READ-ONLY: the only thing the webapp writes is its sync cache, which lives in
      # ./webapp/.branding-cache — pointing it here would have it compete with your brand builds.
      - ./deployment/configurations:/app/deployment/configurations:ro

  backend:
    image: ghcr.io/ocelot-social-community/ocelot-social/backend:local-development
    # No host port for the backend's in-container S3 proxy (it binds 9000 inside
    # the container for its own uploads): host port 9000 is owned by minio below
    # — it serves both the browser-facing file URLs (anonymous-read bucket) and
    # the host-run backend test suite. Publishing it here too collides
    # ("Bind for 0.0.0.0:9000 failed: port is already allocated").
    depends_on:
      - minio
      - minio-mc
      - imagor
    build:
      target: development
    environment:
      - NODE_ENV="development"
      - SMTP_PORT=1025
      - SMTP_HOST=mailserver
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=12341234
      - AWS_ENDPOINT=http://localhost:9000
      - AWS_REGION=local
      - AWS_BUCKET=ocelot
      - IMAGOR_PUBLIC_URL=http://localhost:8000
      - IMAGOR_SECRET=mysecret
      - PROXY_S3=http://minio:9000
    volumes:
      - ./backend:/app
      - ./packages/branding:/packages/branding
      # Same archives, same default path (see the webapp service). The backend reads them only — it is
      # where every other service acquires them from, over GET /branding/…. Pin one for the backend
      # (its group limits / e-mail identity don't live-switch) with $OCELOT_ACTIVE_BRANDING.
      - ./deployment/configurations:/app/deployment/configurations:ro

  neo4j:
    ports:
      # Also expose the neo4j query browser
      - 7474:7474

  mailserver:
    image: maildev/maildev
    container_name: mailserver
    ports:
      - 1080:1080
      - 1025:1025

  minio:
    image: quay.io/minio/minio
    ports:
      # 9000 = S3 API, 9001 = web console. The backend test suite hits the S3
      # API at http://localhost:9000 (see backend/test/helpers.ts), so without
      # this port mapping image/file-touching tests fail with
      # "AWS SDK error wrapper for AggregateError".
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=12341234
    command: server /data --console-address ":9001"

  minio-mc:
    image: quay.io/minio/mc
    depends_on:
      - minio
    restart: on-failure
    volumes:
      - ./minio/readonly-policy.json:/tmp/readonly-policy.json
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minio 12341234;
      /usr/bin/mc mb --ignore-existing dockerminio/ocelot;
      /usr/bin/mc anonymous set-json /tmp/readonly-policy.json dockerminio/ocelot;
      "

  imagor:
    image: shumc/imagor:latest
    ports:
      - 8000:8000
    environment:
      PORT: 8000
      IMAGOR_SECRET: mysecret # secret key for URL signature
      # IMAGOR_UNSAFE: 1 # unsafe URL for testing
      AWS_ACCESS_KEY_ID: minio
      AWS_SECRET_ACCESS_KEY: 12341234
      AWS_ENDPOINT: http://minio:9000
      S3_FORCE_PATH_STYLE: 1
      S3_LOADER_BUCKET: ocelot # enable S3 loader by specifying bucket
      S3_STORAGE_BUCKET: ocelot # enable S3 storage by specifying bucket
      S3_RESULT_STORAGE_BUCKET: ocelot # enable S3 result storage by specifying bucket
      HTTP_LOADER_BASE_URL: http://minio:9000
      IMAGOR_CACHE_HEADER_TTL: 168h # 7 days

  maintenance:
    image: ghcr.io/ocelot-social-community/ocelot-social/maintenance:local-development
    build:
      target: development
    ports:
      - "3001:3000"
    volumes:
      # Hot-reload for vanilla maintenance dev. When baking a brand (uncomment the BRAND build arg in
      # docker-compose.yml), COMMENT OUT the ./maintenance/app mount below too — otherwise the vanilla
      # host sources shadow the baked branding.css / metadata.ts.
      - ./maintenance/app:/app/app
      - ./maintenance/nuxt.config.ts:/app/nuxt.config.ts
      - ./packages/ui:/packages/ui
      - /packages/ui/node_modules

  ui:
    image: ghcr.io/ocelot-social-community/ocelot-social/ui:local-development
    build:
      target: development
    volumes:
      - ./packages/ui:/app
      - /app/node_modules

  # Documentation site on http://localhost:8080 — the VuePress handbook with the
  # embedded GraphQL API reference at /api, built once (multi-stage) and served
  # statically by nginx. This is a build artifact: rebuild (`docker compose up
  # docs --build`) to pick up doc changes. For live-editing the handbook use
  # `npm run docs:dev` on the host; regenerate the API reference with `npm run docs:api`.
  docs:
    image: ghcr.io/ocelot-social-community/ocelot-social/documentation:local-development
    build:
      context: .
      dockerfile: ./.vuepress/Dockerfile
      target: production
    ports:
      - "8080:8080"

volumes:
  minio_data:
