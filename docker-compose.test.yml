services:

  webapp:
    # name the image so that it cannot be found in a DockerHub repository, otherwise it will not be built locally from the 'dockerfile' but pulled from there
    image: ghcr.io/ocelot-social-community/ocelot-social/webapp:test
    build:
      target: test
    environment:
      - NODE_ENV=test
      - API_KEYS_ENABLED=true
      - API_KEYS_MAX_PER_USER=5
      # Toasts live 15 s instead of iziToast's 5 s. Several Cypress steps assert on a toast AFTER a
      # wait (see cypress/support/step_definitions/admin/NetworkPolicy/I_save_the_policy_form.js,
      # which calls waitForNetworkIdle first), and with the default the assertion loses that race
      # whenever the action triggers enough follow-up traffic — it then retries for 60 s against an
      # element that has already dismissed itself. Not raised further on purpose: the toasts sit
      # bottom-right, and one that outlives the scenario could cover an element a later step clicks.
      - TOAST_TIMEOUT=15000
    volumes:
      - ./coverage:/app/coverage

  backend:
    # name the image so that it cannot be found in a DockerHub repository, otherwise it will not be built locally from the 'dockerfile' but pulled from there
    image: ghcr.io/ocelot-social-community/ocelot-social/backend:test
    depends_on:
      - minio
      - minio-mc
      - mailserver
    build:
      target: test
    environment:
      - NODE_ENV="test"
      - AWS_ACCESS_KEY_ID=minio
      - AWS_SECRET_ACCESS_KEY=12341234
      - AWS_ENDPOINT=http:/minio:9000
      - AWS_REGION=local
      - AWS_BUCKET=ocelot
      - DEBUG=
      - IMAGOR_PUBLIC_URL=http://localhost:8000
      - IMAGOR_SECRET=mysecret
      - PROXY_S3=http://minio:9000
      # Synthetic LiveKit config so videoCallConfig.enabled returns true and the
      # video-call e2e tests exercise the PreJoin UI. There is no real LiveKit
      # server in the CI compose stack — when the front end attempts to connect
      # against this fake URL it lands in the "error" phase, which is exactly
      # the path we want to exercise. See cypress/e2e/videoCall/PreJoin.feature.
      - LIVEKIT_URL=wss://livekit.example.test
      - LIVEKIT_API_KEY=test-key
      - LIVEKIT_API_SECRET=test-secret
    volumes:
      - ./coverage:/app/coverage
      # Two backend tests read the webapp's SOURCES to check the client against the schema:
      # webappQueries.spec.ts validates its GraphQL documents, webappPostFilters.spec.ts the
      # post filters it sends. The `test` image only copies `backend/`, so in the container
      # they find nothing — and a reader that finds nothing satisfies every assertion made
      # about what it read. Mounted read-only instead of COPYied, so the backend image stays a
      # backend image. `/webapp` is where the specs look: they resolve
      # `<backend>/src/graphql/../../../webapp`, and the backend lives at /app.
      - ./webapp:/webapp:ro

  maintenance:
    # name the image so that it cannot be found in a DockerHub repository, otherwise it will not be built locally from the 'dockerfile' but pulled from there
    image: ghcr.io/ocelot-social-community/ocelot-social/maintenance:test

  neo4j:
    # name the image so that it cannot be found in a DockerHub repository, otherwise it will not be built locally from the 'dockerfile' but pulled from there
    image: ghcr.io/ocelot-social-community/ocelot-social/neo4j:community
    build:
      context: ./neo4j
      target: community
    #environment:
    #  - NEO4J_dbms_connector_bolt_enabled=true
    #  - NEO4J_dbms_connector_bolt_tls__level=OPTIONAL
    #  - NEO4J_dbms_connector_bolt_listen__address=0.0.0.0:7687
    #  - NEO4J_auth=none
    #  - NEO4J_dbms_connectors_default__listen__address=0.0.0.0
    #  - NEO4J_dbms_connector_http_listen__address=0.0.0.0:7474
    #  - NEO4J_dbms_connector_https_listen__address=0.0.0.0:7473

  mailserver:
    image: maildev/maildev
    ports:
      - 1080:1080
      - 1025:1025

  minio:
    # MinIO stopped publishing free community images: Docker Hub deleted the
    # repositories in September 2026, quay.io locked them down days later, and
    # the upstream repository is archived and source-only. Chainguard rebuilds
    # the same server and serves it anonymously on its free tier.
    # Entrypoint is `/usr/bin/minio` (not the old docker-entrypoint.sh), so the
    # `command:` below still arrives as its arguments.
    #
    # Unlike the quay.io image it runs as UID 65532 rather than root. A FRESH
    # named volume still works, but not because of ownership: /data in the image
    # is root-owned and mode 0777, and that mode is what the volume inherits. An
    # EXISTING volume written by the old image is root-owned 0755 instead, and
    # minio dies on it with "Unable to initialize backend: Unable to write to
    # the backend". The accompanying "drive may be faulty, please investigate"
    # reads like data loss and is not, and minio's own hint
    # (`sudo chown -R nonroot. <path>`) misleads as well — the path is inside a
    # Docker volume, not on the host. Hand the ownership over from a container:
    #
    #   docker compose rm -sf minio
    #   docker run --rm -v ocelot-social_minio_data:/data busybox \
    #     chown -R 65532:65532 /data
    #
    # Deliberately a documented one-time step (see README.md) rather than an
    # init container that chowns on every start: this is the dev and test stack
    # only, CI always begins with an empty volume, so it is needed once per
    # developer — not worth a permanently root-running service in here.
    image: cgr.dev/chainguard/minio
    ports:
      - 9000:9000
      - 9001:9001
    volumes:
      - minio_data:/data
    environment:
      - MINIO_ROOT_USER=minio
      - MINIO_ROOT_PASSWORD=12341234
    command: server /data --console-address ":9001"

  minio-mc:
    # `-dev` deliberately: the plain Chainguard image has no /bin/sh at all
    # (only bash, incidentally), and the entrypoint below is a shell script. A
    # guaranteed shell is what the -dev variant is for; relying on bash
    # happening to stay in a minimal image is how this breaks again silently.
    image: cgr.dev/chainguard/minio-client:latest-dev
    depends_on:
      - minio
    restart: on-failure
    volumes:
      - ./minio/readonly-policy.json:/tmp/readonly-policy.json
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      /usr/bin/mc alias set dockerminio http://minio:9000 minio 12341234;
      /usr/bin/mc mb --ignore-existing dockerminio/ocelot;
      /usr/bin/mc anonymous set-json /tmp/readonly-policy.json dockerminio/ocelot;
      "

volumes:
  minio_data:
